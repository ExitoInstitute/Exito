ón a contratar: pedir la palabra", "formato": "Selfie hablando", "contenido": "Esmeralda: «Si no sabes cuánto apartar de cada cobro, lo calculamos contigo. Respóndeme CITA.»", "interaccion": "Responder con CITA", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Si no sabes cuánto apartar de cada cobro, lo calculamos contigo. Respóndeme CITA.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Agrega un texto grande que diga «Respóndeme CITA». A quien responda, mándale por DM el mensaje de CITA que está en las instrucciones del post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Formato: 1080 x 1350 px (vertical). Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha.", "Fondo o foto: Foto de Esmeralda con la frase grande al lado. Tipografía de Éxito Institute.", "Texto principal (grande, arriba o al centro): \"«Lo que te llega completo no es todo tuyo.»\"", "Texto secundario (más pequeño, abajo): \"Esmeralda Espinoza · Éxito Institute\".", "Deja espacio libre alrededor del texto. Se tiene que leer en 3 segundos desde el celular.", "Publica a las 1:00 p. m. hora de la audiencia. Pega el caption tal cual.", "Cuando alguien comente o escriba CITA: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Con gusto te ayudamos. ¿Qué día y hora te queda mejor esta semana? Déjanos también tu nombre y tu número y te confirmamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Domingo"}, {"fecha": "2027-01-18", "cuenta": "EI", "semana": 8, "formato": "Reel", "objetivo": "Seguidores", "tema": "Le pagaste a alguien que te ayudó", "tipo_gancho": "Pregunta inducida", "gancho_texto": "¿Le pagaste a alguien que te ayudó en 2026?", "gancho_hablado": "¿En 2026 le pagaste a alguien que te ayudó con tu negocio? El pintor, la muchacha que limpia, el muchacho que te hizo el logo.", "visual": "Esmeralda reparte billetes en tres montoncitos con papelitos que dicen: Pintor, Limpieza, Logo.", "desarrollo": ["Cuando tu negocio le paga a alguien que no es tu empleado, puede que tengas que darle un formulario y mandar copia al IRS.", "Y tiene fecha: el 1 de febrero.", "Si no lo haces, ese gasto que sí pagaste se puede quedar en duda. Y puede haber multa.", "Hoy mismo haz la lista: a quién le pagaste en 2026 y cuánto. Y pídeles su nombre completo, dirección y número de identificación fiscal antes de que se te pase.", "Lo que le pagas a otros también deja huella. Mejor que la dejes tú, a tiempo.", "Esta semana te contamos los gastos del negocio que casi todos olvidan. Síguenos para verlo mañana."], "cta": "Síguenos: mañana, los gastos del negocio que casi todos olvidan.", "caption": "El pintor, la muchacha de la limpieza, el que te hizo el logo.\nSi les pagaste en 2026, revisa esto antes del 1 de febrero.\nSíguenos: mañana seguimos con los gastos que se olvidan.", "calculadora": 15, "notas": "[VALIDAR] desde qué monto hay que entregar el formulario por pagos de 2026 y la multa. No decir cifras en el video. [VALIDAR] también la fecha del 1 de febrero de 2027.", "historias": [{"proposito": "Cercanía: detrás de cámaras", "formato": "B-roll con texto", "contenido": "Video del equipo preparando formularios. Texto: Temporada de formularios. Aquí no se para.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video del equipo preparando formularios.", "Escribe arriba, en letra grande y máximo dos líneas: \"Temporada de formularios. Aquí no se para.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Cercanía: pregunta", "formato": "Encuesta", "contenido": "¿Le pagaste a alguien que te ayudó en tu negocio en 2026?", "interaccion": "Encuesta: Sí / No", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Le pagaste a alguien que te ayudó en tu negocio en 2026?\"", "Pon el sticker ENCUESTA con estas opciones: Sí / No.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Prepara antes de grabar: Mesa de la oficina. Objetos: billetes de utilería y tres papelitos escritos a mano: PINTOR, LIMPIEZA, LOGO. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda reparte billetes en tres montoncitos con papelitos que dicen: Pintor, Limpieza, Logo. Esmeralda dice: \"¿En 2026 le pagaste a alguien que te ayudó con tu negocio? El pintor, la muchacha que limpia, el muchacho que te hizo el logo.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 13): plano cerrado a la cara. Dice: \"Contexto: Cuando tu negocio le paga a alguien que no es tu empleado, puede que tengas que darle un formulario y mandar copia al IRS.\"", "Toma 3 (segundo 13 a 16): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Y tiene fecha: el 1 de febrero.\"", "Toma 4 (segundo 16 a 23): plano cerrado a la cara. Dice: \"Si no lo haces, ese gasto que sí pagaste se puede quedar en duda. Y puede haber multa.\"", "Toma 5 (segundo 23 a 35): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Hoy mismo haz la lista: a quién le pagaste en 2026 y cuánto. Y pídeles su nombre completo, dirección y número de identificación fiscal antes de que se te pase.\"", "Toma 6 (segundo 35 a 42): plano cerrado a la cara. Dice: \"Moraleja: lo que le pagas a otros también deja huella. Mejor que la dejes tú, a tiempo.\"", "Toma 7 (segundo 42 a 49): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"CTA: Esta semana te contamos los gastos del negocio que casi todos olvidan. Síguenos para verlo mañana.\"", "Texto en pantalla del segundo 0 al 3: \"¿Le pagaste a alguien que te ayudó en 2026?\" Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"¿A quién le pagaste?\"; segundo 13: \"1 de febrero\"; segundo 16: \"Haz la lista hoy\"; segundo 23: \"Pide sus datos\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 49 segundos.", "Últimos 3 segundos: pon en pantalla \"Síguenos: mañana, los gastos del negocio que casi todos olvidan.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"¿Le pagaste a alguien que te ayudó en 2026?\" Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Contesta todos los comentarios en la primera hora con una frase corta y cercana. Si alguien pregunta por su caso, invítalo a escribir por mensaje y ahí le mandas el texto de CITA."], "dia": "Lunes"}, {"fecha": "2027-01-19", "cuenta": "EI", "semana": 8, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Gastos del negocio que se olvidan", "tipo_gancho": "Fact", "gancho_texto": "Estás pagando impuestos sobre dinero que ya gastaste", "gancho_hablado": "Estás pagando impuestos sobre dinero que ya gastaste.", "visual": "Portada con un recibo largo con varias líneas marcadas en amarillo.", "desarrollo": ["Estás pagando impuestos sobre dinero que ya gastaste. Estos gastos del negocio se olvidan cada año.", "Las millas que manejaste para el negocio. Anota fecha, a dónde fuiste y para qué.", "La parte del celular y del internet que usas para trabajar.", "Herramientas, uniformes y material de trabajo.", "Cursos que te ayudan a hacer mejor tu trabajo.", "Lo que le pagaste a quien te ayudó.", "Una regla para todo: si no tienes el recibo o la nota, es como si no lo hubieras gastado.", "Guárdalo y llévalo a tu cita de impuestos."], "cta": "Guárdalo y llévalo a tu cita de impuestos.", "caption": "Cada gasto del negocio que se te olvida es dinero que le pagas de más al IRS.\nGuárdalo y revísalo con quien te hace los impuestos.", "calculadora": null, "notas": "[VALIDAR] cada tipo de gasto y sus requisitos para 2026. Aclarar en comentarios que depende de cada caso.", "historias": [{"proposito": "Problema de todos los días", "formato": "Encuesta", "contenido": "¿Anotaste las millas que manejaste para tu negocio en 2026?", "interaccion": "Encuesta: Sí, todas / ¿Se tienen que anotar?", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Anotaste las millas que manejaste para tu negocio en 2026?\"", "Pon el sticker ENCUESTA con estas opciones: Sí, todas / ¿Se tienen que anotar?.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Problema: consecuencia", "formato": "Foto con texto", "contenido": "Foto del tablero de un carro con el millaje. Texto: Cada viaje que no anotaste es un gasto que no puedes probar. Hoy subimos la lista.", "interaccion": "Enlace al post", "pasos": ["Fondo: Foto del tablero de un carro con el millaje. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"Cada viaje que no anotaste es un gasto que no puedes probar. Hoy subimos la lista.\"", "Comparte en la historia el post de hoy (botón del avión de papel, «Agregar a tu historia») para que lo toquen y vayan al post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con un recibo largo con varias líneas marcadas en amarillo. Título grande: \"Estás pagando impuestos sobre dinero que ya gastaste\". Nada más en la portada.", "Slide 2: escribe \"Las millas que manejaste para el negocio. Anota fecha, a dónde fuiste y para qué.\" La primera frase en negrita.", "Slide 3: escribe \"La parte del celular y del internet que usas para trabajar.\" La primera frase en negrita.", "Slide 4: escribe \"Herramientas, uniformes y material de trabajo.\" La primera frase en negrita.", "Slide 5: escribe \"Cursos que te ayudan a hacer mejor tu trabajo.\" La primera frase en negrita.", "Slide 6: escribe \"Lo que le pagaste a quien te ayudó.\" La primera frase en negrita.", "Slide 7: escribe \"Una regla para todo: si no tienes el recibo o la nota, es como si no lo hubieras gastado.\" La primera frase en negrita.", "Slide 8: escribe \"Guárdalo y llévalo a tu cita de impuestos.\" La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Contesta todos los comentarios en la primera hora con una frase corta y cercana. Si alguien pregunta por su caso, invítalo a escribir por mensaje y ahí le mandas el texto de CITA."], "dia": "Martes"}, {"fecha": "2027-01-20", "cuenta": "EI", "semana": 8, "formato": "Reel", "objetivo": "Venta", "tema": "Mi primo me hace los taxes", "tipo_gancho": "Pregunta incómoda", "gancho_texto": "Tu primo te hace los taxes gratis. ¿Y si el IRS pregunta?", "gancho_hablado": "Tu primo te hace los impuestos gratis. Qué bien. ¿Y si el IRS pregunta, quién le contesta?", "visual": "Sketch: Esmeralda hace dos personajes en la misma mesa. El primo con gorra y ella con lentes.", "desarrollo": ["Primo (con gorra): Ya quedó, prima. Te salió un buen reembolso.", "Esmeralda (con lentes): ¿Y de dónde salió ese número? ¿Y si me llega una carta?", "Esmeralda a cámara: El primo lo hace con cariño, y está bien. Pero si el IRS te manda una carta, el primo no va a ir contigo a contestarla. Vas a ir tú.", "Antes de firmar, pregúntale a tu primo qué harían si llega una carta del IRS. Si no sabe, ya tienes tu respuesta.", "Lo gratis también se paga. A veces más tarde y más caro.", "Si quieres que revisemos tu declaración del año pasado antes de hacer la nueva, comenta CITA."], "cta": "Comenta CITA y revisamos tu declaración del año pasado.", "caption": "Tu primo te ayuda con buena intención.\nPero si el IRS pregunta, el que tiene que contestar eres tú.\nComenta CITA y revisamos tu declaración del año pasado.", "calculadora": 16, "notas": "Tono con humor, sin burlarse de nadie. No hablar mal de otros preparadores.", "historias": [{"proposito": "Romper una duda: «Ya lo tengo resuelto»", "formato": "B-roll con texto", "contenido": "Video de carpetas archivadas por año. Texto: Guardamos copia de todo lo que preparamos. Si el IRS pregunta, sabemos de dónde salió cada número.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video de carpetas archivadas por año.", "Escribe arriba, en letra grande y máximo dos líneas: \"Guardamos copia de todo lo que preparamos. Si el IRS pregunta, sabemos de dónde salió cada número.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Romper una duda: «Ya lo tengo resuelto» (la respuesta)", "formato": "Encuesta", "contenido": "¿Quién te hizo los impuestos el año pasado?", "interaccion": "Encuesta: Un profesional / Un familiar o yo", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Quién te hizo los impuestos el año pasado?\"", "Pon el sticker ENCUESTA con estas opciones: Un profesional / Un familiar o yo.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Prepara antes de grabar: Mesa de comedor. Vestuario: una gorra para el primo y unos lentes para Esmeralda. Se graba cada personaje por separado y se intercalan en edición. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Sketch: Esmeralda hace dos personajes en la misma mesa. El primo con gorra y ella con lentes. Esmeralda dice: \"Tu primo te hace los impuestos gratis. Qué bien. ¿Y si el IRS pregunta, quién le contesta?\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 7): plano del personaje que habla. Dice: \"Primo (con gorra): Ya quedó, prima. Te salió un buen reembolso.\"", "Toma 3 (segundo 7 a 13): plano del personaje que habla. Dice: \"Esmeralda (con lentes): ¿Y de dónde salió ese número? ¿Y si me llega una carta?\"", "Toma 4 (segundo 13 a 26): plano cerrado a la cara. Dice: \"Esmeralda a cámara: El primo lo hace con cariño, y está bien. Pero si el IRS te manda una carta, el primo no va a ir contigo a contestarla. Vas a ir tú.\"", "Toma 5 (segundo 26 a 34): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Antes de firmar, pregúntale a tu primo qué harían si llega una carta del IRS. Si no sabe, ya tienes tu respuesta.\"", "Toma 6 (segundo 34 a 39): plano cerrado a la cara. Dice: \"Moraleja: lo gratis también se paga. A veces más tarde y más caro.\"", "Toma 7 (segundo 39 a 46): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"CTA: Si quieres que revisemos tu declaración del año pasado antes de hacer la nueva, comenta CITA.\"", "Texto en pantalla del segundo 0 al 3: \"Tu primo te hace los taxes gratis. ¿Y si el IRS pregunta?\" Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"«Te salió buen reembolso»\"; segundo 7: \"¿De dónde salió?\"; segundo 13: \"La carta te llega a ti\"; segundo 26: \"¿Y si llega una carta?\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 46 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta CITA y revisamos tu declaración del año pasado.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Tu primo te hace los taxes gratis. ¿Y si el IRS pregunta?\" Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Cuando alguien comente o escriba CITA: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Con gusto te ayudamos. ¿Qué día y hora te queda mejor esta semana? Déjanos también tu nombre y tu número y te confirmamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Miércoles"}, {"fecha": "2027-01-21", "cuenta": "EI", "semana": 8, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Fecha: 1 de febrero", "tipo_gancho": "Fecha límite", "gancho_texto": "1 de febrero: la fecha que muchos negocios olvidan", "gancho_hablado": "1 de febrero: la fecha que muchos negocios olvidan", "visual": "Calendario con el 1 de febrero marcado y dos íconos: una persona con gafete y una con caja de herramientas.", "desarrollo": ["1 de febrero: la fecha que muchos negocios olvidan.", "Si tuviste empleados o le pagaste a ayudantes en 2026, es la fecha para entregarles sus formularios. Información general: tu caso puede ser distinto."], "cta": "Pregúntanos en historias si te toca.", "caption": "Si en 2026 tuviste empleados o le pagaste a gente que te ayudó, el 1 de febrero es tu fecha.\n¿No sabes si te toca? Pregúntanos en historias.", "calculadora": null, "notas": "[VALIDAR] la fecha y desde qué monto aplica para pagos de 2026.", "historias": [{"proposito": "Caja de preguntas", "formato": "Caja de preguntas", "contenido": "¿Le pagaste a alguien en 2026 y no sabes si tienes que darle un formulario? Pregúntame.", "interaccion": "Caja de preguntas", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Le pagaste a alguien en 2026 y no sabes si tienes que darle un formulario? Pregúntame.\"", "Pon el sticker PREGUNTAS con el texto «Pregúntame aquí». Guarda las preguntas: Esmeralda contesta 2 o 3 en historias esa misma tarde o el siguiente jueves.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Respuesta a una pregunta", "formato": "Selfie hablando", "contenido": "Esmeralda responde una pregunta que haya llegado. Ejemplo si no llega ninguna: «¿Y si le pagué en efectivo?» Respuesta corta: igual cuenta, lo importante es que lo tengas anotado.", "interaccion": "Ninguna", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda responde una pregunta que haya llegado. Ejemplo si no llega ninguna: «¿Y si le pagué en efectivo?» Respuesta corta: igual cuenta, lo importante es que lo tengas anotado. Lee la pregunta en voz alta antes de contestar y pon la pregunta escrita arriba en pantalla.", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Sin sticker.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha.", "Fondo o foto: Calendario con el 1 de febrero marcado y dos íconos: una persona con gafete y una con caja de herramientas.", "Texto principal (grande, arriba o al centro): \"1 de febrero: la fecha que muchos negocios olvidan.\"", "Texto secundario (más pequeño, abajo): \"Si tuviste empleados o le pagaste a ayudantes en 2026, es la fecha para entregarles sus formularios. Información general: tu caso puede ser distinto.\"", "Deja espacio libre alrededor del texto. Se tiene que leer en 3 segundos desde el celular.", "Publica a las 1:00 p. m. hora de la audiencia. Pega el caption tal cual.", "Contesta todos los comentarios en la primera hora con una frase corta y cercana. Si alguien pregunta por su caso, invítalo a escribir por mensaje y ahí le mandas el texto de CITA."], "dia": "Jueves"}, {"fecha": "2027-01-22", "cuenta": "EI", "semana": 8, "formato": "Reel", "objetivo": "Venta", "tema": "Manejaste para una app", "tipo_gancho": "Si tú", "gancho_texto": "Si manejaste para una app en 2026, mira esto", "gancho_hablado": "Si en 2026 manejaste para una app de viajes o de entregas, en estas semanas te va a llegar un papel. Y el IRS también lo va a tener.", "visual": "Esmeralda sentada en el asiento de un carro, con el celular en el soporte y una libreta en las piernas.", "desarrollo": ["La app reporta lo que te pagó. Ese número el IRS ya lo tiene.", "Pero mucha gente olvida la otra mitad: todo lo que gastaste para poder trabajar.", "Las millas que manejaste trabajando, o los gastos del carro, según lo que más te convenga [VALIDAR]. Y la parte del celular que usas para la app.", "Si no las anotaste, revisa el historial de la app y tu calendario. Todavía puedes reconstruir buena parte.", "Y si usaste el mismo carro para la app y para tu vida, separa bien: solo cuenta lo que manejaste trabajando. Ir al súper no entra.", "Lo que te pagaron ya lo saben. Lo que gastaste, solo tú lo puedes demostrar.", "Comenta REFUND y te mando la lista de lo que necesitas llevar para declarar."], "cta": "Comenta REFUND y te mandamos la lista de lo que tienes que llevar.", "caption": "Si manejaste para una app en 2026, esto te va a llegar en estas semanas.\nLa app ya avisó cuánto te pagó. Tus gastos solo los puedes probar tú.\nComenta REFUND y te mandamos la lista.", "calculadora": 16, "notas": "[VALIDAR] desde qué monto las apps mandan el formulario por pagos de 2026 y qué gastos aplican. No decir nombres de apps. [VALIDAR] millas o gastos reales del carro: normalmente se elige una de las dos formas, no las dos.", "historias": [{"proposito": "Regalo gratis: enseñar el regalo", "formato": "POV con papeles", "contenido": "Manos anotando millas en una libreta dentro del carro. Texto: ¿Anotaste tus millas de 2026?", "interaccion": "Encuesta: Sí / ¿Se anotan?", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Manos anotando millas en una libreta dentro del carro.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Anotaste tus millas de 2026?\"", "Pon música suave de Instagram, muy baja.", "Pon el sticker ENCUESTA con estas opciones: Sí / ¿Se anotan?.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Regalo gratis: pedir la palabra", "formato": "Selfie hablando", "contenido": "Esmeralda: «Si trabajas con una app, respóndeme REFUND y te mando la lista de lo que tienes que juntar.»", "interaccion": "Responder con REFUND", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Si trabajas con una app, respóndeme REFUND y te mando la lista de lo que tienes que juntar.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Agrega un texto grande que diga «Respóndeme REFUND». A quien responda, mándale por DM el mensaje de REFUND que está en las instrucciones del post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Prepara antes de grabar: Dentro de un carro estacionado, con luz de día por la ventana. Objetos: celular en soporte, libreta y pluma. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda sentada en el asiento de un carro, con el celular en el soporte y una libreta en las piernas. Esmeralda dice: \"Si en 2026 manejaste para una app de viajes o de entregas, en estas semanas te va a llegar un papel. Y el IRS también lo va a tener.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 8): plano cerrado a la cara. Dice: \"Contexto: La app reporta lo que te pagó. Ese número el IRS ya lo tiene.\"", "Toma 3 (segundo 8 a 13): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Pero mucha gente olvida la otra mitad: todo lo que gastaste para poder trabajar.\"", "Toma 4 (segundo 13 a 18): plano cerrado a la cara. Dice: \"Las millas que manejaste trabajando, o los gastos del carro, según lo que más te convenga [VALIDAR]. Y la parte del celular que usas para la app.\"", "Toma 5 (segundo 18 a 25): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Si no las anotaste, revisa el historial de la app y tu calendario. Todavía puedes reconstruir buena parte.\"", "Toma 6 (segundo 25 a 35): plano cerrado a la cara. Dice: \"Y si usaste el mismo carro para la app y para tu vida, separa bien: solo cuenta lo que manejaste trabajando. Ir al súper no entra.\"", "Toma 7 (segundo 35 a 41): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Moraleja: lo que te pagaron ya lo saben. Lo que gastaste, solo tú lo puedes demostrar.\"", "Toma 8 (segundo 41 a 47): plano cerrado a la cara. Dice: \"CTA: Comenta REFUND y te mando la lista de lo que necesitas llevar para declarar.\"", "Texto en pantalla del segundo 0 al 3: \"Si manejaste para una app en 2026, mira esto\". Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"La app ya reportó\"; segundo 8: \"La otra mitad: tus gastos\"; segundo 13: \"Millas, gasolina, celular\"; segundo 18: \"Reconstruye con el historial\"; segundo 25: \"Ir al súper no entra\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 47 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta REFUND y te mandamos la lista de lo que tienes que llevar.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Si manejaste para una app en 2026, mira esto\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Cuando alguien comente o escriba REFUND: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Aquí tienes la lista de papeles que vas a necesitar para declarar 👉 [enlace al PDF]. Si tienes dudas de tu caso, responde CITA.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Viernes"}, {"fecha": "2027-01-23", "cuenta": "EI", "semana": 8, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Diagnóstico express: conseguiste trabajo fijo", "tipo_gancho": "Situación", "gancho_texto": "Conseguiste trabajo fijo. ¿Y tu negocio de lado?", "gancho_hablado": "Conseguiste trabajo fijo. ¿Qué haces con el negocio que tenías de lado?", "visual": "Portada con un gafete de empleado sobre una caja de cartón que dice «Mi negocio». Sello: Diagnóstico express.", "desarrollo": ["Diagnóstico express. Conseguiste trabajo fijo. ¿Qué haces con el negocio que tenías de lado?", "Nos lo preguntan seguido: tengo dos negocios registrados y acabo de entrar a un trabajo de tiempo completo. ¿Los cierro?", "Primera pregunta: ¿el negocio va a seguir vendiendo, aunque sea poco? Entonces sigue teniendo ingresos que reportar.", "Segunda: ¿tiene gastos fijos que pagas aunque no venda? Ahí puede estar la respuesta.", "Ojo: cerrar un negocio registrado también lleva pasos y papeles. No basta con dejar de usarlo.", "La decisión sale de tus números, no de lo que hizo tu compadre.", "¿Estás en esta situación? Comenta CITA y lo vemos con tus números."], "cta": "Comenta CITA si estás en esta situación.", "caption": "Nos lo preguntan seguido: conseguí trabajo fijo, ¿cierro mi negocio?\nAntes de cerrarlo, revisa esto.\nComenta CITA si estás en esta situación.", "calculadora": null, "notas": "[VALIDAR] el slide 5 con la parte legal. No publicar datos de nadie que haya hecho la pregunta.", "historias": [{"proposito": "Prueba social", "formato": "Captura de DM anonimizada", "contenido": "«Gracias, ya entendí que no tenía que cerrarlo, solo ordenarlo.» [caso real a confirmar]", "interaccion": "Ninguna", "pasos": ["Toma captura del mensaje real. Borra nombre y foto de la persona y ponla centrada sobre fondo negro.", "El mensaje que se tiene que leer: «Gracias, ya entendí que no tenía que cerrarlo, solo ordenarlo.»", "Pide permiso a la persona antes de subirla. Si no hay mensaje real, no la subas: cambia esta historia por una foto de la oficina con el texto «¿Te ha pasado?».", "Sin sticker.", "Antes de subirla: confirma con Esmeralda que el caso es real y que hay permiso. La marca [caso real a confirmar] no se escribe en pantalla. Si no es real, no subas esta historia.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Prueba social: invitación", "formato": "Caja de preguntas", "contenido": "¿Tienes un negocio de lado además de tu trabajo? Cuéntame tu caso.", "interaccion": "Caja de preguntas", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Tienes un negocio de lado además de tu trabajo? Cuéntame tu caso.\"", "Pon el sticker PREGUNTAS con el texto «Pregúntame aquí». Guarda las preguntas: Esmeralda contesta 2 o 3 en historias esa misma tarde o el siguiente jueves.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con un gafete de empleado sobre una caja de cartón que dice «Mi negocio». Sello: Diagnóstico express. Título grande: \"Conseguiste trabajo fijo. ¿Y tu negocio de lado?\" Nada más en la portada.", "Slide 2: escribe \"Nos lo preguntan seguido: tengo dos negocios registrados y acabo de entrar a un trabajo de tiempo completo. ¿Los cierro?\" La primera frase en negrita.", "Slide 3: escribe \"Primera pregunta: ¿el negocio va a seguir vendiendo, aunque sea poco? Entonces sigue teniendo ingresos que reportar.\" La primera frase en negrita.", "Slide 4: escribe \"Segunda: ¿tiene gastos fijos que pagas aunque no venda? Ahí puede estar la respuesta.\" La primera frase en negrita.", "Slide 5: escribe \"Ojo: cerrar un negocio registrado también lleva pasos y papeles. No basta con dejar de usarlo.\" La primera frase en negrita.", "Slide 6: escribe \"La decisión sale de tus números, no de lo que hizo tu compadre.\" La primera frase en negrita.", "Slide 7: escribe \"¿Estás en esta situación? Comenta CITA y lo vemos con tus números.\" La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Cuando alguien comente o escriba CITA: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Con gusto te ayudamos. ¿Qué día y hora te queda mejor esta semana? Déjanos también tu nombre y tu número y te confirmamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Sábado"}, {"fecha": "2027-01-24", "cuenta": "EI", "semana": 8, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Si no sabes cuánto te pagas", "tipo_gancho": "Fact", "gancho_texto": "Si no sabes cuánto te pagas, tu negocio tampoco", "gancho_hablado": "Si no sabes cuánto te pagas, tu negocio tampoco lo sabe", "visual": "Foto de Esmeralda en su escritorio, mirando a cámara. Frase grande en la parte de arriba.", "desarrollo": ["«Si no sabes cuánto te pagas, tu negocio tampoco lo sabe.»", "Esmeralda Espinoza · Éxito Institute"], "cta": "Comenta LIBROS y te ayudamos a ponerte un sueldo.", "caption": "El primer número que deberías saber de tu negocio es cuánto te paga a ti.\nSi no lo sabes, comenta LIBROS y empezamos por ahí.", "calculadora": null, "notas": "Retoma la idea del reel del 4 de enero. Sin cifras.", "historias": [{"proposito": "Invitación a contratar: mostrar un caso", "formato": "Foto con texto", "contenido": "Foto de un resumen mensual con una línea que dice «Tu sueldo» (datos borrosos). Texto: Este número aparece en el resumen de cada cliente.", "interaccion": "Ninguna", "pasos": ["Fondo: Foto de un resumen mensual con una línea que dice «Tu sueldo» (datos borrosos). En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"Este número aparece en el resumen de cada cliente.\"", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Invitación a contratar: pedir la palabra", "formato": "Selfie hablando", "contenido": "Esmeralda: «Si quieres empezar febrero con tus números al día, respóndeme LIBROS y te explico cómo trabajamos.»", "interaccion": "Responder con LIBROS", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Si quieres empezar febrero con tus números al día, respóndeme LIBROS y te explico cómo trabajamos.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Agrega un texto grande que diga «Respóndeme LIBROS». A quien responda, mándale por DM el mensaje de LIBROS que está en las instrucciones del post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Formato: 1080 x 1350 px (vertical). Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha.", "Fondo o foto: Foto de Esmeralda en su escritorio, mirando a cámara. Frase grande en la parte de arriba.", "Texto principal (grande, arriba o al centro): \"«Si no sabes cuánto te pagas, tu negocio tampoco lo sabe.»\"", "Texto secundario (más pequeño, abajo): \"Esmeralda Espinoza · Éxito Institute\".", "Deja espacio libre alrededor del texto. Se tiene que leer en 3 segundos desde el celular.", "Publica a las 1:00 p. m. hora de la audiencia. Pega el caption tal cual.", "Cuando alguien comente o escriba LIBROS: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Gracias por escribir. Aquí está el diagnóstico express de tus números (10 preguntas) 👉 [enlace]. Este mes estamos abriendo lugares para llevar tus números cada mes. ¿Te aparto uno? Responde CITA y te llamamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Domingo"}, {"fecha": "2027-01-25", "cuenta": "EI", "semana": 9, "formato": "Reel", "objetivo": "Viral", "tema": "¿Sabes cuánto ganaste en 2026?", "tipo_gancho": "Entrevista", "gancho_texto": "Le preguntamos a la gente cuánto ganó en 2026", "gancho_hablado": "Le preguntamos a la gente en la calle cuánto ganó en 2026. Casi nadie supo.", "visual": "Esmeralda con micrófono en mano en una plaza o mercado, acercándose a una persona que pasa.", "desarrollo": ["Esmeralda: Disculpa, ¿cuánto ganaste en 2026? Más o menos.", "Personas (montaje de 4 o 5 respuestas): «Uy, no sé.» «Lo que me cayó al banco, creo.» «¿Antes o después de gastos?»", "Esmeralda a cámara: Y es normal. Pero en unas semanas vas a sentarte a declarar y ese es el primer número que te van a pedir.", "Si no lo sabes, alguien lo va a adivinar por ti. Y casi nunca a tu favor.", "Haz esto antes de ir: suma lo que te pagaron en 2026, de todos lados, y escríbelo en una hoja.", "El número que no sabes es el que más caro te sale.", "¿Tú sí sabes el tuyo? Dímelo en los comentarios con un sí o un no."], "cta": "Comenta SÍ o NO: ¿sabes cuánto ganaste en 2026?", "caption": "Salimos a la calle a preguntar cuánto ganó la gente en 2026.\nLas respuestas nos dieron risa y también un poco de miedo.\n¿Tú sí sabes el tuyo? Comenta SÍ o NO.", "calculadora": 17, "notas": "Pedir permiso firmado a cada persona que salga en cámara. Si alguien no quiere salir, no se usa su respuesta. Si alguien sí sabe su número, también se usa: Esmeralda le dice «¡Eres de los pocos!». SÍ/NO no es palabra clave: no se manda DM, solo se contesta el comentario.", "historias": [{"proposito": "Cercanía: detrás de cámaras", "formato": "B-roll con texto", "contenido": "Video de Esmeralda en la calle con el micrófono, riéndose con alguien. Texto: Hoy salimos a preguntar algo que nadie sabe.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video de Esmeralda en la calle con el micrófono, riéndose con alguien.", "Escribe arriba, en letra grande y máximo dos líneas: \"Hoy salimos a preguntar algo que nadie sabe.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Cercanía: pregunta", "formato": "Encuesta", "contenido": "¿Sabes cuánto ganaste en 2026?", "interaccion": "Encuesta: Sí / Ni idea", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Sabes cuánto ganaste en 2026?\"", "Pon el sticker ENCUESTA con estas opciones: Sí / Ni idea.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Prepara antes de grabar: Exterior: plaza, mercado o centro comercial con gente (pedir permiso del lugar). Micrófono de mano con logo de Éxito Institute si existe. Hojas de permiso de imagen para que firmen. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda con micrófono en mano en una plaza o mercado, acercándose a una persona que pasa. Esmeralda dice: \"Le preguntamos a la gente en la calle cuánto ganó en 2026. Casi nadie supo.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 6): plano del personaje que habla. Dice: \"Esmeralda: Disculpa, ¿cuánto ganaste en 2026? Más o menos.\"", "Toma 3 (segundo 6 a 14): plano del personaje que habla. Dice: \"Personas (montaje de 4 o 5 respuestas): «Uy, no sé.» «Lo que me cayó al banco, creo.» «¿Antes o después de gastos?»\"", "Toma 4 (segundo 14 a 24): plano cerrado a la cara. Dice: \"Esmeralda a cámara: Y es normal. Pero en unas semanas vas a sentarte a declarar y ese es el primer número que te van a pedir.\"", "Toma 5 (segundo 24 a 31): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Si no lo sabes, alguien lo va a adivinar por ti. Y casi nunca a tu favor.\"", "Toma 6 (segundo 31 a 39): plano cerrado a la cara. Dice: \"Haz esto antes de ir: suma lo que te pagaron en 2026, de todos lados, y escríbelo en una hoja.\"", "Toma 7 (segundo 39 a 44): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Moraleja: el número que no sabes es el que más caro te sale.\"", "Toma 8 (segundo 44 a 50): plano cerrado a la cara. Dice: \"CTA: ¿Tú sí sabes el tuyo? Dímelo en los comentarios con un sí o un no.\"", "Texto en pantalla del segundo 0 al 3: \"Le preguntamos a la gente cuánto ganó en 2026\". Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"¿Cuánto ganaste en 2026?\"; segundo 6: \"«Uy, no sé»\"; segundo 14: \"Es lo primero que te piden\"; segundo 24: \"Súmalo antes de ir\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 50 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta SÍ o NO: ¿sabes cuánto ganaste en 2026?\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Le preguntamos a la gente cuánto ganó en 2026\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Contesta todos los comentarios en la primera hora. A quien conteste que no, respóndele: «Tranquilo, es lo más común. Si quieres te mando unas preguntas para sacarlo, escríbeme LIBROS por mensaje.»"], "dia": "Lunes"}, {"fecha": "2027-01-26", "cuenta": "EI", "semana": 9, "formato": "Carrusel", "objetivo": "Guardado", "tema": "¿Dónde está mi reembolso?", "tipo_gancho": "Situación", "gancho_texto": "¿Dónde está mi reembolso? Revísalo sin llamar a nadie", "gancho_hablado": "¿Dónde está mi reembolso? Así lo revisas sin llamar a nadie.", "visual": "Portada con un celular en la mano mostrando una pantalla de estado (ilustración, sin datos reales).", "desarrollo": ["¿Dónde está mi reembolso? Así lo revisas sin llamar a nadie.", "El IRS tiene una página para esto. Se llama Where's My Refund.", "Vas a necesitar tu número de seguro social o ITIN, cómo declaraste (soltero, casado…) y la cantidad exacta del reembolso.", "Te va a salir uno de tres pasos: recibida, aprobada o enviada.", "Recibida quiere decir que ya tienen tu declaración. Aprobada, que ya saben cuánto te toca. Enviada, que el dinero va en camino.", "Si pasan semanas y no cambia, revisa tu correo. Muchas veces te mandaron una carta porque falta un dato.", "Y si todavía no declaras, empieza por la lista. Comenta REFUND y te la mandamos."], "cta": "Comenta REFUND y te mandamos la lista de lo que necesitas para declarar.", "caption": "La pregunta que más nos hacen en febrero: ¿dónde está mi reembolso?\nAquí te enseñamos a revisarlo tú, sin llamar a nadie.\nY si todavía no declaras, comenta REFUND y te mandamos la lista de papeles.", "calculadora": null, "notas": "[VALIDAR] el nombre y el funcionamiento actual de la página del IRS. No prometer tiempos de espera.", "historias": [{"proposito": "Problema de todos los días", "formato": "Encuesta", "contenido": "El año pasado, ¿cuánto tardó tu reembolso?", "interaccion": "Encuesta: Menos de un mes / Más de un mes", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"El año pasado, ¿cuánto tardó tu reembolso?\"", "Pon el sticker ENCUESTA con estas opciones: Menos de un mes / Más de un mes.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Problema: consecuencia", "formato": "Foto con texto", "contenido": "Foto de un buzón vacío. Texto: Un dato mal puesto puede detener tu reembolso semanas. Hoy te enseñamos a revisarlo.", "interaccion": "Enlace al post", "pasos": ["Fondo: Foto de un buzón vacío. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"Un dato mal puesto puede detener tu reembolso semanas. Hoy te enseñamos a revisarlo.\"", "Comparte en la historia el post de hoy (botón del avión de papel, «Agregar a tu historia») para que lo toquen y vayan al post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con un celular en la mano mostrando una pantalla de estado (ilustración, sin datos reales). Título grande: \"¿Dónde está mi reembolso? Revísalo sin llamar a nadie\". Nada más en la portada.", "Slide 2: escribe \"El IRS tiene una página para esto. Se llama Where's My Refund.\" La primera frase en negrita.", "Slide 3: escribe \"Vas a necesitar tu número de seguro social o ITIN, cómo declaraste (soltero, casado…) y la cantidad exacta del reembolso.\" La primera frase en negrita.", "Slide 4: escribe \"Te va a salir uno de tres pasos: recibida, aprobada o enviada.\" La primera frase en negrita.", "Slide 5: escribe \"Recibida quiere decir que ya tienen tu declaración. Aprobada, que ya saben cuánto te toca. Enviada, que el dinero va en camino.\" La primera frase en negrita.", "Slide 6: escribe \"Si pasan semanas y no cambia, revisa tu correo. Muchas veces te mandaron una carta porque falta un dato.\" La primera frase en negrita.", "Slide 7: escribe \"Y si todavía no declaras, empieza por la lista. Comenta REFUND y te la mandamos.\" La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Cuando alguien comente o escriba REFUND: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Aquí tienes la lista de papeles que vas a necesitar para declarar 👉 [enlace al PDF]. Si tienes dudas de tu caso, responde CITA.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Martes"}, {"fecha": "2027-01-27", "cuenta": "EI", "semana": 9, "formato": "Reel", "objetivo": "Venta", "tema": "Mi contador ya lo hace", "tipo_gancho": "Contracorriente", "gancho_texto": "Tu contador declara. ¿Quién ve tus números el resto del año?", "gancho_hablado": "Me dicen: eso ya lo hace mi contador. Y yo pregunto: ¿te hace la declaración, o te lleva los números todo el año?", "visual": "Esmeralda pone sobre la mesa una sola hoja (la declaración) y al lado una pila de doce carpetas con los nombres de los meses.", "desarrollo": ["Declarar y llevar tus números cada mes son dos trabajos distintos.", "La declaración mira hacia atrás. Te dice qué pasó cuando ya no puedes cambiar nada.", "Los números de cada mes te avisan en junio que vas a deber en abril. Y todavía te da tiempo.", "Pregúntale a tu contador cuándo vio tus números por última vez antes de declarar. Si te dice que en abril, te falta la otra mitad.", "Una foto al año no te enseña cómo se movió tu negocio los otros once meses.", "Si ya lo intentaste solo y se te cayó en marzo, comenta LIBROS. Lo llevamos contigo cada mes."], "cta": "Comenta LIBROS y te explicamos cómo llevamos tus números cada mes.", "caption": "Tu contador te ayuda en abril.\n¿Y de mayo a marzo quién ve tus números?\nComenta LIBROS y te explicamos cómo trabajamos mes con mes.", "calculadora": 15, "notas": "No hablar mal de otros contadores. El mensaje es que son dos servicios distintos.", "historias": [{"proposito": "Romper una duda: «Ya lo intenté / mi contador lo hace»", "formato": "Selfie hablando", "contenido": "Esmeralda: «Un cliente me dijo: ya intenté llevar mis números en Excel y lo dejé en marzo. Excel tenía. Lo que nadie hacía era sentarse con él cada mes a revisarlo.» [caso real a confirmar]", "interaccion": "Ninguna", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Un cliente me dijo: ya intenté llevar mis números en Excel y lo dejé en marzo. Excel tenía. Lo que nadie hacía era sentarse con él cada mes a revisarlo.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Sin sticker.", "Antes de subirla: confirma con Esmeralda que el caso es real y que hay permiso. La marca [caso real a confirmar] no se escribe en pantalla. Si no es real, no subas esta historia.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Romper una duda: «Ya lo intenté / mi contador lo hace» (la respuesta)", "formato": "Encuesta", "contenido": "¿Cuándo fue la última vez que alguien revisó tus números?", "interaccion": "Encuesta: Este mes / En abril pasado", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Cuándo fue la última vez que alguien revisó tus números?\"", "Pon el sticker ENCUESTA con estas opciones: Este mes / En abril pasado.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Prepara antes de grabar: Mesa larga de la oficina. Objetos: una hoja sola con la palabra DECLARACIÓN y doce carpetas apiladas con etiquetas ENE a DIC. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda pone sobre la mesa una sola hoja (la declaración) y al lado una pila de doce carpetas con los nombres de los meses. Esmeralda dice: \"Me dicen: eso ya lo hace mi contador. Y yo pregunto: ¿te hace la declaración, o te lleva los números todo el año?\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 8): plano cerrado a la cara. Dice: \"Contexto: Declarar y llevar tus números cada mes son dos trabajos distintos.\"", "Toma 3 (segundo 8 a 14): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"La declaración mira hacia atrás. Te dice qué pasó cuando ya no puedes cambiar nada.\"", "Toma 4 (segundo 14 a 22): plano cerrado a la cara. Dice: \"Los números de cada mes te avisan en junio que vas a deber en abril. Y todavía te da tiempo.\"", "Toma 5 (segundo 22 a 32): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Pregúntale a tu contador cuándo vio tus números por última vez antes de declarar. Si te dice que en abril, te falta la otra mitad.\"", "Toma 6 (segundo 32 a 39): plano cerrado a la cara. Dice: \"Moraleja: una foto al año no te enseña cómo se movió tu negocio los otros once meses.\"", "Toma 7 (segundo 39 a 46): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"CTA: Si ya lo intentaste solo y se te cayó en marzo, comenta LIBROS. Lo llevamos contigo cada mes.\"", "Texto en pantalla del segundo 0 al 3: \"Tu contador declara. ¿Quién ve tus números el resto del año?\" Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"«Ya lo hace mi contador»\"; segundo 8: \"Mira hacia atrás\"; segundo 14: \"Te avisa en junio\"; segundo 22: \"¿Cuándo los vio por última vez?\"", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 46 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta LIBROS y te explicamos cómo llevamos tus números cada mes.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Tu contador declara. ¿Quién ve tus números el resto del año?\" Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora d abra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 51 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta REFUND y te mandamos la lista completa.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Hay dinero tuyo que el IRS no te da si no lo pides\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Cuando alguien comente o escriba REFUND: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Aquí tienes la lista de papeles que vas a necesitar para declarar 👉 [enlace al PDF]. Si tienes dudas de tu caso, responde CITA.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Viernes"}, {"fecha": "2027-01-30", "cuenta": "EI", "semana": 9, "formato": "Carrusel", "objetivo": "Venta", "tema": "Caso: de abril a cada mes", "tipo_gancho": "Resultados", "gancho_texto": "Hacía sus números cada abril. Hasta que cambió esto", "gancho_hablado": "Hacía sus números cada abril. Hasta que cambió una cosa.", "visual": "Portada con un número grande en blanco sobre fondo oscuro (el resultado real del cliente).", "desarrollo": ["[caso real a confirmar: resultado del cliente en grande]. Te contamos cómo lo hizo.", "Tiene un negocio de [caso real a confirmar: tipo de negocio]. Quería saber cuánto ganaba de verdad.", "Cada abril reconstruía el año con recibos sueltos. Y cada abril terminaba debiendo más de lo que esperaba.", "Estuvo a punto de dejarlo así otro año.", "En enero decidió revisar sus números cada mes con nosotros.", "[caso real a confirmar: resultado con prueba, por ejemplo una captura borrosa de su resumen o un mensaje suyo].", "¿Quieres emp es estamos abriendo lugares para llevar tus números cada mes. ¿Te aparto uno? Responde CITA y te llamamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Sábado"}, {"fecha": "2027-01-31", "cuenta": "EI", "semana": 9, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Cierre de enero", "tipo_gancho": "Fecha límite", "gancho_texto": "Hoy cierra enero. ¿Tu negocio empieza febrero ordenado?", "gancho_hablado": "Hoy cierra enero. ¿Tu negocio empieza febrero con sus números al día?", "visual": "Hoja de calendario de enero arrancándose y dejando ver febrero. Colores de marca.", "desarrollo": ["Hoy cierra enero.", "¿Tu negocio empieza febrero con sus números al día? Comenta CITA."], "cta": "Comenta CITA para empezar febrero con tus números al día.", "caption": "Último día de enero.\nSi empezaste el año diciendo «este año sí me organizo», hoy es buen día para cumplirlo.\nComenta CITA y empezamos.", "calculadora": null, "notas": "Si se aprobó el descuento del primer mes, hoy es el último día y se puede decir en el caption. Si no se aprobó, no se menciona.", "historias": [{"proposito": "Invitación a contratar: mostrar un caso", "formato": "B-roll con texto", "contenido": "Video de un cliente (de espaldas o sin cara) recibiendo su resumen del mes. Texto: Así empiezan febrero nuestros clientes. [caso real a confirmar]", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video de un cliente (de espaldas o sin cara) recibiendo su resumen del mes.", "Escribe arriba, en letra grande y máximo dos líneas: \"Así empiezan febrero nuestros clientes.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Antes de subirla: confirma con Esmeralda que el caso es real y que hay permiso. La marca [caso real a confirmar] no se escribe en pantalla. Si no es real, no subas esta historia.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Invitación a contratar: pedir la palabra", "formato": "Selfie hablando", "contenido" const pend=p=>{const t=JSON.stringify(p);return [/\[VALIDAR/.test(t)&&'un dato que hay que validar',/caso real a confirmar/.test(t)&&'un caso real que hay que confirmar',/\[enlace/.test(t)&&'un enlace que hay que poner',/si se aprueba/.test(t)&&'un descuento sin aprobar',/confirmar con Esmeralda|solo si Esmeralda/.test(t)&&'algo que Esmeralda tiene que aprobar'].filter(Boolean)};
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const fdate=f=>{const[y,m,d]=f.split('-').map(Number);return `${d} de ${MES[m-1]}`};
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}};
const list=a=>Array.isArray(a)?a:(a?[a]:[]);
const ol=a=>`<ol class="steps">${list(a).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`;
let cuenta=store.get('cuenta')||'LT', fMes='', fSem='', fFor='';

function render(){
 document.body.dataset.c=cuenta;
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.set===cuenta));
 const A=DATA.cuentas[cuenta], posts=DATA.posts.filter(p=>p.cuenta===cuenta);
 $('#logo').src=LOGOS[cuenta]; $('#logo').alt=A.nombre;
 document.title='Parrilla dic–ene · '+A.nombre;
 $('#app').innerHTML=`
 <div class="hero"><span class="tag">Diciembre 2026 y enero 2027</span>
 <h1>${esc(A.titulo)}</h1><p>${esc(A.intro)}</p></div>

 <section id="empieza"><h2>1. Empieza aquí</h2>
 <div class="card"><p><b>Qué es esto:</b> todo lo que se publica en la cuenta de <b>${esc(A.nombre)}</b> desde el 1 de diciembre hasta el 31 de enero. Cada día tiene una publicación en el feed y dos historias. Todo está escrito: lo que se dice, lo que va en pantalla y cómo se hace.</p>
 ${ol(DATA.comoUsar)}</div>
 <div class="grid">
  <div class="card"><h3>Cada semana</h3><p><span class="tag f-Reel">3 reels</span><span class="tag f-Carrusel">2 carruseles</span><span class="tag f-Imagen">2 imágenes</span></p><p class="muted">La primera semana empieza un martes, así que lleva 2 de cada uno.</p></div>
  <div class="card"><h3>Cada día</h3><p><span class="tag">1 publicación</span><span class="tag">2 historias</span></p><p class="muted">Las historias se suben aunque ese día no haya reel.</p></div>
  <div class="card"><h3>Horario</h3><p class="muted">${esc(DATA.horario)}</p></div>
 </div></section>

 <section id="regla"><h2>2. La regla de oro (léela antes de grabar cualquier cosa)</h2>
 <div class="card">${DATA.regla.map(r=>`<h3>${esc(r.t)}</h3><p>${esc(r.p)}</p>`).join('')}
 <h3>Ejemplos de esta cuenta</h3>${A.ejemplos.map(e=>`<div class="bad"><b>Así no:</b> ${esc(e.mal)}</div><div class="good"><b>Así sí:</b> ${esc(e.bien)}</div>`).join('')}
 <h3>Antes de publicar, revisa esto</h3>${ol(DATA.checklist)}</div></section>

 <section id="estrategia"><h2>3. Qué buscamos en estos dos meses</h2>
 <div class="card"><p><b>La promesa de la cuenta</b> (la idea que tiene que quedar en la cabeza de quien nos ve):</p><p class="hook">${esc(A.promesa)}</p></div>
 <div class="grid">${A.metas.map(m=>`<div class="card"><h3>${esc(m.t)}</h3><p class="muted">${esc(m.p)}</p></div>`).join('')}</div>
 <div class="card"><h3>Para qué sirve cada formato</h3><table><tr><th>Formato</th><th>Para qué lo usamos</th><th>Cómo saber si funcionó</th></tr>${DATA.formatos.map(f=>`<tr><td><span class="tag f-${f.f}">${f.f}</span></td><td>${esc(f.para)}</td><td>${esc(f.mide)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>El objetivo de cada reel</h3><p>Cada reel tiene una etiqueta. Así sabes qué pedirle a la gente al final:</p><table>${DATA.objetivos.map(o=>`<tr><td><span class="tag">${o.o}</span></td><td>${esc(o.p)}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Campañas de estos meses</h3><table><tr><th>Fechas</th><th>Campaña</th><th>Qué hacemos en redes</th></tr>${A.campanas.map(c=>`<tr><td>${esc(c.f)}</td><td><b>${esc(c.n)}</b></td><td>${esc(c.p)}</td></tr>`).join('')}</table><p class="note">${esc(DATA.descuentos)}</p></div>
 </section>

 <section id="semanas"><h2>4. El tema de cada semana</h2><div class="tablewrap"><table><tr><th>Semana</th><th>Fechas</th><th>Tema</th><th>Qué tiene que sentir la gente</th></tr>${A.semanas.map(s=>`<tr><td><b>${s.n}</b></td><td>${esc(s.f)}</td><td>${esc(s.t)}</td><td>${esc(s.s)}</td></tr>`).join('')}</table></div></section>

 <section id="historias"><h2>5. Historias: qué toca cada día</h2>
 <div class="card"><p>Se suben <b>2 historias todos los días</b>. Cada día de la semana tiene un propósito. La historia 1 engancha (pregunta, encuesta o algo curioso). La historia 2 desarrolla o invita a hacer algo.</p>
 <div class="tablewrap"><table><tr><th>Día</th><th>Propósito</th><th>Qué se busca</th></tr>${DATA.semanaHistorias.map(d=>`<tr><td><b>${d.d}</b></td><td>${esc(d.p)}</td><td>${esc(d.q)}</td></tr>`).join('')}</table></div>
 <h3>Reglas para historias</h3>${ol(DATA.reglasHistorias)}
 <h3>Las dudas que rompemos los miércoles</h3><table><tr><th>Semana</th><th>Duda de la gente</th><th>Cómo la contestamos</th></tr>${A.objeciones.map(o=>`<tr><td>${o.n}</td><td>“${esc(o.d)}”</td><td>${esc(o.c)}</td></tr>`).join('')}</table></div></section>

 <section id="palabras"><h2>6. Palabras clave y qué contestar por DM</h2>
 <div class="card"><p>Cuando un video dice “comenta PAPELES”, la gente escribe esa palabra. Hay que contestar <b>el mismo día</b>, mejor en menos de 2 horas.</p>
 ${A.palabras.map(p=>`<div class="card" style="background:var(--cream)"><h3><span class="tag">${esc(p.k)}</span> ${esc(p.que)}</h3><p class="muted">${esc(p.estado)}</p><b>Paso a paso:</b>${ol(p.pasos)}<b>Mensaje para copiar y pegar:</b><div class="say"><p>${esc(p.dm)}</p></div></div>`).join('')}</div></section>

 <section id="marca"><h2>7. Colores, letra y logo</h2>
 <div class="grid"><div class="card"><h3>Colores</h3>${A.marca.colores.map(c=>`<div class="swatch"><i style="background:${c.h}"></i><span><b>${c.h}</b> · ${esc(c.u)}</span></div>`).join('')}</div>
 <div class="card"><h3>Letra y estilo</h3>${ol(A.marca.estilo)}<img src="${LOGOS[cuenta]}" alt="${esc(A.nombre)}" style="max-width:100%;margin-top:10px"></div></div></section>

 <section id="mapa"><h2>8. Calendario</h2><p class="muted">Toca un día para ir directo a su ficha. Los días que marques como hechos se ven más claros.</p>
 ${['2026-12','2027-01'].map(m=>calendar(m,posts)).join('')}</section>

 <section id="dias"><h2>9. Día por día</h2>
 <div class="filters">
 <select id="fMes" aria-label="Mes"><option value="">Los dos meses</option><option value="2026-12">Diciembre</option><option value="2027-01">Enero</option></select>
 <select id="fSem" aria-label="Semana"><option value="">Todas las semanas</option>${A.semanas.map(s=>`<option value="${s.n}">Semana ${s.n} (${esc(s.f)})</option>`).join('')}</select>
 <select id="fFor" aria-label="Formato"><option value="">Todos los formatos</option><option>Reel</option><option>Carrusel</option><option>Imagen</option></select>
 </div><div id="lista"></div></section>

 <section id="glosario"><h2>10. Palabras que usamos en esta guía</h2><div class="card"><table>${DATA.glosario.map(g=>`<tr><td><b>${esc(g.t)}</b></td><td>${esc(g.d)}</td></tr>`).join('')}</table></div></section>`;
 ['fMes','fSem','fFor'].forEach(id=>{const el=$('#'+id);el.value={fMes,fSem,fFor}[id];el.onchange=()=>{({fMes:v=>fMes=v,fSem:v=>fSem=v,fFor:v=>fFor=v})[id](el.value);lista()}});
 lista();
}
function calendar(m,posts){
 const ps=posts.filter(p=>p.fecha.startsWith(m)); const [y,mo]=m.split('-').map(Number);
 const pad=(new Date(y,mo-1,1).getDay()+6)%7;
 return `<div class="card"><h3>${MES[mo-1][0].toUpperCase()+MES[mo-1].slice(1)} ${y}</h3><div class="cal">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="h">${d}</div>`).join('')}${'<a class="e"></a>'.repeat(pad)}${ps.map(p=>`<a href="#d-${p.fecha}" class="${store.get('hecho-'+cuenta+p.fecha)?'done':''}"><b>${+p.fecha.slice(8)}</b><span class="tag f-${p.formato}">${p.formato}</span></a>`).join('')}</div><p class="legend"><span class="tag f-Reel" style="font-size:0;width:12px;height:12px;padding:0"></span> Reel · <span class="tag f-Carrusel" style="font-size:0;width:12px;height:12px;padding:0"></span> Carrusel · <span class="tag f-Imagen" style="font-size:0;width:12px;height:12px;padding:0"></span> Imagen</p></div>`;
}
function lista(){
 const posts=DATA.posts.filter(p=>p.cuenta===cuenta&&(!fMes||p.fecha.startsWith(fMes))&&(!fSem||p.semana==fSem)&&(!fFor||p.formato===fFor));
 $('#lista').innerHTML=posts.map(day).join('')||'<p>No hay días con ese filtro.</p>';
 document.querySelectorAll('label.done input').forEach(i=>i.onchange=()=>{store.set(i.dataset.k,i.checked?'1':'');const a=document.querySelector(`.cal a[href="#d-${i.dataset.f}"]`);if(a)a.classList.toggle('done',i.checked)});
}
function day(p){
 const k='hecho-'+cuenta+p.fecha, isReel=p.formato==='Reel', isCar=p.formato==='Carrusel';
 const label=isReel?'Lo que dice Esmeralda, frase por frase':isCar?'Qué va en cada slide':'Qué dice la imagen';
 return `<article class="day" id="d-${p.fecha}"><header><div><span class="tag">Semana ${p.semana}</span><span class="tag f-${p.formato}">${p.formato}</span><span class="tag">Objetivo: ${esc(p.objetivo)}</span><h3>${esc(p.dia)} ${fdate(p.fecha)} · ${esc(p.tema)}</h3></div>
 <label class="done"><input type="checkbox" data-k="${k}" data-f="${p.fecha}" ${store.get(k)?'checked':''}> Publicado</label></header>
 <div class="body">
 ${pend(p).length?`<p class="pending"><b>Antes de publicar resuelve lo marcado en amarillo:</b> ${pend(p).join(', ')}.</p>`:''}
 <h4>El gancho</h4><p class="hook">${esc(p.gancho_texto)}</p>
 <p><b>${isReel?'Primera frase que dice':isCar?'Título de la portada':'Titular'}:</b> ${esc(p.gancho_hablado)}</p>
 <p><b>Lo que se ve al inicio:</b> ${esc(p.visual)}</p>
 <h4>${label}</h4><div class="say">${list(p.desarrollo).map((x,i)=>`<p>${isCar?`<b>Slide ${i+1}:</b> `:''}${esc(x)}</p>`).join('')}</div>
 <p><b>Al final se pide:</b> ${esc(p.cta)}</p>
 <h4>Cómo hacerlo, paso a paso</h4>${ol(p.instrucciones)}
 <h4>Texto para el post (copiar y pegar)</h4><div class="say"><p>${esc(p.caption).replace(/\n/g,'<br>')}</p></div>
 ${p.notas?`<h4>Ojo con esto</h4><p class="note">${esc(p.notas)}</p>`:''}
 <h4>Historias del día</h4><div class="cols">${list(p.historias).map((h,i)=>`<div class="story"><span class="tag">Historia ${i+1}</span><span class="tag">${esc(h.formato)}</span><p><b>Para qué:</b> ${esc(h.proposito)}</p><p><b>Qué se muestra o se dice:</b> ${esc(h.contenido)}</p><p><b>Sticker o interacción:</b> ${esc(h.interaccion)}</p>${h.pasos?`<b>Cómo hacerla:</b><ol class="plain">${list(h.pasos).map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`:''}</div>`).join('')}</div>
 </div></article>`;
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{cuenta=b.dataset.set;store.set('cuenta',cuenta);fSem='';render();scrollTo(0,0)});
render();
</script>
</body>
</html>
