 real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Sábado"}, {"fecha": "2027-01-31", "cuenta": "LT", "semana": 9, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Cierre de enero sin prisa", "tipo_gancho": "Fact", "gancho_texto": "Enero se acaba. Tu familia sigue aquí", "gancho_hablado": "El propósito que sí protege a tu familia también cabe en febrero", "visual": "Hoja de calendario de enero volteándose hacia febrero, con la carpeta de papeles al lado.", "desarrollo": ["Enero se acaba. Tu familia sigue aquí.", "El propósito que sí la protege también cabe en febrero."], "cta": "Si lo estabas pensando, escríbeme CITA", "caption": "Sin presión: si este mes no te dio tiempo, febrero también sirve.\nLo importante es que pase. Si lo estabas pensando, escríbeme CITA.", "calculadora": null, "notas": "Cierre de la campaña de enero sin urgencia falsa. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Invitación a agendar: caso", "formato": "B-roll con texto", "contenido": "En enero vimos: el papá que renta, la pareja sin casarse, la casa que no podían vender.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: las manos de Esmeralda acomodando papeles en su escritorio. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «En enero vimos: el papá que renta, la pareja sin casarse, la casa que no podían vender.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Invitación a agendar: llamada", "formato": "Selfie hablando", "contenido": "Si te viste en alguna, responde CITA. Sin prisa: enero, febrero, cuando estés lista. Lo importante es que pase.", "interaccion": "Palabra clave CITA por DM", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Si te viste en alguna, responde CITA. Sin prisa: enero, febrero, cuando estés lista. Lo importante es que pase.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Escribe abajo, en grande y en verde #7b8e46: «Responde CITA». A quien responda, contéstale el mismo día por DM con este mensaje: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.»", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: imagen vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed o la foto indicada abajo. Títulos en negro con letra gruesa; textos pequeños en gris #686664; el número o la palabra más importante en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "Foto o fondo: Hoja de calendario de enero volteándose hacia febrero, con la carpeta de papeles al lado.", "Texto principal (grande, ocupa la mitad de arriba): «Enero se acaba. Tu familia sigue aquí»", "Debajo, a la mitad del tamaño y en este orden: «El propósito que sí la protege también cabe en febrero.»", "Publicación: 1:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Domingo"}, {"fecha": "2026-12-01", "cuenta": "EI", "semana": 1, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Cierre de año: tu banco no cuenta toda la historia", "tipo_gancho": "Resultados (número sin contexto)", "gancho_texto": "Su banco decía -$2,800. Ganó $17,200", "gancho_hablado": "Su cuenta del banco decía que perdió $2,800. En realidad ganó $17,200.", "visual": "Slide 1 con dos números grandes enfrentados: rojo -$2,800 / verde +$17,200, sobre foto de estado de cuenta borroso.", "desarrollo": ["Su banco decía que perdió $2,800. En realidad ganó $17,200.", "Un ejemplo con números redondos: un negocio que vende servicios y cobra a veces en el momento y a veces semanas después.", "Cada fin de mes, la dueña miraba su cuenta del banco. Si había poco, pensaba que el negocio iba mal.", "Vendió $51,000 en el año, pero solo le habían pagado $31,000. El resto se lo debían sus clientes.", "Si solo miras lo que entró al banco, ves la mitad de la historia. Te falta lo que vendiste y todavía no cobraste.", "Contando todo lo que vendió, le quedaban $17,200 de ganancia. No estaba quebrada: tenía que cobrar.", "Haz esto antes del 31: 1) Anota lo que vendiste y no te han pagado. 2) Anota lo que debes. 3) Compáralo con tu cuenta.", "¿Quieres la lista para hacerlo en una tarde? Comenta CIERRE y te la mandamos."], "cta": "Comenta CIERRE y te mandamos el checklist de cierre de año para tu negocio.", "caption": "Tu cuenta del banco te dice solo una parte. Mira este ejemplo con números 👀\nSon tres pasos y se hacen antes del 31.\nComenta CIERRE y te mandamos la lista para hacerlo en una tarde.", "calculadora": null, "notas": "Las cifras son un ejemplo. Si se usa un caso real, pedir permiso y quitar nombres. [caso real a confirmar]", "historias": [{"proposito": "Problema común: que la gente se rojo -$2,800 / verde +$17,200, sobre foto de estado de cuenta borroso. Título grande: \"Su banco decía -$2,800. Ganó $17,200\". Nada más en la portada.", "Slide 2: escribe \"Un ejemplo con números redondos: un negocio que vende servicios y cobra a veces en el momento y a veces semanas después.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 3: escribe \"Cada fin de mes, la dueña miraba su cuenta del banco. Si había poco, pensaba que el negocio iba mal.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 4: escribe \"Vendió $51,000 en el año, pero solo le habían pagado $31,000. El resto se lo debían sus clientes.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 5: escribe \"Si solo miras lo que entró al banco, ves la mitad de la historia. Te falta lo que vendiste y todavía no cobraste.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 6: escribe \"Contando todo lo que vendió, le quedaban $17,200 de ganancia. No estaba quebrada: tenía que cobrar.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 7: escribe \"Haz esto antes del 31: 1) Anota lo que vendiste y no te han pagado. 2) Anota lo que debes. 3) Compáralo con tu cuenta.\" La primera frase en negrita; si hay lista, una línea por punto.", "Slide 8: escribe \"¿Quieres la lista para hacerlo en una tarde? Comenta CIERRE y te la mandamos.\" La primera frase en negrita; si hay lista, una línea por punto.", "En cada slide (menos el último) pon una flechita pequeña a la derecha para que deslicen.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. (hora local de la audiencia). Pega el caption tal cual. La primera línea del caption ya es el gancho.", "Cuando alguien comente o escriba CIERRE: responde en el comentario 'Te lo mandé por mensaje 🙌' y envíale por DM este texto: \"¡Hola! Aquí tienes el checklist de cierre de año para tu negocio 👉 [enlace al PDF]. Si quieres que lo revisemos contigo, responde CITA y te damos un horario.\" Anota su nombre en la hoja de prospectos ese mismo día."], "dia": "Martes"}, {"fecha": "2026-12-02", "cuenta": "EI", "semana": 1, "formato": "Reel", "objetivo": "Viral", "tema": "Tu negocio se come el ahorro de tu familia", "tipo_gancho": "Negativo", "gancho_texto": "Tu negocio se está comiendo tu ahorro", "gancho_hablado": "Si este año tuviste que sacar de tu ahorro para pagar cosas del negocio, escucha esto.", "visual": "Esmeralda saca billetes de un sobre que dice 'AHORRO FAMILIA' y los mete en una caja que dice 'NEGOCIO'.", "desarrollo": ["Si este año tuviste que sacar de tu ahorro para pagar cosas del negocio, escucha esto.", "El peor préstamo que puede hacer un dueño de negocio es prestarse a sí mismo. Y casi nunca se lo paga.", "El negocio es como un bebé. Te pide y te pide. Y si no sabes cuánto tiene que generar, lo llenas con el dinero de la renta, de la escuela, de tus hijos.", "Y ese ahorro era para una emergencia de tu casa. Si mañana se enferma alguien, ese dinero ya no está.", "Antes de meter un dólar más, contesta esto: ¿cuánto tiene que vender tu negocio cada mes para pagarse solo?", "Y otra, que duele más: ¿cuánto sacaste de tu ahorro este año? Súmalo. Ese número es tuyo, aunque duela verlo.", "Si no supiste contestar, ahí está el hoyo. Puedes estar vendiendo bien y aun así nadie está viendo a dónde se va el dinero.", "Comenta CIERRE y te mando la lista que usamos para revisar esto antes del 31."], "cta": "Comenta CIERRE.", "caption": "¿Cuánto sacaste de tu ahorro este año para el negocio? Súmalo antes del 31.\nComenta CIERRE y te mandamos la lista.", "calculadora": 16, "notas": "Presentarlo como una pregunta para pensar, no como regla: a veces usar tu ahorro sí tiene sentido.", "historias": [{"proposito": "Romper una duda: «Es muy caro»", "formato": "Foto con texto (sobre de ahorro)", "contenido": "'Ahorita no tengo para pagarle a alguien que me lleve los números.' ¿Y cuánto te costó este año no saberlos?", "interaccion": "Encuesta: Nunca lo había pensado / Ya lo sé", "pasos": ["Fondo: sobre de ahorro. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"'Ahorita no tengo para pagarle a alguien que me lleve los números.' ¿Y cuánto te costó este año no saberlos?\"", "Pon el sticker ENCUESTA con estas opciones: Nunca lo había pensado / Ya lo sé.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Romper una duda: «Es muy caro» (la respuesta)", "formato": "Selfie hablando", "contenido": "Si sacaste, digamos, $3,000 del ahorro para tapar el negocio, ese dinero ya se fue. Ordenar tus números te dice por dónde se está yendo antes de que se vaya más.", "interaccion": "ninguna", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Si sacaste, digamos, $3,000 del ahorro para tapar el negocio, ese dinero ya se fue. Ordenar tus números te dice por dónde se está yendo antes de que se vaya más.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Sin sticker.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Prepara antes de grabar: Mesa de la oficina. Objetos: un sobre blanco con la palabra AHORRO FAMILIA escrita a mano, una caja de cartón con la palabra NEGOCIO, billetes de utilería. Ropa: Esmeralda con ropa de trabajo lisa (sin rayas ni logos), micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y léelo dos veces en voz alta. Debe durar entre 45 y 70 segundos. Si dura más, quita frases del medio, nunca el inicio.", "Puedes abrir con el fragmento de la clase de impuestos de negocios donde Esmeralda dice 'El peor préstamo que podemos hacer como empresarios es el prestarnos a nosotros mismos' y seguir con la grabación nueva. Si el equipo no tiene ese video a la mano, graba todo nuevo como está abajo.", "Toma 1 (gancho, segundos 0 a 3): plano medio cerrado (de pecho hacia arriba). Lo que se ve: Esmeralda saca billetes de un sobre que dice 'AHORRO FAMILIA' y los mete en una caja que dice 'NEGOCIO'. Esmeralda dice exacto: \"Si este año tuviste que sacar de tu ahorro para pagar cosas del negocio, escucha esto.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 11): plano cerrado (cara). Dice: \"El peor préstamo que puede hacer un dueño de negocio es prestarse a sí mismo. Y casi nunca se lo paga.\"", "Toma 3 (segundo 11 a 24): plano medio con el objeto en las manos. Dice: \"El negocio es como un bebé. Te pide y te pide. Y si no sabes cuánto tiene que generar, lo llenas con el dinero de la renta, de la escuela, de tus hijos.\"", "Toma 4 (segundo 24 a 32): plano cerrado (cara). Dice: \"Y ese ahorro era para una emergencia de tu casa. Si mañana se enferma alguien, ese dinero ya no está.\"", "Toma 5 (segundo 32 a 39): plano medio con el objeto en las manos. Dice: \"Antes de meter un dólar más, contesta esto: ¿cuánto tiene que vender tu negocio cada mes para pagarse solo?\"", "Toma 6 (segundo 39 a 47): plano cerrado (cara). Dice: \"Y otra, que duele más: ¿cuánto sacaste de tu ahorro este año? Súmalo. Ese número es tuyo, aunque duela verlo.\"", "Toma 7 (segundo 47 a 56): plano medio con el objeto en las manos. Dice: \"Si no supiste contestar, ahí está el hoyo. Puedes estar vendiendo bien y aun así nadie está viendo a dónde se va el dinero.\"", "Toma 8 (segundo 56 a 62): plano cerrado (cara). Dice: \"Comenta CIERRE y te mando la lista que usamos para revisar esto antes del 31.\"", "Texto en pantalla del segundo 0 al 3: \"Tu negocio se está comiendo tu ahorro\". Máximo dos líneas, letra grande, arriba del pecho, sin tapar la cara.", "Textos de apoyo (aparecen y se van con cada frase, letra blanca sobre franja de color de marca, arriba): segundo 3: \"El peor préstamo que puede hacer…\"; segundo 11: \"El negocio es como un bebé.…\"; segundo 24: \"Y ese ahorro era para una…\"; segundo 32: \"Antes de meter un dólar más,…\"; segundo 39: \"Y otra, que duele más: ¿cuánto…\"; segundo 47: \"Si no supiste contestar, ahí está…\"; segundo 56: \"Comenta CIERRE y te mando la…\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, en blanco con borde negro. Cambia de plano cada 2 o 3 segundos (zoom de 110% en las frases fuertes). Música suave instrumental muy baja, o sin música. Duración final cerca de 62 segundos.", "Último segundo: pon en pantalla \"Comenta CIERRE.\" en letras grandes durante 3 segundos.", "Portada: foto de Esmeralda mirando a cámara con el texto \"Tu negocio se está comiendo tu ahorro\". Colores de marca de Éxito Institute.", "Publica a las 6:00 p. m. (hora local de la audiencia). Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa 'Compartir también en Facebook'.", "Cuando alguien comente o escriba CIERRE: responde en el comentario 'Te lo mandé por mensaje 🙌' y envíale por DM este texto: \"¡Hola! Aquí tienes el checklist de cierre de año para tu negocio 👉 [enlace al PDF]. Si quieres que lo revisemos contigo, responde CITA y te damos un horario.\" Anota su nombre en la hoja de prospectos ese mismo día."], "dia": "Miércoles"}, {"fecha": "2026-12-03", "cuenta": "EI", "semana": 1, "formato": "Imagen", "objetivo": "Autoridad", "tema": "El marcador del negocio", "tipo_gancho": "Frase célebre (de Esmeralda)", "gancho_texto": "Si no lees el marcador, no sabes si vas ganando", "gancho_hablado": "Si no puedes leer el marcador, no sabes si vas ganando o perdiendo.", "visual": "Foto de Esmeralda con calculadora y libreta; frase en tipografía grande; logo Éxito Institute.", "desarrollo": ["Si no puedes leer el marcador, no sabes si vas ganando o perdiendo.", "Los números de tu negocio son t e frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Lo primero que me dicen los clientes al mes de empezar es: ya no me da miedo abrir el correo.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Sin sticker.", "Antes de subirla: confirma con Esmeralda que el caso es real y que hay permiso. La marca [caso real a confirmar] no se escribe en pantalla. Si no es real, no subas esta historia.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Invitación a contratar: pedir la palabra", "formato": "Foto con texto", "contenido": "Foto de Esmeralda en su escritorio. Texto: Este mes estamos recibiendo negocios nuevos. Respóndeme LIBROS.", "interaccion": "Responder con LIBROS", "pasos": ["Fondo: Foto de Esmeralda en su escritorio. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"Este mes estamos recibiendo negocios nuevos. Respóndeme LIBROS.\"", "Agrega un texto grande que diga «Respóndeme LIBROS». A quien responda, mándale por DM el mensaje de LIBROS que está en las instrucciones del post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "La frase entre corchetes [si se aprueba el descuento…] solo se usa si el descuento ya está aprobado. Si no, se borra completa.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con una sola hoja de resumen mensual (datos de ejemplo borrosos) sobre un escritorio ordenado. Título grande: \"Una hoja al mes y abril deja de asustar\". Nada más en la portada.", "Slide 2: escribe \"Cada mes revisamos lo que entró y lo que salió de tus cuentas del negocio. Tú no tienes que acomodar nada.\" La primera frase en negrita.", "Slide 3: escribe \"Te mandamos una sola hoja con lo que vendiste, lo que gastaste y lo que te quedó.\" La primera frase en negrita.", "Slide 4: escribe \"Ahí mismo te decimos cuánto conviene apartar ese mes para impuestos.\" La primera frase en negrita.", "Slide 5: escribe \"Si algo se ve raro, un gasto que se disparó o un cliente que no ha pagado, te avisamos ese mes. No en abril.\" La primera frase en negrita.", "Slide 6: escribe \"Y cuando llega la temporada de impuestos, tus papeles ya están listos.\" La primera frase en negrita.", "Slide 7: escribe \"Estamos recibiendo negocios nuevos en enero. Comenta LIBROS y te explicamos cómo empezar. [si se aprueba el descuento: el primer mes va con descuento]\". La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Cuando alguien comente o escriba LIBROS: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Gracias por escribir. Aquí está el diagnóstico express de tus números (10 preguntas) 👉 [enlace]. Este mes estamos abriendo lugares para llevar tus números cada mes. ¿Te aparto uno? Responde CITA y te llamamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Domingo"}, {"fecha": "2027-01-04", "cuenta": "EI", "semana": 6, "formato": "Reel", "objetivo": "Viral", "tema": "¿Cuánto te pagas tú?", "tipo_gancho": "Pregunta incómoda", "gancho_texto": "¿Cuánto te pagó tu negocio en 2026?", "gancho_hablado": "Trabajaste todo 2026 en tu negocio. Pregunta incómoda: ¿cuánto te pagó?", "visual": "Esmeralda saca de su cartera un cheque en blanco y lo pone sobre la mesa con cara de duda.", "desarrollo": ["Casi todos me contestan lo mismo: pues lo que iba sobrando. Un día sacas para la renta, otro para el súper, otro para los niños.", "El problema es que así nunca sabes si tu negocio funciona. Te puede estar dejando menos que un trabajo normal y no te das cuenta.", "Haz esto: decide una cantidad fija que te vas a pagar cada mes y pásatela el mismo día, de la cuenta del negocio a la tuya.", "Lo que quede en la cuenta del negocio es para gastos e impuestos. Ahí no se toca.", "Si tu negocio no te paga un sueldo, el que trabaja gratis eres tú.", "Dime en los comentarios cuánto te pagaste en 2026. Si no sabes, dímelo también, que nadie te va a juzgar."], "cta": "Comenta cuánto te pagaste en 2026, o dinos que no sabes.", "caption": "Trabajaste todo el año.\n¿Tu negocio te pagó un sueldo o te pagaste con lo que iba sobrando?\nCuéntanos en los comentarios. Si no sabes, también se vale decirlo.", "calculadora": 16, "notas": "No dar porcentajes ni montos de cuánto pagarse. Mensaje general.", "historias": [{"proposito": "Cercanía: detrás de cámaras", "formato": "B-roll con texto", "contenido": "Video del equipo abriendo carpetas nuevas de 2027. Texto: Primer lunes del año en la oficina.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video del equipo abriendo carpetas nuevas de 2027.", "Escribe arriba, en letra grande y máximo dos líneas: \"Primer lunes del año en la oficina.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Cercanía: pregunta", "formato": "Encuesta", "contenido": "¿Cómo te pagas tú de tu negocio?", "interaccion": "Encuesta: Sueldo fijo / Lo que va sobrando / No me pago", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Cómo te pagas tú de tu negocio?\"", "Pon el sticker ENCUESTA con estas opciones: Sueldo fijo / Lo que va sobrando / No me pago.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Prepara antes de grabar: Escritorio de la oficina. Objetos: una cartera, un cheque en blanco (sin datos reales) y una libreta con la palabra «Mi sueldo». Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda saca de su cartera un cheque en blanco y lo pone sobre la mesa con cara de duda. Esmeralda dice: \"Trabajaste todo 2026 en tu negocio. Pregunta incómoda: ¿cuánto te pagó?\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 13): plano cerrado a la cara. Dice: \"Contexto: Casi todos me contestan lo mismo: pues lo que iba sobrando. Un día sacas para la renta, otro para el súper, otro para los niños.\"", "Toma 3 (segundo 13 a 23): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"El problema es que así nunca sabes si tu negocio funciona. Te puede estar dejando menos que un trabajo normal y no te das cuenta.\"", "Toma 4 (segundo 23 a 33): plano cerrado a la cara. Dice: \"Haz esto: decide una cantidad fija que te vas a pagar cada mes y pásatela el mismo día, de la cuenta del negocio a la tuya.\"", "Toma 5 (segundo 33 a 40): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Lo que quede en la cuenta del negocio es para gastos e impuestos. Ahí no se toca.\"", "Toma 6 (segundo 40 a 46): plano cerrado a la cara. Dice: \"Moraleja: si tu negocio no te paga un sueldo, el que trabaja gratis eres tú.\"", "Toma 7 (segundo 46 a 54): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"CTA: Dime en los comentarios cuánto te pagaste en 2026. Si no sabes, dímelo también, que nadie te va a juzgar.\"", "Texto en pantalla del segundo 0 al 3: \"¿Cuánto te pagó tu negocio en 2026?\" Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"Lo que iba sobrando\"; segundo 13: \"¿Tu negocio sí funciona?\"; segundo 23: \"Un sueldo fijo, el mismo día\"; segundo 33: \"Lo demás no se toca\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 54 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta cuánto te pagaste en 2026, o dinos que no sabes.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"¿Cuánto te pagó tu negocio en 2026?\" Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Contesta todos los comentarios en la primera hora. A quien diga que no sabe, respóndele: «Tranquilo, es lo más común. Si quieres te mando unas preguntas para sacarlo, escríbeme LIBROS por mensaje.»"], "dia": "Lunes"}, {"fecha": "2027-01-05", "cuenta": "EI", "semana": 6, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Lo que necesitas para declarar", "tipo_gancho": "Situación", "gancho_texto": "Llegas sin estos papeles y tu declaración se atrasa", "gancho_hablado": "Llegas sin estos papeles y tu declaración se atrasa semanas.", "visual": "Portada con una carpeta abierta y vacía, y una lista de pendientes al lado. Estilo lista para guardar.", "desarrollo": ["Llegas sin estos papeles y tu declaración se atrasa semanas.", "Si tienes trabajo con cheque: el W-2 de cada trabajo que tuviste en 2026 (el papel de tu patrón con lo que ganaste y lo que te quitaron).", "Si te pagaron por tu cuenta: los formularios que te lleguen y tu propia lista de lo que cobraste.", "Si tienes negocio: lo que entró, lo que gastaste y los recibos.", "Si tienes casa: el papel del banco con los intereses de la hipoteca y lo que pagaste de impuestos de la propiedad.", "De tu familia: número de seguro social o ITIN (el número de impuestos de quien no tiene seguro social) y fecha de nacimiento de todos los que van en tu declaración.", "Y tu declaración del año pasado. Ahí están la mitad de las respuestas.", "¿Quieres la lista completa en PDF? Comenta REFUND y te la mandamos."], "cta": "Comenta REFUND y te mandamos la lista completa.", "caption": "Lo que más atrasa una declaración casi siempre es un papel que falta.\nComenta REFUND y te mandamos la lista completa para que no se te escape ninguno.", "calculadora": null, "notas": "[VALIDAR] la lista: cada caso puede necesitar papeles distintos. El PDF de REFUND tiene que estar listo antes de publicar.", "historias": [{"proposito": "Problema de todos los días", "formato": "Encuesta", "contenido": "¿Ya empezaste a juntar tus papeles para declarar?", "interaccion": "Encuesta: Sí / Ni los he buscado", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Ya empezaste a juntar tus papeles para declarar?\"", "Pon el sticker ENCUESTA con estas opciones: Sí / Ni los he buscado.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Problema: consecuencia", "formato": "Foto con texto", "contenido": "Foto de una mesa con sobres sin abrir. Texto: El papel que falta es el que más te atrasa el reembolso. Hoy subimos la lista.", "interaccion": "Enlace al post", "pasos": ["Fondo: Foto de una mesa con sobres sin abrir. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"El papel que falta es el que más te atrasa el reembolso. Hoy subimos la lista.\"", "Comparte en la historia el post de hoy (botón del avión de papel, «Agregar a tu historia») para que lo toquen y vayan al post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con una carpeta abierta y vacía, y una lista de pendientes al lado. Estilo lista para guardar. Título grande: \"Llegas sin estos papeles y tu declaración se atrasa\". Nada más en la portada.", "Slide 2: escribe \"Si tienes trabajo con cheque: el W-2 de cada trabajo que tuviste en 2026 (el papel de tu patrón con lo que ganaste y lo que te quitaron).\" La primera frase en negrita.", "Slide 3: escribe \"Si te pagaron por tu cuenta: los formularios que te lleguen y tu propia lista de lo que cobraste.\" La primera frase en negrita.", "Slide 4: escribe \"Si tienes negocio: lo que entró, lo que gastaste y los recibos.\" La primera frase en negrita.", "Slide 5: escribe \"Si tienes casa: el papel del banco con los intereses de la hipoteca y lo que pagaste de impuestos de la propiedad.\" La primera frase en negrita.", "Slide 6: escribe \"De tu familia: número de seguro social o ITIN (el número de impuestos de quien no tiene seguro social) y fecha de nacimiento de todos los que van en tu declaración.\" La primera frase en negrita.", "Slide 7: escribe \"Y tu declaración del año pasado. Ahí están la mitad de las respuestas.\" La primera frase en negrita.", "Slide 8: escribe \"¿Quieres la lista completa en PDF? Comenta REFUND y te la mandamos.\" La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Cuando alguien comente o escriba REFUND: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Aquí tienes la lista de papeles que vas a necesitar para declarar 👉 [enlace al PDF]. Si tienes dudas de tu caso, responde CITA.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Martes"}, {"fecha": "2027-01-06", "cuenta": "EI", "semana": 6, "formato": "Reel", "objetivo": "Venta", "tema": "No tengo tiempo", "tipo_gancho": "Regla de 2", "gancho_texto": "Una hora al mes o una semana en abril", "gancho_hablado": "Con tus números tienes dos opciones: una hora al mes, o una semana entera de abril sin dormir.", "visual": "Esmeralda sostiene un reloj de arena en una mano y en la otra una hoja de calendario de abril llena de tachones.", "desarrollo": ["Cuando le digo a alguien que revise sus números cada mes, me contesta lo mismo: no tengo tiempo.", "Yo también lo decía. Los primeros años hacía todo a la carrera y en abril me daban las dos de la mañana con los recibos.", "Lo malo de dejarlo para abril es que ya no puedes cambiar nada. Solo ves el daño.", "Con una hora al mes, si algo va mal en marzo, lo arreglas en abril. No al año siguiente.", "Ponlo en tu calendario el primer lunes de cada mes, como si fuera la cita con tu mejor cliente. Y si de plano no tienes esa hora, para eso estamos nosotros.", "El tiempo que no le das a tus números en enero te lo cobran en abril.", "Comenta LIBROS y te explico cómo lo llevamos por ti."], "cta": "Comenta LIBROS y te explicamos cómo llevamos tus números cada mes.", "caption": "¿Una hora al mes o una semana en abril?\nNadie tiene tiempo. Por eso hay que apartarlo.\nComenta LIBROS si prefieres que lo llevemos nosotros.", "calculadora": 15, "notas": "Antes de grabar, confirma con Esmeralda que la parte de «yo también lo decía» es verdad para ella. Si no, cámbiala por «muchos clientes me lo decían».", "historias": [{"proposito": "Romper una duda: «Después lo hago»", "formato": "Selfie hablando", "contenido": "Esmeralda: «Te confieso algo: yo también hacía mis números en abril, de madrugada. Pensaba que no tenía tiempo. Cuando le puse un día fijo en el calendario, el tiempo apareció.»", "interaccion": "Ninguna", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Te confieso algo: yo también hacía mis números en abril, de madrugada. Pensaba que no tenía tiempo. Cuando le puse un día fijo en el calendario, el tiempo apareció.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Romper una duda: «Después lo hago» (la respuesta)", "formato": "B-roll con texto", "contenido": "Video de un calendario con el primer lunes de cada mes marcado en rojo. Texto: 12 horas al año. Eso es lo que te pide tu negocio.", "interaccion": "Pregunta: ¿Qué día del mes te queda mejor?", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video de un calendario con el primer lunes de cada mes marcado en rojo.", "Escribe arriba, en letra grande y máximo dos líneas: \"12 horas al año. Eso es lo que te pide tu negocio.\"", "Pon música suave de Instagram, muy baja.", "Pon el sticker PREGUNTAS con el texto «¿Qué día del mes te queda mejor?». Guarda las preguntas: Esmeralda contesta 2 o 3 en historias esa misma tarde o el siguiente jueves.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Prepara antes de grabar: Oficina. Objetos: un reloj de arena y una hoja de calendario de abril impresa con tachones en rojo. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda sostiene un reloj de arena en una mano y en la otra una hoja de calendario de abril llena de tachones. Esmeralda dice: \"Con tus números tienes dos opciones: una hora al mes, o una semana entera de abril sin dormir.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 10): plano cerrado a la cara. Dice: \"Contexto: Cuando le digo a alguien que revise sus números cada mes, me contesta lo mismo: no tengo tiempo.\"", "Toma 3 (segundo 10 a 20): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Yo también lo decía. Los primeros años hacía todo a la carrera y en abril me daban las dos de la mañana con los recibos.\"", "Toma 4 (segundo 20 a 27): plano cerrado a la cara. Dice: \"Lo malo de dejarlo para abril es que ya no puedes cambiar nada. Solo ves el daño.\"", "Toma 5 (segundo 27 a 34): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Con una hora al mes, si algo va mal en marzo, lo arreglas en abril. No al año siguiente.\"", "Toma 6 (segundo 34 a 46): plano cerrado a la cara. Dice: \"Ponlo en tu calendario el primer lunes de cada mes, como si fuera la cita con tu mejor cliente. Y si de plano no tienes esa hora, para eso estamos nosotros.\"", "Toma 7 (segundo 46 a 53): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Moraleja: el tiempo que no le das a tus números en enero te lo cobran en abril.\"", "Toma 8 (segundo 53 a 57): plano cerrado a la cara. Dice: \"CTA: Comenta LIBROS y te explico cómo lo llevamos por ti.\"", "Texto en pantalla del segundo 0 al 3: \"Una hora al mes o una semana en abril\". Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"«No tengo tiempo»\"; segundo 10: \"Yo también lo decía\"; segundo 20: \"En abril ya no cambias nada\"; segundo 27: \"Primer lunes de cada mes\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 57 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta LIBROS y te explicamos cómo llevamos tus números cada mes.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Una hora al mes o una semana en abril\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Cuando alguien comente o escriba LIBROS: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Gracias por escribir. Aquí está el diagnóstico express de tus números (10 preguntas) 👉 [enlace]. Este mes estamos abriendo lugares para llevar tus números cada cal). Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha.", "Fondo o foto: Calendario 2027 con una palomita verde en cada mes. Abril sin tachones.", "Texto principal (grande, arriba o al centro): \"Quien revisa sus números cada mes no se asusta en abril.\"", "Texto secundario (más pequeño, abajo): \"Llevamos los números de tu negocio cada mes. Tú solo lees el resumen. Comenta CITA.\"", "Deja espacio libre alrededor del texto. Se tiene que leer en 3 segundos desde el celular.", "Publica a las 1:00 p. m. hora de la audiencia. Pega el caption tal cual.", "Cuando alguien comente o escriba CITA: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Con gusto te ayudamos. ¿Qué día y hora te queda mejor esta semana? Déjanos también tu nombre y tu número y te confirmamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Domingo"}, {"fecha": "2027-01-11", "cuenta": "EI", "semana": 7, "formato": "Reel", "objetivo": "Seguidores", "tema": "Nadie te descuenta impuestos", "tipo_gancho": "Sabías que", "gancho_texto": "Nadie te descuenta impuestos y el IRS igual los espera", "gancho_hablado": "Si trabajas por tu cuenta, nadie te descuenta impuestos de lo que cobras. Pero el IRS igual los espera, y no hasta abril.", "visual": "Esmeralda muestra en una mano un talón de cheque con la parte de impuestos marcada en amarillo y en la otra billetes sueltos sin nada.", "desarrollo": ["Cuando trabajas para alguien, te quitan impuestos de cada cheque. Cuando trabajas por tu cuenta, el dinero te llega completito.", "Y ahí está la trampa. Se siente tuyo, pero una parte ya es del IRS.", "Y cuando llega abril, ese dinero ya se fue en la renta, el carro y los niños.", "Por eso a mucha gente que trabaja por su cuenta le toca pagar durante el año. Uno de esos pagos vence este 15 de enero.", "Lo que puedes hacer hoy: pregunta a quien te hace los impuestos si te toca y de cuánto.", "Lo que te llega completo no es todo tuyo.", "Si ya se te pasó o no te alcanza, el sábado te digo qué hacer. Síguenos para verlo."], "cta": "Síguenos: el sábado te decimos qué hacer si ya se te pasó.", "caption": "Trabajas por tu cuenta y cobras completo.\nSe siente bonito hasta abril.\nSíguenos: el sábado te decimos qué hacer si ya se te pasó la fecha.", "calculadora": 16, "notas": "[VALIDAR] quién está obligado a estos pagos. No dar cifras. La fecha del 15 de enero es la del cuarto pago de 2026.", "historias": [{"proposito": "Cercanía: detrás de cámaras", "formato": "B-roll con texto", "contenido": "Video del equipo revisando un calendario de enero con fechas marcadas. Texto: Semana de fechas importantes. Te las vamos contando.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 10 segundos en vertical, sin hablar: Video del equipo revisando un calendario de enero con fechas marcadas.", "Escribe arriba, en letra grande y máximo dos líneas: \"Semana de fechas importantes. Te las vamos contando.\"", "Pon música suave de Instagram, muy baja.", "Sin sticker.", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Cercanía: pregunta", "formato": "Encuesta", "contenido": "¿Trabajas por tu cuenta, aunque sea los fines de semana?", "interaccion": "Encuesta: Sí / No", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"¿Trabajas por tu cuenta, aunque sea los fines de semana?\"", "Pon el sticker ENCUESTA con estas opciones: Sí / No.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Prepara antes de grabar: Oficina con pared lisa. Objetos: un talón de cheque de ejemplo (sin datos reales) con la línea de impuestos marcada con marcatextos amarillo y unos billetes de utilería. Ropa: Esmeralda con ropa de trabajo lisa, sin rayas ni logos grandes. Micrófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda muestra en una mano un talón de cheque con la parte de impuestos marcada en amarillo y en la otra billetes sueltos sin nada. Esmeralda dice: \"Si trabajas por tu cuenta, nadie te descuenta impuestos de lo que cobras. Pero el IRS igual los espera, y no hasta abril.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 11): plano cerrado a la cara. Dice: \"Contexto: Cuando trabajas para alguien, te quitan impuestos de cada cheque. Cuando trabajas por tu cuenta, el dinero te llega completito.\"", "Toma 3 (segundo 11 a 17): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Y ahí está la trampa. Se siente tuyo, pero una parte ya es del IRS.\"", "Toma 4 (segundo 17 a 24): plano cerrado a la cara. Dice: \"Y cuando llega abril, ese dinero ya se fue en la renta, el carro y los niños.\"", "Toma 5 (segundo 24 a 34): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Por eso a mucha gente que trabaja por su cuenta le toca pagar durante el año. Uno de esos pagos vence este 15 de enero.\"", "Toma 6 (segundo 34 a 41): plano cerrado a la cara. Dice: \"Lo que puedes hacer hoy: pregunta a quien te hace los impuestos si te toca y de cuánto.\"", "Toma 7 (segundo 41 a 45): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Moraleja: lo que te llega completo no es todo tuyo.\"", "Toma 8 (segundo 45 a 52): plano cerrado a la cara. Dice: \"CTA: Si ya se te pasó o no te alcanza, el sábado te digo qué hacer. Síguenos para verlo.\"", "Texto en pantalla del segundo 0 al 3: \"Nadie te descuenta impuestos y el IRS igual los espera\". Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"Te llega completito\"; segundo 11: \"Una parte ya es del IRS\"; segundo 17: \"15 de enero\"; segundo 24: \"Pregunta si te toca\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 52 segundos.", "Últimos 3 segundos: pon en pantalla \"Síguenos: el sábado te decimos qué hacer si ya se te pasó.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Nadie te descuenta impuestos y el IRS igual los espera\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Contesta todos los comentarios en la primera hora con una frase corta y cercana. Si alguien pregunta por su caso, invítalo a escribir por mensaje y ahí le mandas el texto de CITA."], "dia": "Lunes"}, {"fecha": "2027-01-12", "cuenta": "EI", "semana": 7, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Lo que nadie te dijo al empezar por tu cuenta", "tipo_gancho": "Hoyo", "gancho_texto": "Lo que nadie te dijo cuando empezaste por tu cuenta", "gancho_hablado": "Lo que nadie te dijo cuando empezaste a cobrar por tu cuenta.", "visual": "Portada con un sobre de dinero que tiene una etiqueta escrita a mano: «No todo es tuyo».", "desarrollo": ["Lo que nadie te dijo cuando empezaste a cobrar por tu cuenta.", "Cuando trabajabas con cheque, tu patrón le pagaba al IRS por ti. Ahora te toca a ti.", "Abre una cuenta aparte solo para impuestos. Que no tenga tarjeta.", "Cada vez que te paguen, pasa una parte ese mismo día. Pregunta a quien te hace los impuestos qué parte te conviene.", "Uno de los pagos al IRS vence el 15 de enero. Si no los haces, en abril puedes deberlo todo junto, y a veces con un cargo extra.", "Anota cada pago que hagas al IRS y guarda el comprobante.", "Mándaselo a ese amigo que acaba de empezar a trabajar por su cuenta."], "cta": "Mándaselo a alguien que acaba de empezar a trabajar por su cuenta.", "caption": "Si cobras por tu cuenta, una parte de lo que cobras ya tiene dueño.\nMándaselo a ese amigo que acaba de empezar, antes de que se entere en abril.", "calculadora": null, "notas": "[VALIDAR] la fecha del 15 de enero, el cargo extra y quién está obligado. Sin cifras ni porcentajes.", "historias": [{"proposito": "Problema de todos los días", "formato": "Quiz", "contenido": "Si trabajas por tu cuenta, ¿cuándo le pagas al IRS?", "interaccion": "Quiz: Solo en abril / Durante el año", "pasos": ["Fondo: la portada del post de hoy o una foto de Esmeralda en la oficina. En vertical, a pantalla completa.", "Escribe arriba, en letra grande y máximo dos líneas: \"Si trabajas por tu cuenta, ¿cuándo le pagas al IRS?\"", "Pon el sticker QUIZ con estas opciones: Solo en abril / Durante el año. Marca como correcta «Durante el año».", "Súbela entre 9 y 10 de la mañana."]}, {"proposito": "Problema: respuesta", "formato": "Selfie hablando", "contenido": "Esmeralda: «Si contestaste que solo en abril, ahí empieza el problema. Hoy en el feed te explico por qué.»", "interaccion": "Enlace al post", "pasos": ["Graba con la cámara frontal, en vertical, con luz de frente (junto a una ventana o con aro de luz). Esmeralda habla mirando a la cámara, máximo 15 segundos.", "Esmeralda dice, con sus palabras pero sin cambiar la idea: \"Si contestaste que solo en abril, ahí empieza el problema. Hoy en el feed te explico por qué.\"", "Activa los subtítulos automáticos de Instagram (sticker «Subtítulos») y déjalos abajo.", "Comparte en la historia el post de hoy (botón del avión de papel, «Agregar a tu historia») para que lo toquen y vayan al post.", "Súbela entre 4 y 6 de la tarde."]}], "instrucciones": ["Antes de empezar: lee las notas de esta pieza. Lo marcado [VALIDAR] lo confirma el preparador de impuestos antes de grabar o diseñar; lo marcado [caso real a confirmar] lo confirma Esmeralda. Esas marcas nunca se dicen, ni van en pantalla ni en el caption.", "Formato: 1080 x 1350 px (vertical). Un slide por idea, letra grande que se lea bien en el celular. Colores y tipografía de Éxito Institute. Logo pequeño abajo a la derecha en cada slide.", "Slide 1 (portada): Portada con un sobre de dinero que tiene una etiqueta escrita a mano: «No todo es tuyo». Título grande: \"Lo que nadie te dijo cuando empezaste por tu cuenta\". Nada más en la portada.", "Slide 2: escribe \"Cuando trabajabas con cheque, tu patrón le pagaba al IRS por ti. Ahora te toca a ti.\" La primera frase en negrita.", "Slide 3: escribe \"Abre una cuenta aparte solo para impuestos. Que no tenga tarjeta.\" La primera frase en negrita.", "Slide 4: escribe \"Cada vez que te paguen, pasa una parte ese mismo día. Pregunta a quien te hace los impuestos qué parte te conviene.\" La primera frase en negrita.", "Slide 5: escribe \"Uno de los pagos al IRS vence el 15 de enero. Si no los haces, en abril puedes deberlo todo junto, y a veces con un cargo extra.\" La primera frase en negrita.", "Slide 6: escribe \"Anota cada pago que hagas al IRS y guarda el comprobante.\" La primera frase en negrita.", "Slide 7: escribe \"Mándaselo a ese amigo que acaba de empezar a trabajar por su cuenta.\" La primera frase en negrita.", "En todos los slides menos el último, pon una flechita pequeña a la derecha para que la gente deslice.", "Revisa la ortografía y que ningún slide pase de 25 palabras. Si alguno se pasa, divídelo en dos.", "Publica a las 12:30 p. m. hora de la audiencia. Pega el caption tal cual: la primera línea ya funciona como gancho.", "Contesta todos los comentarios en la primera hora con una frase corta y cercana. Si alguien pregunta por su caso, invítalo a escribir por mensaje y ahí le mandas el texto de CITA."], "dia": "Martes"}, {"fecha": "2027-01-13", "cuenta": "EI", "semana": 7, "formato": "Reel", "objetivo": "Venta", "tema": "Yo gano poquito", "tipo_gancho": "Contracorriente", "gancho_texto": "Si ganas poquito, un error con el IRS te pega más", "gancho_hablado": "Me dicen: yo gano poquito, eso de los números no es para mí. Y yo les digo que justo por eso sí.", "visual": "Esmeralda pone una alcancía pequeña al lado de un sobre cerrado que dice IRS.", "desarrollo": ["Si ganas mucho, un cobro inesperado te molesta. Si ganas poquito, te desacomoda el mes entero.", "Y casi siempre, al que gana poquito es al que más le cuesta probar sus gastos, porque nunca guardó nada.", "Empieza con una libreta. Anota cada cobro y cada gasto del negocio, aunque sean de 20 dólares.", "Y si te llega una carta del IRS, no la guardes en el cajón. Llévala ese mismo día a quien te hace los impuestos.", "Y el día que necesites un préstamo, esa libreta te va a ayudar más de lo que crees.", "Mientras más chiquito es tu negocio, menos espacio tienes para un susto.", "Si tu negocio es chiquito y no sabes por dónde empezar, comenta CITA."], "cta": "Comenta CITA y te ayudamos a empezar, aunque tu negocio sea chiquito.", "caption": "¿Tu negocio es chiquito?\nEntonces un error con el IRS te pega más fuerte que a uno grande.\nComenta CITA y vemos por dónde empezar.", "calculadora": 14, "notas": "No exagerar consecuencias. Sin cifras de multas.", "historias": [{"proposito": "Romper una duda: «Eso no es para mí»", "formato": "Selfie hablando", "contenido": "Esmeralda: «Una señora que vende comida los fines de rófono de solapa puesto. Teléfono en vertical, en tripié, a la altura de los ojos.", "Imprime el guion y que Esmeralda lo lea dos veces en voz alta. Las etiquetas como «Contexto:», «Moraleja:» o «CTA:» son guía y no se dicen. Puede decirlo con sus palabras, pero la primera frase va tal cual. Tiene que durar entre 45 y 70 segundos; si se pasa, quita frases del medio, nunca el inicio.", "Toma 1, el gancho (segundo 0 a 3): plano de pecho hacia arriba. Lo que se ve: Esmeralda pone una alcancía pequeña al lado de un sobre cerrado que dice IRS. Esmeralda dice: \"Me dicen: yo gano poquito, eso de los números no es para mí. Y yo les digo que justo por eso sí.\" Grábala 3 veces y quédate con la más natural.", "Toma 2 (segundo 3 a 10): plano cerrado a la cara. Dice: \"Contexto: Si ganas mucho, un cobro inesperado te molesta. Si ganas poquito, te desacomoda el mes entero.\"", "Toma 3 (segundo 10 a 18): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Y casi siempre, al que gana poquito es al que más le cuesta probar sus gastos, porque nunca guardó nada.\"", "Toma 4 (segundo 18 a 25): plano cerrado a la cara. Dice: \"Empieza con una libreta. Anota cada cobro y cada gasto del negocio, aunque sean de 20 dólares.\"", "Toma 5 (segundo 25 a 34): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Y si te llega una carta del IRS, no la guardes en el cajón. Llévala ese mismo día a quien te hace los impuestos.\"", "Toma 6 (segundo 34 a 41): plano cerrado a la cara. Dice: \"Y el día que necesites un préstamo, esa libreta te va a ayudar más de lo que crees.\"", "Toma 7 (segundo 41 a 46): plano medio (de la cintura para arriba), con el objeto a la vista si lo hay. Dice: \"Moraleja: mientras más chiquito es tu negocio, menos espacio tienes para un susto.\"", "Toma 8 (segundo 46 a 51): plano cerrado a la cara. Dice: \"CTA: Si tu negocio es chiquito y no sabes por dónde empezar, comenta CITA.\"", "Texto en pantalla del segundo 0 al 3: \"Si ganas poquito, un error con el IRS te pega más\". Máximo dos líneas, letra grande, a la altura del pecho, sin tapar la cara.", "Textos de apoyo (cada uno aparece con su frase y se quita al cambiar de toma): segundo 3: \"«Yo gano poquito»\"; segundo 10: \"Te desacomoda el mes\"; segundo 18: \"Empieza con una libreta\"; segundo 25: \"La carta, ese mismo día\".", "Edición: corta todos los silencios y respiraciones. Subtítulos completos en español, palabra por palabra, letra blanca con borde negro, en la parte de abajo. Cambia de plano o haz un zoom ligero cada 2 o 3 segundos. Música instrumental suave y muy baja, o sin música. Duración total aproximada: 51 segundos.", "Últimos 3 segundos: pon en pantalla \"Comenta CITA y te ayudamos a empezar, aunque tu negocio sea chiquito.\" en letras grandes.", "Portada: el mejor cuadro de Esmeralda mirando a cámara de la toma 1, con el texto \"Si ganas poquito, un error con el IRS te pega más\". Colores de Éxito Institute.", "Publica a las 6:00 p. m. hora de la audiencia. Si el panel de Instagram muestra otra hora pico, publica 1 o 2 horas antes de ese pico. Pega el caption tal cual. Activa «Compartir también en Facebook».", "Cuando alguien comente o escriba CITA: contesta en el comentario «Te lo mandé por mensaje 🙌» y mándale por DM este texto: \"¡Hola! Con gusto te ayudamos. ¿Qué día y hora te queda mejor esta semana? Déjanos también tu nombre y tu número y te confirmamos.\" Ese mismo día anota su nombre en la hoja de prospectos."], "dia": "Miércoles"}, {"fecha": "2027-01-14", "cuenta": "EI", "semana": 7, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Fecha: 15 de enero", "tipo_gancho": "Fecha límite", "gancho_texto": "Mañana vence un pago que muchos no saben que existe", "gancho_hablado": "15 de enero: el pago al IRS que muchos no saben que les toca", "visual": "Calendario con el 15 de enero encerrado en un círculo rojo. Letras grandes.", "desarrollo": ["15 de enero: el pago al IRS que muchos no saben qu
