<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parrilla diciembre y enero</title>
<style>
:root{--olive:#7b8e46;--sage:#b8c48a;--cream:#f4f2ed;--paper:#fff;--ink:#000;--text:#686664;--line:#dcd9cf;--strong:#59662d;--forest:#22281b;--soft:#eef1e4;--warn:#992f23;--head:"Open Sans",Arial,sans-serif}
body[data-c=EI]{--paper:#fffdf9;--ink:#22281b;--text:#5b6254;--line:#d5d8ca;--soft:#e9eddf;--head:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 Arial,Helvetica,sans-serif}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0 0 .5em}
a{color:var(--strong)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.top img{height:38px;width:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button,.chip{font:600 14px Arial,sans-serif;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--olive);border-color:var(--olive);color:#fff}
nav.toc{background:var(--soft);border-bottom:1px solid var(--line)}
nav.toc .wrap{display:flex;gap:16px;overflow-x:auto;padding:10px 16px;font-size:14px;white-space:nowrap}
section{padding:36px 0 8px}
.hero{padding:40px 0 10px}
.hero h1{font-size:clamp(30px,4.4vw,48px)}
.hero p{max-width:760px;color:var(--text);font-size:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:20px;margin:0 0 14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.muted{color:var(--text)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:s;position:relative;padding:0 0 10px 38px}
.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:var(--olive);color:#fff;font:700 13px/26px Arial;text-align:center}
.bad,.good{padding:12px 14px;border-radius:10px;margin:6px 0}
.bad{background:#f6e9e6;border-left:4px solid var(--warn)}
.good{background:var(--soft);border-left:4px solid var(--olive)}
.tag{display:inline-block;font:700 12px Arial;letter-spacing:.03em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--strong);margin:0 4px 4px 0}
.f-Reel{background:var(--olive);color:#fff}.f-Carrusel{background:var(--sage);color:var(--forest)}.f-Imagen{background:var(--forest);color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--text);text-transform:uppercase;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.legend{display:none;font-size:13px;margin:8px 0 0}
.cal .h{font:700 12px Arial;color:var(--text);text-align:center;text-transform:uppercase}
.cal a{display:block;min-height:64px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px;text-decoration:none;color:var(--ink);font-size:12px}
.cal a b{display:block;font-size:15px}
.cal a.done{opacity:.45}
.cal .e{visibility:hidden}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.filters select{font:15px Arial;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--paper)}
.day{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:0 0 18px;overflow:hidden;scroll-margin-top:120px}
.day>header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 20px;background:var(--soft);flex-wrap:wrap}
.day>header h3{margin:0;font-size:22px}
.day .body{padding:6px 20px 18px}
.day h4{font:700 13px Arial;text-transform:uppercase;letter-spacing:.04em;color:var(--strong);margin:18px 0 6px}
.say{background:var(--cream);border-radius:10px;padding:12px 14px;margin:4px 0}
.say p{margin:.2em 0}
.hook{font-family:var(--head);font-size:24px;line-height:1.25;margin:2px 0 6px}
.cols{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.story{border:1px dashed var(--line);border-radius:12px;padding:12px 14px}
.note{background:#fbf3e3;border-left:4px solid #c79a3a;padding:10px 14px;border-radius:8px;font-size:15px}
label.done{display:flex;gap:8px;align-items:center;font:700 14px Arial;cursor:pointer}
label.done input{width:20px;height:20px;accent-color:var(--olive)}
ol.plain{margin:4px 0;padding-left:22px}
details summary{cursor:pointer;font-weight:700;color:var(--strong)}
.swatch{display:flex;gap:10px;align-items:center;margin:6px 0}
.swatch i{width:44px;height:30px;border-radius:8px;border:1px solid var(--line);flex:none}
mark{background:#ffe58a;color:#000;padding:0 3px;border-radius:4px;font-weight:700}
.pending{background:#fff6d6;border:1px solid #e9cf72;border-radius:10px;padding:10px 14px;margin:12px 0 0}
footer{padding:40px 0;color:var(--text);font-size:14px}
[hidden]{display:none!important}
@media (max-width:760px){.cols{grid-template-columns:1fr}.cal{gap:4px}.cal a{min-height:48px;padding:4px}.cal .tag{font-size:0;width:12px;height:12px;padding:0;margin:4px 0 0}.legend{display:block}.hook{font-size:20px}.day>header,.day .body{padding-left:14px;padding-right:14px}}
@media print{header.top,nav.toc,.filters,label.done{display:none}.day{break-inside:avoid}body{background:#fff}}
</style>
</head>

<script>
const DATA={"comoUsar": ["Arriba elige la cuenta: Esmeralda (Living Trust) o Éxito Institute (Taxes y Bookkeeping). Son dos cuentas distintas y cada una tiene su propia parrilla completa.", "Lee una vez las partes 2 a 7. Ahí está cómo pensamos el contenido. Si te saltas la regla de oro, el contenido sale mal aunque esté bien grabado.", "Cada lunes abre la parte 9, filtra por la semana y revisa los 7 días. Junta todo lo que hay que grabar esa semana y grábalo en una sola sesión.", "Antes de grabar, imprime o ten abierta la ficha del día. Esmeralda lee la frase, la entiende y la dice con sus palabras. No tiene que ser idéntica, pero sí tiene que empezar igual.", "Cuando publiques, marca la casilla “Publicado” en la ficha. Así el calendario muestra lo que falta.", "Todo lo que está en amarillo entre corchetes es un pendiente. [VALIDAR]: no se publica hasta que Esmeralda confirme el dato o la regla. [caso real a confirmar]: hay que poner un caso verdadero de un cliente, con su permiso y sin su nombre; si no hay caso, se cambia por una situación general. [enlace…]: hay que pegar el enlace real. [si se aprueba el descuento]: no se menciona ningún descuento hasta que Esmeralda lo apruebe por escrito.", "Los corchetes nunca se publican. Antes de subir algo, busca que no quede ninguno en el texto en pantalla, el post o las historias."], "horario": "Publica entre las 12:00 y las 19:00, hora de donde vive la audiencia. Para afinar: en Instagram entra a Panel profesional, luego Seguidores, y mira a qué hora se conectan más. Publica 1 o 2 horas antes de ese pico. Las historias se reparten: la 1 por la mañana y la 2 por la tarde.", "regla": [{"t": "Hablamos de lo que le pasa a la gente, no del servicio", "p": "Casi nadie que nos ve sabe que tiene un problema. No busca “Living Trust” ni “bookkeeping”. Sí le importa su casa, sus hijos, su dinero, el IRS y no terminar en una corte. Por eso el inicio de cada pieza habla de eso, con palabras de todos los días. El nombre técnico, si sale, sale después y explicado."}, {"t": "Primero lo que se puede perder o ganar", "p": "Los temas de impuestos y herencias aburren si empiezas explicando. Enganchan cuando en el primer segundo la persona entiende qué está en juego: su casa, miles de dólares, meses de trámites, una pelea entre hermanos. Después damos de 1 a 3 cosas concretas que puede hacer. Luego una enseñanza corta. Al final, una sola petición."}, {"t": "Una sola idea por pieza", "p": "Si el reel trata de los hijos menores, no metas también impuestos y cuentas de banco. Una idea, bien contada, y se acabó."}, {"t": "Que lo entienda un niño de 5 años y le importe a una persona de 50", "p": "Si tienes que explicar una palabra, cámbiala. Si a tu mamá o a tu tía no les importaría, busca otro inicio."}], "checklist": ["¿Los primeros 2 segundos dicen qué se puede perder o ganar?", "¿El texto en pantalla, lo que dice Esmeralda y lo que se ve al inicio dicen lo mismo?", "¿Hay alguna palabra técnica al principio? Si la hay, cámbiala.", "¿El reel dura entre 45 segundos y 1 minuto 10?", "¿Al final se pide una sola cosa?", "¿Los subtítulos están bien escritos y no tapan la cara?", "¿Hay algún dato marcado VALIDAR sin confirmar? Si sí, no se publica.", "¿Suena a Esmeralda hablando con una amiga, o suena a anuncio? Tiene que sonar a ella."], "formatos": [{"f": "Reel", "para": "Llegar a gente nueva que todavía no nos conoce. Es el formato que más alcance da. Siempre Esmeralda hablando a cámara, con algún objeto en la mano (llaves, papeles, sobres, calculadora).", "mide": "Vistas, veces compartido y comentarios con la palabra clave. Un reel va bien si sus vistas son por lo menos un tercio de los seguidores."}, {"f": "Carrusel", "para": "Que la gente lo guarde o se lo mande a alguien. Listas para revisar, casos contados paso a paso, procesos sencillos.", "mide": "Guardados y compartidos. Son más importantes que los likes."}, {"f": "Imagen", "para": "Recordar quiénes somos: un dato fuerte, una fecha límite, una frase de Esmeralda o un saludo de temporada con algo útil.", "mide": "No esperamos alcance. Sirve para que el perfil se vea vivo y con autoridad."}, {"f": "Historias", "para": "Que la gente que ya nos sigue confíe y nos escriba. Es donde se vende.", "mide": "Respuestas, votos en encuestas y DMs. Lo sano es que cada historia la vea entre el 5% y el 15% de los seguidores."}], "objetivos": [{"o": "Viral", "p": "Que lo vea la mayor cantidad de gente posible. Sin venta al final. Se pide que lo compartan con alguien."}, {"o": "Seguidores", "p": "Que quien lo vea quiera seguir la cuenta. Al final se da una razón concreta para seguir (por ejemplo: “esta semana subo el resto de casos”). Nunca “sígueme para más”."}, {"o": "Venta", "p": "Que la persona comente una palabra clave o escriba por DM. Ahí empieza la conversación de venta."}, {"o": "Guardado", "p": "Solo carruseles: que lo guarden para usarlo después."}, {"o": "Autoridad", "p": "Solo imágenes: que la cuenta se vea seria y útil."}], "semanaHistorias": [{"d": "Lunes", "p": "Cercanía", "q": "Que vean a Esmeralda como persona: su día, la oficina, una reunión, su familia si ella quiere. La gente le compra a quien conoce."}, {"d": "Martes", "p": "Un problema común", "q": "Que la persona se dé cuenta de que le puede pasar a ella. Siempre con encuesta o pregunta."}, {"d": "Miércoles", "p": "Romper una duda", "q": "Contestar lo que la gente piensa y no dice: “es caro”, “después lo hago”, “eso no es para mí”. Cada semana toca una duda distinta (ver tabla abajo)."}, {"d": "Jueves", "p": "Preguntas de la gente", "q": "Abrir caja de preguntas en la historia 1 y contestar una en video en la historia 2."}, {"d": "Viernes", "p": "Regalo a cambio de una palabra", "q": "Ofrecer la guía o la clase gratis a quien escriba la palabra clave. Así conseguimos contactos."}, {"d": "Sábado", "p": "Prueba", "q": "Mostrar un caso real (sin nombres ni datos privados) o un mensaje de un cliente agradecido."}, {"d": "Domingo", "p": "Invitación a agendar", "q": "Un caso corto y luego la invitación directa: “escríbeme CITA y vemos tu caso”."}], "reglasHistorias": ["Nunca dos historias seguidas del mismo tipo. Si la 1 es selfie hablando, la 2 es foto con texto, encuesta, video de los papeles, etc.", "La primera historia del día decide si ven la segunda. Empieza con una pregunta o con algo que dé curiosidad.", "Solo se pide comprar o agendar 2 o 3 veces por semana (viernes y domingo). Los demás días se acompaña y se educa.", "Hechas con el celular, sin mucha edición. Lo natural funciona mejor que lo producido.", "Casos y mensajes de clientes: siempre tapar nombres, caras, montos exactos de cuentas y direcciones, y pedir permiso al cliente antes.", "El 24, 25 y 31 de diciembre y el 1 de enero las historias son de cercanía y buenos deseos, con un mensaje útil corto. Nada de vender."], "descuentos": "Los descuentos de estas campañas todavía no están aprobados. Donde la ficha dice “si se aprueba el descuento”, no se menciona ningún porcentaje hasta que Esmeralda lo apruebe por escrito.", "glosario": [{"t": "Gancho", "d": "Lo primero que se ve y se escucha. Dura 2 o 3 segundos y decide si la persona se queda o pasa al siguiente video."}, {"t": "Texto en pantalla", "d": "La frase escrita que aparece arriba o en medio del video en el primer segundo. Máximo 2 líneas. No tapa la cara."}, {"t": "CTA", "d": "Lo que le pedimos a la persona al final: comentar una palabra, guardar, compartir, escribir por DM."}, {"t": "Palabra clave", "d": "Una palabra en mayúsculas (por ejemplo PAPELES) que la persona comenta para recibir algo gratis. Con eso sabemos quién está interesado."}, {"t": "Plano medio", "d": "Se ve a Esmeralda de la cintura para arriba."}, {"t": "Primer plano", "d": "Se ve solo la cara y los hombros."}, {"t": "B-roll", "d": "Tomas de apoyo sin hablar: manos firmando, llaves, papeles, la calle, la oficina. Se ponen encima de la voz."}, {"t": "Portada", "d": "La imagen fija que se ve en el perfil antes de darle play al reel. Lleva el gancho escrito en grande."}, {"t": "Slide", "d": "Cada una de las imágenes de un carrusel."}, {"t": "Sticker", "d": "Los elementos de Instagram en historias: encuesta, pregunta, quiz, enlace, cuenta regresiva."}, {"t": "Regalo", "d": "La guía, checklist o clase corta que damos gratis a cambio de la palabra clave."}], "cuentas": {"LT": {"nombre": "Esmeralda Espinoza", "titulo": "Parrilla de Esmeralda: proteger a la familia", "intro": "Esta cuenta habla de una cosa: que la familia no sufra trámites, cortes ni peleas cuando a alguien le pasa algo. El servicio es el Living Trust, pero casi nunca lo nombramos al inicio. Hablamos de la casa, de los hijos y de lo que pasa cuando no hay nada firmado.", "promesa": "Que tu familia no tenga que ir a la corte para quedarse con lo que construiste.", "ejemplos": [{"mal": "¿Qué es un Living Trust y cuáles son sus beneficios?", "bien": "Estaban casados, los dos en el título de la casa… y aun así ella tuvo que ir a la corte."}, {"mal": "La importancia del Power of Attorney.", "bien": "Si mañana tienes un accidente, tu esposo no puede firmar ni para vender tu carro."}, {"mal": "Diferencias entre testamento y trust.", "bien": "Tu mamá hizo su testamento. Igual sus hijos van a pasar meses en trámites. Te explico por qué."}, {"mal": "Cuánto cuesta un Living Trust.", "bien": "Te ahorraste unos dólares haciéndolo por internet. A tu familia le va a salir mucho más caro."}], "metas": [{"t": "Diciembre: abrir los ojos", "p": "La gente se reúne en familia. Es el momento de que piensen “¿y si me pasa algo?”. Mucho alcance, mucha conversación."}, {"t": "Enero: ordenar los papeles", "p": "Año nuevo, papeles nuevos. La campaña de organización de la familia convierte esa conversación en citas."}, {"t": "Siempre: confianza", "p": "Educamos sin asustar de más y sin prisas falsas. Esmeralda orienta y explica; no da asesoría legal. Cuando el caso lo pide, se dice que lo revise un abogado."}], "campanas": [{"f": "1–31 dic", "n": "Conversaciones en familia", "p": "Contenido sobre la casa, los hijos y qué pasa si alguien falta o no puede decidir. Ninguna oferta."}, {"f": "18–31 dic", "n": "Calentamos la campaña de Año Nuevo", "p": "Empezamos a hablar de “ordenar los papeles de la familia en enero” e invitamos a escribir CITA para revisarlos en enero."}, {"f": "1–31 ene", "n": "Organización de la familia de Año Nuevo", "p": "Momento principal. Invitamos a revisar documentos y a agendar con la palabra CITA. Descuento solo si se aprueba."}], "semanas": [{"n": 1, "f": "1–6 dic", "t": "Lo que crees que ya está protegido", "s": "“Yo pensaba que por estar casada ya estaba todo arreglado.”"}, {"n": 2, "f": "7–13 dic", "t": "Si mañana no puedes decidir por ti", "s": "“¿Quién firmaría por mí si tengo un accidente?”"}, {"n": 3, "f": "14–20 dic", "t": "Tus hijos, si tú faltas", "s": "“¿Con quién se quedarían mis hijos?”"}, {"n": 4, "f": "21–27 dic", "t": "Navidad: la conversación que nadie quiere tener", "s": "“Esta Navidad lo voy a platicar con mi familia.”"}, {"n": 5, "f": "28 dic–3 ene", "t": "Un propósito de año nuevo que sí protege a tu familia", "s": "“Este año sí lo hago.”"}, {"n": 6, "f": "4–10 ene", "t": "Ordena los papeles de tu familia", "s": "“Tengo todo regado; necesito ordenarlo.”"}, {"n": 7, "f": "11–17 ene", "t": "Lo que cuesta no hacerlo", "s": "“Sale más caro no hacerlo que hacerlo.”"}, {"n": 8, "f": "18–24 ene", "t": "“Ya tengo testamento”", "s": "“Creí que con el testamento bastaba.”"}, {"n": 9, "f": "25–31 ene", "t": "“Eso no es para gente como yo”", "s": "“Yo también tengo algo que proteger.”"}], "objeciones": [{"n": "Semana 1", "d": "Es muy caro", "c": "Comparar lo que cuesta hacerlo con lo que le cuesta a la familia en tiempo, dinero y desgaste si no hay nada firmado."}, {"n": "Semana 2", "d": "Después lo hago", "c": "Esmeralda cuenta que ella también lo dejaba para después y qué la hizo cambiar."}, {"n": "Semana 3", "d": "Eso no es para mí", "c": "Un caso de una familia normal, con una casa y una cuenta de banco."}, {"n": "Semana 4", "d": "Ya lo tengo resuelto", "c": "Mostrar con un ejemplo lo que pasa cuando la familia cree que está protegida y no lo está."}, {"n": "Semana 5", "d": "Es muy caro", "c": "Lo barato hecho por internet sin entenderlo: lo que puede salir mal."}, {"n": "Semana 6", "d": "Después lo hago", "c": "Enseñar que el proceso va por etapas y lo poco que le toca hacer a la persona en cada una."}, {"n": "Semana 7", "d": "Eso no es para mí", "c": "Un caso de una familia que renta o que tiene una sola propiedad."}, {"n": "Semana 8", "d": "Ya lo tengo resuelto", "c": "Lo que un testamento solo no evita, con un ejemplo sencillo."}, {"n": "Semana 9", "d": "Ya lo intenté y no lo terminé", "c": "Un caso de alguien que empezó, lo dejó a medias y cómo lo cerró."}], "palabras": [{"k": "PAPELES", "que": "Checklist: lo que tu familia va a necesitar si mañana te pasa algo", "estado": "Hay que crear la checklist (PDF de 1 o 2 páginas) antes del 1 de diciembre: se ofrece desde el primer post.", "pasos": ["Contesta el comentario en público: “¡Te la mando por DM!”", "Manda el DM con el mensaje de abajo y el PDF.", "A los 2 días pregunta si la pudo revisar y si le quedó alguna duda.", "Si contesta con dudas, invítala a escribir CITA."], "dm": "¡Hola! Aquí está la lista de papeles que tu familia va a necesitar si un día te pasa algo. Revísala con calma, con un cafecito. Si te sale algo que no tienes o no sabes dónde está, cuéntame y te oriento."}, {"k": "CASA", "que": "Clase corta gratis (6 minutos): qué pasa con tu casa si faltas", "estado": "Hay que grabar la clase antes del 9 de diciembre (se ofrece por primera vez ese día).", "pasos": ["Contesta el comentario: “¡Listo, te llega por DM!”", "Manda el DM con el enlace a la clase.", "Al día siguiente pregunta qué fue lo que más le sorprendió.", "Si dice que quiere revisar su caso, pasa a CITA."], "dm": "¡Hola! Te comparto la clase cortita sobre qué pasa con tu casa si un día faltas. Son 6 minutos. Al final te digo cómo saber si tu familia está protegida o no."}, {"k": "CITA", "que": "Agendar una orientación con Esmeralda", "estado": "Usar el enlace de agenda que ya tiene el equipo.", "pasos": ["Contesta en público: “Te escribo por DM.”", "Manda el DM con el enlace de agenda.", "Si en 24 horas no agenda, mándale un recordatorio amable.", "Avísale a Esmeralda del nuevo prospecto ese mismo día."], "dm": "¡Hola! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario."}], "marca": {"colores": [{"h": "#7b8e46", "u": "Verde principal: botones, palabra clave, detalles que tienen que destacar."}, {"h": "#b8c48a", "u": "Verde suave: fondos de tarjetas y cajas de apoyo."}, {"h": "#f4f2ed", "u": "Crema: fondos de carruseles e imágenes."}, {"h": "#000000", "u": "Negro: títulos."}, {"h": "#686664", "u": "Gris: textos largos y descripciones."}, {"h": "#ffffff", "u": "Blanco: fondo principal y espacios en blanco."}], "estilo": ["Títulos en letra gruesa sin adornos (tipo Open Sans Bold o Montserrat Bold), en negro sobre fondo crema o blanco.", "Texto normal en gris #686664. Nunca texto largo en verde.", "Una sola cosa en verde #7b8e46 por slide: la palabra clave o el número importante.", "Logo de Esmeralda pequeño abajo, en la última slide y en las imágenes. Versión blanca sobre fondos oscuros.", "Fotos reales de Esmeralda y de documentos, llaves o casas. Nada de imágenes de banco que se vean falsas.", "Mucho espacio en blanco. Máximo 25 palabras por slide."]}}, "EI": {"nombre": "Éxito Institute", "titulo": "Parrilla de Éxito Institute: que el dinero no se escape", "intro": "Esta cuenta habla de dinero que la gente pierde sin darse cuenta: impuestos de más, multas, sorpresas en abril y negocios que trabajan mucho y no dejan nada. Los servicios son taxes y bookkeeping, pero el inicio de cada pieza siempre habla del dinero de la persona.", "promesa": "Que tu dinero no se vaya en impuestos que no tenías que pagar ni en sorpresas en abril.", "ejemplos": [{"mal": "Diferencias entre cash y accrual accounting.", "bien": "Tu cuenta del banco dice que perdiste dinero este año. En realidad ganaste. Te explico."}, {"mal": "Deducciones disponibles para tu negocio.", "bien": "Estás pagando impuestos sobre dinero que ya gastaste en tu negocio."}, {"mal": "Qué es el pago estimado trimestral.", "bien": "Si trabajas por tu cuenta, el IRS te cobra por adelantado. Y casi nadie te avisa."}, {"mal": "Servicio de bookkeeping mensual.", "bien": "Si haces tus cuentas solo en abril, ya llegaste tarde a ahorrarte dinero."}], "metas": [{"t": "Diciembre: cerrar bien el año", "p": "Lo que todavía se puede hacer antes del 31 de diciembre. La gente siente que el tiempo se acaba, y es verdad: la fecha es real."}, {"t": "Enero: contratos de todo el año", "p": "Campaña principal: que los negocios contraten el bookkeeping mensual desde enero. También preparamos la temporada de impuestos."}, {"t": "Siempre: hablarle a cualquiera que gana dinero", "p": "Nunca contenido solo para contadores o dueños de negocios grandes. Le hablamos a quien trabaja por su cuenta, tiene un negocito o recibe un 1099 sin saber qué es."}], "campanas": [{"f": "1–31 dic", "n": "Cierre del año de tu negocio", "p": "Ordenar cuentas, separar gastos, revisar nómina y preparar la declaración. Palabra clave CIERRE."}, {"f": "18–31 dic", "n": "Calentamos la campaña de enero", "p": "Empezamos a decir que en enero abrimos lugares para llevar las cuentas mes a mes."}, {"f": "1–31 ene", "n": "Tus cuentas al día todo el año", "p": "Campaña principal de los dos meses: contratar el bookkeeping mensual. Descuento solo si se aprueba."}, {"f": "1–15 ene", "n": "Pago al IRS del 15 de enero", "p": "Recordatorio educativo para quien trabaja por su cuenta. Sin oferta."}, {"f": "18–31 ene", "n": "Formularios para quien pagó a ayudantes", "p": "Avisar que hay papeles que se entregan antes del 1 de febrero a quien le pagaste. VALIDAR montos y reglas vigentes."}], "semanas": [{"n": 1, "f": "1–6 dic", "t": "Tu banco no te dice la verdad sobre tu negocio", "s": "“¿Entonces sí estoy ganando o no?”"}, {"n": 2, "f": "7–13 dic", "t": "Lo que todavía puedes hacer antes del 31", "s": "“Todavía estoy a tiempo.”"}, {"n": 3, "f": "14–20 dic", "t": "Por qué este año vas a deber", "s": "“No quiero otra sorpresa en abril.”"}, {"n": 4, "f": "21–27 dic", "t": "Navidad en tu negocio: regalos, bonos y efectivo", "s": "“No sabía que eso también contaba.”"}, {"n": 5, "f": "28 dic–3 ene", "t": "Este año no haces tus cuentas en abril", "s": "“Este año sí las llevo al día.”"}, {"n": 6, "f": "4–10 ene", "t": "Tus cuentas al día, mes a mes", "s": "“Necesito saber si mi negocio gana.”"}, {"n": 7, "f": "11–17 ene", "t": "El IRS cobra por adelantado", "s": "“Nadie me había dicho esto.”"}, {"n": 8, "f": "18–24 ene", "t": "Le pagaste a alguien este año: esto te toca", "s": "“¿Tengo que entregarle algo a mi ayudante?”"}, {"n": 9, "f": "25–31 ene", "t": "¿Dónde está mi dinero del IRS?", "s": "“Quiero mi devolución sin problemas.”"}], "objeciones": [{"n": "Semana 1", "d": "Es muy caro pagarle a alguien", "c": "Comparar lo que cuesta con el dinero que se pierde en multas e impuestos de más."}, {"n": "Semana 2", "d": "Después lo hago, lo veo en abril", "c": "Esmeralda cuenta lo que le pasó a ella por dejar todo para el final."}, {"n": "Semana 3", "d": "Eso no es para mí, yo solo trabajo por mi cuenta", "c": "Caso de alguien que pensaba igual y se encontró una deuda con el IRS."}, {"n": "Semana 4", "d": "Ya lo tengo resuelto, mi preparador me lo arregla", "c": "Lo que se le escapa a quien solo te ve una vez al año."}, {"n": "Semana 5", "d": "Es muy caro", "c": "Comparar el costo mensual con las multas y el dinero que se pierde."}, {"n": "Semana 6", "d": "Después lo hago, no tengo tiempo", "c": "Enseñar lo poco que le toca hacer al cliente cada mes."}, {"n": "Semana 7", "d": "Eso no es para mí, mi negocio es muy chiquito", "c": "Caso de un negocio pequeño que encontró dinero perdido."}, {"n": "Semana 8", "d": "Ya lo tengo resuelto", "c": "Mostrar con números de un caso lo que pagó y lo que dejó de perder."}, {"n": "Semana 9", "d": "Ya lo intenté, mi contador lo hace", "c": "Qué preguntas hacer antes de entregarle tus papeles a alguien."}], "palabras": [{"k": "CIERRE", "que": "Checklist de cierre de año para tu negocio", "estado": "Hay que crear la checklist antes del 1 de diciembre.", "pasos": ["Contesta el comentario: “¡Te la mando por DM!”", "Manda el DM con el mensaje y el PDF.", "A los 3 días pregunta cuántas casillas pudo marcar.", "Si le faltan varias, invítala a escribir LIBROS para revisar sus números."], "dm": "¡Hola! Aquí va la lista para cerrar bien el año de tu negocio. Ve marcando lo que ya tienes. Lo que te falte, me dices y vemos cómo resolverlo antes del 31."}, {"k": "LIBROS", "que": "Diagnóstico express de tus números: 10 preguntas", "estado": "Hay que crear el diagnóstico de 10 preguntas antes del 18 de diciembre.", "pasos": ["Contesta en público: “Te lo mandé por mensaje 🙌”.", "Manda el DM con el mensaje de abajo y el enlace al diagnóstico.", "Si responde CITA, pásalo a la agenda y llámalo ese mismo día o el siguiente.", "Después de la llamada, manda el resumen y la propuesta de servicio mensual."], "dm": "¡Hola! Gracias por escribir. Aquí está el diagnóstico express de tus números (10 preguntas) 👉 [enlace]. Este mes estamos abriendo lugares para llevar tus números cada mes. ¿Te aparto uno? Responde CITA y te llamamos."}, {"k": "REFUND", "que": "Lista de papeles para declarar sin que se atrase tu devolución", "estado": "Hay que crear la lista antes del 8 de diciembre.", "pasos": ["Contesta: “¡Te la mando!”", "Manda el DM con la lista.", "Pregunta si ya tiene todos sus formularios de trabajo.", "Si quiere que se la preparen, pasa a CITA."], "dm": "¡Hola! Aquí tienes la lista de papeles para declarar sin que se atrase tu devolución. Si te falta a  la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «¿Qué contestaste? En el post de hoy te digo qué revisar.»", "Comparte el post de hoy: toca el avión de papel debajo del post → «Agregar a tu historia», y pon el texto encima del post.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 8 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): foto de unas llaves sobre una carpeta vacía. Texto grande en dos líneas. Texto grande: «Casados, pero no todo pasa solo a tu pareja». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: ««Si yo falto, todo pasa a mi pareja.» Depende de cómo esté puesto cada papel.»", "Slide 3: «La casa: importa cómo están los dos en el título, no solo que estén.»", "Slide 4: «Las cuentas: si están solo a tu nombre y sin beneficiario, tu pareja puede tener que hacer trámites.»", "Slide 5: «El carro: lo mismo. Fíjate a nombre de quién está.»", "Slide 6: «Lo que sí puedes hacer hoy: revisa a nombre de quién están tu casa, tus cuentas y tu carro. Y anota quién decidiría si tú faltas.»", "Slide 7: «Mañana te cuento lo que le pasó a una clienta que creía que estaba todo arreglado.»", "Slide 8 (cierre): «Comenta PAPELES y te mando la lista de lo que tu familia va a necesitar.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las ón", "gancho_texto": "Si te accidentas, ¿quién paga tus cuentas?", "gancho_hablado": "Si mañana tienes un accidente y no puedes hablar, tu esposo no puede firmar por ti. Ni en el banco, ni para vender tu carro.", "visual": "Esmeralda sostiene una pluma sobre una hoja en blanco y la deja caer.", "desarrollo": ["La gente piensa en esto solo cuando alguien muere. Pero hay algo más común: un accidente, un derrame, quedarte un tiempo sin poder decidir.", "Las cuentas siguen llegando. La hipoteca, el carro, la renta del negocio.", "Y lo que está a tu nombre solo lo puedes mover tú. Aunque sea tu esposo, tu hijo o tu mamá.", "Si no hay un papel donde tú le diste ese permiso a alguien, tu familia tiene que ir a la corte a pedirlo. Con abogados.", "Ese papel se llama poder: una hoja donde tú escoges quién puede firmar por ti. Se firma cuando estás bien. Después ya no se puede.", "Sirve para cuando sigues aquí y no puedes hablar.", "Sígueme: esta semana te cuento qué puede y qué no puede hacer tu familia si tú no puedes firmar."], "cta": "Sígueme: esta semana, qué puede hacer tu familia si tú no puedes firmar.", "caption": "No hace falta morirse para que tu familia quede atada de manos.\nUn accidente basta.\nSígueme: esta semana te cuento qué puede hacer tu familia si tú no puedes firmar.", "calculadora": 15, "notas": "Contenido educativo; Esmeralda no da asesoría legal. [VALIDAR] nombre y requisitos del poder (y si hace falta notario) según el estado.", "historias": [{"proposito": "Cercanía / detrás de cámaras · contar la idea del día", "formato": "Vídeo lifestyle (café y agenda)", "contenido": "Lunes: así empiezo la semana, revisando casos con mi café.", "interaccion": "ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: café y agenda. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Lunes: así empiezo la semana, revisando casos con mi café.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Cercanía / detrás de cámaras · abrir con una pregunta para votar", "formato": "Selfie hablando", "contenido": "Esta semana hablamos de algo que casi nadie piensa: qué pasa si no te mueres pero no puedes decidir.", "interaccion": "Encuesta: ¿Lo habías pensado? Sí / Nunca", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Esta semana hablamos de algo que casi nadie piensa: qué pasa si no te mueres pero no puedes decidir.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Agrega el sticker Encuesta. Pregunta del sticker: «¿Lo habías pensado?». Opciones: Sí / Nunca.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda sostiene una pluma sobre una hoja en blanco y la deja caer. Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para arriba). Micrófono de solapa. Graba en 1080p a 30 cuadros. Cada frase es una toma: si se traba, repite solo esa frase. Alterna el encuadre: una toma en plano medio y la siguiente un poco más cerca (del pecho para arriba).", "Toma 1 (0 a 10 s): Esmeralda dice mirando a cámara: «Si mañana tienes un accidente y no puedes hablar, tu esposo no puede firmar por ti. Ni en el banco, ni para vender tu carro.». Acción: Esmeralda sostiene una pluma sobre una hoja en blanco y la deja caer. Grábala 3 veces y quédate con la más natural.", "Toma 2 (10 a 20 s): «La gente piensa en esto solo cuando alguien muere. Pero hay algo más común: un accidente, un derrame, quedarte un tiempo sin poder decidir.»", "Toma 3 (20 a 2  (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Lunes"}, {"fecha": "2026-12-08", "cuenta": "LT", "semana": 2, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Lo que tu familia no puede hacer", "tipo_gancho": "Negar", "gancho_texto": "En el hospital, tu familia NO puede hacer esto", "gancho_hablado": "Si estás en el hospital sin poder hablar, tu familia no puede hacer estas cosas por ti.", "visual": "Slide 1: pasillo de hospital desenfocado, texto blanco grande.", "desarrollo": ["Si estás en el hospital sin poder hablar, tu familia NO puede…", "Sacar dinero de tu cuenta para pagar tus cuentas.", "Vender o refinanciar tu casa si hace falta dinero.", "Firmar por tu negocio: cheques, contratos, pagos a tus trabajadores.", "Hablar con tu banco o tu aseguranza en tu nombre.", "Lo que hace falta: un poder firmado antes, mientras puedes decidir.", "Sin ese papel, tu familia tiene que pedirle permiso a un juez. Y eso toma meses.", "Comenta PAPELES y te mando la lista."], "cta": "Comenta PAPELES", "caption": "Tu familia te quiere ayudar. Pero sin un papel firmado, el banco no la deja.\n¿Cuántas de estas te tocarían?\nComenta PAPELES y te mando la lista.", "calculadora": null, "notas": "Contenido educativo; Esmeralda no da asesoría legal. [VALIDAR] cada slide depende del estado, del tipo de cuenta y de si hay cuentas conjuntas.", "historias": [{"proposito": "Problema común · abrir con una pregunta para votar", "formato": "Encuesta sobre foto de hospital", "contenido": "Si quedas en el hospital, ¿tu pareja puede sacar dinero de TU cuenta?", "interaccion": "Encuesta: Sí / No / No sé", "pasos": ["Toma una foto vertical con luz natural de: hospital.", "Escribe arriba, máximo 3 líneas, letras negras sobre una a y el dinero, que puede ser otra persona. Y fírmalo.", "Esa casa la pagaste tú sola. Que se quede para ellos como tú lo planeaste.", "Comenta CASA y te mando la mini clase de 6 minutos."], "cta": "Comenta CASA y te mando la mini clase de 6 minutos.", "caption": "Mamá sola, una casa y dos niños.\nSi mañana faltas, ¿quién maneja la casa hasta que crezcan?\nComenta CASA y te mando la mini clase.", "calculadora": 15, "notas": "Contenido educativo; Esmeralda no da asesoría legal. Caso hipotético (Diagnóstico express). [VALIDAR] administración de bienes de menores según estado. [VALIDAR] si el juez pide reportes y permisos al administrador de bienes de menores en el estado.", "historias": [{"proposito": "Romper una duda: «Eso no es para mí» · contar la idea del día", "formato": "Selfie hablando", "contenido": "'Eso es para gente con dinero.' Lo escucho cada semana.", "interaccion": "ninguna", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «'Eso es para gente con dinero.' Lo escucho cada semana.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Romper una duda: «Eso no es para mí» · dar la respuesta", "formato": "Foto con texto", "contenido": "27% de quienes no tienen nada dice que no tiene suficientes bienes (según una encuesta nacional de 2026). Y si tienes una sola casa, es justo lo que más te dolería perder en una corte.", "interaccion": "Encuesta: ¿Pensabas que era solo para ricos? Sí / No", "pasos": ["Toma una foto vertical con luz natural de: Esmeralda en su escritorio, mirando a la cámara.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «27% de quienes no tienen nada dice que no tiene suficientes bienes (según una encuesta nacional de 2026). Y si tienes una sola casa  que primero localice a los papás. Y tú estás en otro estado o en otro país.", "Antes de salir, deja tres cosas: una carta firmada que diga que ella puede llevarlos al doctor mientras no estás, copia de sus tarjetas del seguro médico y los teléfonos de sus doctores.", "Y ya que estás en eso, piensa en la pregunta grande: si un día no regresas, ¿quién los cuida?", "Esa carta sirve para el viaje. Para lo otro hace falta otro papel.", "Comenta PAPELES y te mando la lista de lo que tu familia necesita tener a la mano."], "cta": "Comenta PAPELES y te mando la lista de lo que tu familia necesita tener a la mano.", "caption": "A la abuela le dejamos dinero, la lista del súper y el número del pediatra.\nY casi nunca un papel firmado para que pueda llevarlos al doctor.\nComenta PAPELES y te mando la lista.", "calculadora": 14, "notas": "Contenido educativo; Esmeralda no da asesoría legal. Arranque del lanzamiento de la campaña «Organización patrimonial de Año Nuevo» (18–31 dic). La Navidad entra natural por los viajes de fin de año. [VALIDAR] carta de autorización médica para menores (si necesita notario, si sirve fuera de EE. UU.) y qué pasa en urgencias sin ella. Sin urgencias artificiales.", "historias": [{"proposito": "Regalo gratis a cambio de una palabra clave · abrir con una pregunta para votar", "formato": "POV de una maleta abierta", "contenido": "¿Vas a viajar estas fiestas?", "interaccion": "Encuesta: Sí, con los niños / Sí, los dejo encargados / No viajo", "pasos": ["Graba de 5 a 8 segundos en vertical de: una maleta abierta. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «¿Vas a viajar estas fiestas?»", "Agrega el sticker Encuesta. Opciones: Sí, con los niños / Sí, los dejo encargados / No viajo.", "Publícala a las 10:00 a. m."]}, {"proposito": "Regalo gratis a cambio de una palabra clave · pedir la palabra clave PAPELES", "formato": "Selfie hablando", "contenido oria», y pon el texto encima del post.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 8 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): cajón lleno de papeles desordenados. Texto grande: «Lo que vemos cuando la familia llega tarde». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: «Nadie sabe dónde están las escrituras.»", "Slide 3: «La casa estaba solo a nombre de quien faltó.»", "Slide 4: «Nadie tenía permiso para mover las cuentas.»", "Slide 5: «Los hijos eran menores y no había nada escrito sobre quién los cuidaba.»", "Slide 6: «Para hoy: abre el cajón donde crees que están tus escrituras. Si tardas más de 10 minutos en encontrarlas, ya sabes por dónde empezar.»", "Slide 7: «Casi todo eso se puede evitar mientras estás bien.»", "Slide 8 (cierre): «Comenta PAPELES y te mando la lista.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba PAPELES, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Gracias por escribir. Aquí tienes la l a ley a las mascotas y si en el estado se puede dejar dinero para su cuidado. Si no hay perro disponible, usar la mascota de alguien del equipo, con su permiso.", "historias": [{"proposito": "Romper una duda: «Es muy caro» · contar la idea del día", "formato": "Selfie hablando", "contenido": "'No tengo dinero para eso ahorita.'", "interaccion": "ninguna", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «'No tengo dinero para eso ahorita.'»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Romper una duda: «Es muy caro» · dar la respuesta", "formato": "Foto con texto", "contenido": "Empieza por lo que no cuesta: haz tu lista, habla con tu familia y revisa tus beneficiarios. Eso lo puedes hacer esta semana sin gastar.", "interaccion": "Encuesta: ¿Ya empezaste por lo gratis? Sí / Todavía no", "pasos": ["Toma una foto vertical con luz natural de: Esmeralda en su escritorio, mirando a la cámara.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Empieza por lo que no cuesta: haz tu lista, habla con tu familia y revisa tus beneficiarios. Eso lo puedes hacer esta semana sin gastar.»", "Agrega el sticker Encuesta. Pregunta del sticker: «¿Ya empezaste por lo gratis?». Opciones: Sí / Todavía no.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda acaricia a un perro y le muestra a la cámara la placa de su collar. Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para ensando en lo demás: la casa, los niños, quién decide por ti.». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 62 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «Si faltas mañana, ¿quién se queda con tu perro?».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Miércoles"}, {"fecha": "2026-12-31", "cuenta": "LT", "semana": 5, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Feliz Año Nuevo", "tipo_gancho": "Saludo festivo", "gancho_texto": "Feliz 2027: que tu familia duerma tranquila", "gancho_hablado": "Feliz Año Nuevo. Que en 2027 tu familia duerma tranquila.", "visual": "Foto de Esmeralda con luces de fondo, texto corto.", "desarrollo": ["Titular: Feliz 2027.", "Línea 2: Que este año tu familia duerma tranquila.", "Firma: Esmeralda Espinoza"], "cta": "Sin CTA.", "caption": "Gracias por acompañarme este año.\nQue en 2027 tu familia duerma tranquila.\nFeliz Año Nuevo.", "calculadora": null, "notas": "Imagen festiva sin venta.", "historias": [{"proposito": "Cercanía (festivo)", "formato": "Foto lifestyle", "contenido": "Último día del año.", "interaccion": "ninguna", "pasos": ["Toma una foto vertical con luz natural de: Es
