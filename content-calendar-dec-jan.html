 mis papeles.", "Publícala a las 10:00 a. m."]}, {"proposito": "Cercanía (festivo) · mensaje útil corto", "formato": "Foto con texto (carpeta y café)", "contenido": "Si organizar tus papeles está en tu lista, empieza por una hoja: lo que tienes y a nombre de quién está.", "interaccion": "ninguna", "pasos": ["Toma una foto vertical con luz natural de: carpeta y café.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Si organizar tus papeles está en tu lista, empieza por una hoja: lo que tienes y a nombre de quién está.»", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: imagen vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed o la foto indicada abajo. Títulos en negro con letra gruesa; textos pequeños en gris #686664; el número o la palabra más importante en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "Foto o fondo: Foto cálida de Esmeralda con una carpeta en la mesa del comedor, luces de Año Nuevo desenfocadas al fondo. Texto grande arriba, dato abajo.", "Texto principal (grande, ocupa la mitad de arriba): «Este año, que tu familia no tenga que adivinar»", "Debajo, a la mitad del tamaño y en este orden: «Feliz 2027.» / «4 de cada 10 personas no sabrían qué hacer si hoy muriera alguien de su familia (según una encuesta nacional de 2026).» / «Este año, deja tus papeles en orden. Es el regalo que tu familia sí va a usar.»", "Publicación: 1:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba PAPELES, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Gracias por escribir. Aquí tienes la lista de lo que tu familia va a necesitar si un día te pasa algo: [enlace a la lista]. Llénala con calma y, si te sale una duda, me escribes por aquí.». Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Viernes"}, {"fecha": "2027-01-02", "cuenta": "LT", "semana": 5, "formato": "Reel", "objetivo": "Viral", "tema": "El propósito que nadie pone en su lista", "tipo_gancho": "Contracorriente", "gancho_texto": "El propósito que nadie pone en su lista", "gancho_hablado": "Todos ponemos bajar de peso y ahorrar. Casi nadie pone este, y es el que más le importa a tu familia.", "visual": "Esmeralda con una libreta de propósitos: tacha «bajar de peso», tacha «ahorrar» y escribe con plumón rojo «dejar mis papeles en orden».", "desarrollo": ["En mis clases escucho lo mismo cada enero: yo estoy sano, no me voy a morir, eso lo veo después.", "Y cuando pasa algo, ahí sí andamos corriendo buscando abogado. Ya no son mil o dos mil dólares. Es mucho más, y con prisa.", "Por eso este año te pido que lo pongas en tu lista. Y que empieces con tres cosas.", "Uno: escribe en una hoja lo que tienes a tu nombre. Casa, carro, cuentas, negocio.", "Dos: al lado, escribe a quién quieres que le quede cada cosa.", "Tres: pregúntate si eso está en un papel firmado o solo en tu cabeza.", "Si solo está en tu cabeza, tu familia no lo puede usar. Nadie en un banco le va a creer a un «mi mamá siempre dijo».", "Guarda este video y ponlo en tu lista de este año."], "cta": "Guarda este video y ponlo en tu lista de este año.", "caption": "Bajar de peso, ahorrar, viajar… y este nunca aparece.\nHaz la prueba de las tres preguntas del video. Si la tercera te incomodó, ya sabes por dónde empezar 2027.\nGuárdalo para cuando hagas tu lista.", "calculadora": 15, "notas": "Opcional: abrir con el fragmento de la clase donde Esmeralda dice «yo estoy saludable, yo no me voy a morir» y quitar la palabra fuerte que viene después. Si el equipo no tiene ese video a la mano, graba todo nuevo como está abajo. [VALIDAR] los montos de mil o dos mil dólares son de ejemplo: no prometer un ahorro concreto. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Prueba social / caso · medir la reacción", "formato": "B-roll con texto (manos escribiendo en una libreta)", "contenido": "El enero pasado una señora me dijo «este año sí». En marzo ya tenía sus papeles firmados. [caso real a confirmar]", "interaccion": "Slider de emoji 🙌", "pasos": ["Graba de 5 a 8 segundos en vertical de: manos escribiendo en una libreta. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «El enero pasado una señora me dijo «este año sí». En marzo ya tenía sus papeles firmados.»", "No se publica hasta que Esmeralda confirme que es un caso real y que hay permiso. [caso real a confirmar]", "Agrega el sticker deslizador con el emoji 🙌.", "Publícala a las 10:00 a. m."]}, {"proposito": "Prueba social / caso · abrir con una pregunta para votar", "formato": "Selfie hablando", "contenido": "Empezó con la hoja de las tres preguntas del video. Lo demás fue saliendo. ¿Tú ya lo pusiste en tu lista?", "interaccion": "Encuesta: Sí / Todavía no", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Empezó con la hoja de las tres preguntas del video. Lo demás fue saliendo. ¿Tú ya lo pusiste en tu lista?»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Agrega el sticker Encuesta. Opciones: Sí / Todavía no.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda con una libreta de propósitos: tacha «bajar de peso», tacha «ahorrar» y escribe con plumón rojo «dejar mis papeles en orden». Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para arriba). Micrófono de solapa. Graba en 1080p a 30 cuadros. Cada frase es una toma: si se traba, repite solo esa frase. Alterna el encuadre: una toma en plano medio y la siguiente un poco más cerca (del pecho para arriba).", "Toma 1 (0 a 8 s): Esmeralda dice mirando a cámara: «Todos ponemos bajar de peso y ahorrar. Casi nadie pone este, y es el que más le importa a tu familia.». Acción: Esmeralda con una libreta de propósitos: tacha «bajar de peso», tacha «ahorrar» y escribe con plumón rojo «dejar mis papeles en orden». Grábala 3 veces y quédate con la más natural.", "Toma 2 (8 a 16 s): «En mis clases escucho lo mismo cada enero: yo estoy sano, no me voy a morir, eso lo veo después.»", "Toma 3 (16 a 26 s): «Y cuando pasa algo, ahí sí andamos corriendo buscando abogado. Ya no son mil o dos mil dólares. Es mucho más, y con prisa.»", "Toma 4 (26 a 33 s): «Por eso este año te pido que lo pongas en tu lista. Y que empieces con tres cosas.»", "Toma 5 (33 a 39 s): «Uno: escribe en una hoja lo que tienes a tu nombre. Casa, carro, cuentas, negocio.»", "Toma 6 (39 a 44 s): «Dos: al lado, escribe a quién quieres que le quede cada cosa.»", "Toma 7 (44 a 50 s): «Tres: pregúntate si eso está en un papel firmado o solo en tu cabeza.»", "Toma 8 (50 a 60 s): «Si solo está en tu cabeza, tu familia no lo puede usar. Nadie en un banco le va a creer a un «mi mamá siempre dijo».»", "Toma 9 (60 a 64 s): «Guarda este video y ponlo en tu lista de este año.»", "Texto en pantalla 1 (segundo 0 a 3): «El propósito que nadie pone en su lista», máximo 2 líneas, arriba, sin tapar la cara, letras negras sobre una caja crema #f4f2ed, letra gruesa grande.", "Texto en pantalla 2 (últimos 3 s): «Guarda este video y ponlo en tu lista de este año».", "Edición: corta silencios y respiraciones; sin intro ni logo al inicio. Subtítulos palabra por palabra en todo el video, letra blanca con borde negro, en la parte baja central. Zoom suave (al 110 %) en la frase «Si solo está en tu cabeza, tu familia no lo puede usar. Nadie en un banco le va a creer a un «mi mamá siempre dijo».». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 64 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «El propósito que nadie pone en su lista».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Sábado"}, {"fecha": "2027-01-03", "cuenta": "LT", "semana": 5, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Dónde guardas tus papeles", "tipo_gancho": "Pregunta inducida", "gancho_texto": "Tus papeles están guardados. ¿Alguien más los encuentra?", "gancho_hablado": "Tus papeles están guardados. ¿Pero alguien más los puede encontrar?", "visual": "Portada: caja de cartón abierta con sobres y llaves. Slides con fondo claro, un ícono por slide y texto grande.", "desarrollo": ["Tus papeles están guardados. ¿Pero alguien más los puede encontrar?", "En un cajón revuelto con recibos viejos: tu familia no sabe cuál es el importante.", "En una caja fuerte que solo tú sabes abrir.", "En la caja de seguridad del banco: en algunos estados la familia necesita permiso para abrirla.", "En tu correo o en tu celular, con una contraseña que nadie sabe.", "Lo que sí funciona: una sola carpeta, con una hoja al frente que diga qué hay adentro. Y dos personas de confianza que sepan dónde está.", "Si nadie sabe dónde buscar, es como si no los tuvieras.", "Comenta PAPELES y te mando la lista de lo que va en esa carpeta."], "cta": "Comenta PAPELES y te mando la lista de lo que va en esa carpeta", "caption": "Casi todos guardamos los papeles. El problema es que solo nosotros sabemos dónde.\n¿Tu familia los encontraría hoy sin llamarte?\nComenta PAPELES y te mando la lista de lo que va en la carpeta.", "calculadora": null, "notas": "Carrusel para guardar al arrancar enero. Requiere el PDF de PAPELES listo. [VALIDAR] slide 4: reglas para abrir la caja de seguridad del banco después de un fallecimiento según el estado. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Invitación a agendar: pregunta", "formato": "Encuesta sobre foto de una carpeta cerrada", "contenido": "Si hoy tu familia necesita las escrituras de la casa, ¿sabe dónde están?", "interaccion": "Encuesta: Sí / No / Ni yo sé", "pasos": ["Toma una foto vertical con luz natural de: una carpeta cerrada.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Si hoy tu familia necesita las escrituras de la casa, ¿sabe dónde están?»", "Agrega el sticker Encuesta. Opciones: Sí / No / Ni yo sé.", "Publícala a las 10:00 a. m."]}, {"proposito": "Invitación a agendar: llamada", "formato": "Selfie hablando", "contenido": "En enero estoy revisando los papeles de varias familias. Responde CITA y vemos juntos qué le falta a la tuya. [si se aprueba el descuento: 5% en enero]", "interaccion": "Palabra clave CITA por DM", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «En enero estoy revisando los papeles de varias familias. Responde CITA y vemos juntos qué le falta a la tuya.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "[si se aprueba el descuento] Solo si el descuento ya está aprobado, agrega una línea pequeña abajo: «5% en enero». Si no está aprobado, no lo menciones.", "Escribe abajo, en grande y en verde #7b8e46: «Responde CITA». A quien responda, contéstale el mismo día por DM con este mensaje: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.»", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 8 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): caja de cartón abierta con sobres y llaves. Slides con fondo claro, un ícono por slide y texto grande. Texto grande: «Tus papeles están guardados. ¿Alguien más los encuentra?». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: «En un cajón revuelto con recibos viejos: tu familia no sabe cuál es el importante.»", "Slide 3: «En una caja fuerte que solo tú sabes abrir.»", "Slide 4: «En la caja de seguridad del banco: en algunos estados la familia necesita permiso para abrirla.»", "Slide 5: «En tu correo o en tu celular, con una contraseña que nadie sabe.»", "Slide 6: «Lo que sí funciona: una sola carpeta, con una hoja al frente que diga qué hay adentro. Y dos personas de confianza que sepan dónde está.»", "Slide 7: «Si nadie sabe dónde buscar, es como si no los tuvieras.»", "Slide 8 (cierre): «Comenta PAPELES y te mando la lista de lo que va en esa carpeta.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba PAPELES, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Gracias por escribir. Aquí tienes la lista de lo que tu familia va a necesitar si un día te pasa algo: [enlace a la lista]. Llénala con calma y, si te sale una duda, me escribes por aquí.». Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Domingo"}, {"fecha": "2027-01-04", "cuenta": "LT", "semana": 6, "formato": "Reel", "objetivo": "Venta", "tema": "Diagnóstico express: papeles de una familia", "tipo_gancho": "Resultados", "gancho_texto": "Le revisé sus papeles en 10 minutos", "gancho_hablado": "Esta familia creía que tenía todo en orden. En diez minutos encontramos tres cosas que le iban a complicar la vida a su familia.", "visual": "Esmeralda en su escritorio con tres hojas; levanta una por cada problema y la pone sobre la mesa con un golpe seco.", "desarrollo": ["Casados, dos hijos y un seguro de vida del trabajo. Ellos estaban tranquilos.", "Primero: la cuenta donde guardaban los ahorros de la familia estaba solo a nombre de él, sin nadie como beneficiario. Si él falta, ella no la puede tocar sin trámites.", "Segundo: el seguro del trabajo seguía con la mamá de él como beneficiaria. Lo llenó hace doce años y nunca lo cambió.", "Tercero: nadie había escrito quién cuida a los niños si les pasa algo a los dos.", "Dinero tenían. Lo que no tenían era nada firmado.", "Lo primero que les tocaba: pedir en el banco y en el trabajo los formularios de beneficiario y llenarlos esa misma semana.", "Esto es un diagnóstico express. Comenta CITA y hacemos el tuyo."], "cta": "Comenta CITA y hacemos tu diagnóstico express", "caption": "Casados, con seguro de vida y las cuentas al día.\nY aun así tres huecos que le iban a complicar la vida a su familia.\n¿Te reconociste en alguno? Comenta CITA y hacemos tu diagnóstico express.", "calculadora": 16, "notas": "[caso real a confirmar]: grabar con un caso real, sin nombres y con permiso. [VALIDAR] qué pasa con una cuenta sin beneficiario y con un seguro con beneficiario viejo según el estado. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Cercanía / detrás de cámaras · contar la idea del día", "formato": "Video b-roll (escritorio, café, carpetas)", "contenido": "Primer lunes del año. Así empieza mi semana: revisando papeles de familias.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: escritorio, café, carpetas. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Primer lunes del año. Así empieza mi semana: revisando papeles de familias.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Cercanía / detrás de cámaras · abrir con una pregunta para votar", "formato": "Encuesta sobre foto", "contenido": "¿Ya revisaste tus papeles este año?", "interaccion": "Encuesta: Sí / Todavía no", "pasos": ["Toma una foto vertical con luz natural de: Esmeralda en su escritorio, mirando a la cámara.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «¿Ya revisaste tus papeles este año?»", "Agrega el sticker Encuesta. Opciones: Sí / Todavía no.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda en su escritorio con tres hojas; levanta una por cada problema y la pone sobre la mesa con un golpe seco. Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para arriba). Micrófono de solapa. Graba en 1080p a 30 cuadros. Cada frase es una toma: si se traba, repite solo esa frase. Alterna el encuadre: una toma en plano medio y la siguiente un poco más cerca (del pecho para arriba).", "Toma 1 (0 a 9 s): Esmeralda dice mirando a cámara: «Esta familia creía que tenía todo en orden. En diez minutos encontramos tres cosas que le iban a complicar la vida a su familia.». Acción: Esmeralda en su escritorio con tres hojas; levanta una por cada problema y la pone sobre la mesa con un golpe seco. Grábala 3 veces y quédate con la más natural.", "Toma 2 (9 a 14 s): «Casados, dos hijos y un seguro de vida del trabajo. Ellos estaban tranquilos.»", "Toma 3 (14 a 26 s): «Primero: la cuenta donde guardaban los ahorros de la familia estaba solo a nombre de él, sin nadie como beneficiario. Si él falta, ella no la puede tocar sin trámites.»", "Toma 4 (26 a 35 s): «Segundo: el seguro del trabajo seguía con la mamá de él como beneficiaria. Lo llenó hace doce años y nunca lo cambió.»", "Toma 5 (35 a 41 s): «Tercero: nadie había escrito quién cuida a los niños si les pasa algo a los dos.»", "Toma 6 (41 a 45 s): «Dinero tenían. Lo que no tenían era nada firmado.»", "Toma 7 (45 a 54 s): «Lo primero que les tocaba: pedir en el banco y en el trabajo los formularios de beneficiario y llenarlos esa misma semana.»", "Toma 8 (54 a 58 s): «Esto es un diagnóstico express. Comenta CITA y hacemos el tuyo.»", "Texto en pantalla 1 (segundo 0 a 3): «Le revisé sus papeles en 10 minutos», máximo 2 líneas, arriba, sin tapar la cara, letras negras sobre una caja crema #f4f2ed, letra gruesa grande.", "Texto en pantalla 2 (últimos 3 s): «Comenta CITA y hacemos tu diagnóstico express». La palabra CITA en verde #7b8e46.", "Edición: corta silencios y respiraciones; sin intro ni logo al inicio. Subtítulos palabra por palabra en todo el video, letra blanca con borde negro, en la parte baja central. Zoom suave (al 110 %) en la frase «Esto es un diagnóstico express. Comenta CITA y hacemos el tuyo.». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 58 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «Le revisé sus papeles en 10 minutos».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Lunes"}, {"fecha": "2027-01-05", "cuenta": "LT", "semana": 6, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Organiza los papeles de tu familia en una tarde", "tipo_gancho": "Accionador", "gancho_texto": "Una tarde de enero le ahorra meses a tu familia", "gancho_hablado": "Una tarde de enero puede ahorrarle meses a tu familia", "visual": "Portada: reloj de mesa y una caja de papeles. Cada slide con número grande del paso.", "desarrollo": ["Una tarde de enero puede ahorrarle meses a tu familia. Así se hace.", "Paso 1: junta todo en una caja. Escrituras, títulos de carro, pólizas de seguro, estados de cuenta.", "Paso 2: haz una lista de lo que tienes, a nombre de quién está y quién aparece como beneficiario en tus seguros y cuentas de retiro.", "Paso 3: anota quién puede decidir por ti si un día no puedes hablar ni firmar.", "Si en el paso 3 te quedaste en blanco, no pasa nada. Ese es justo el papel que te falta.", "Comenta PAPELES y te mando la lista para tu caja."], "cta": "Comenta PAPELES y te mando la lista para tu caja", "caption": "Una tarde y una caja de cartón. Con eso empiezas.\nSi el paso 3 te dejó pensando, comenta PAPELES y te mando la lista.", "calculadora": null, "notas": "Contenido educativo y administrativo. Sin datos personales en la foto de la caja. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Problema común · abrir con una pregunta para votar", "formato": "Encuesta sobre foto de cajón desordenado", "contenido": "Si mañana te pasa algo, ¿tu familia sabe dónde están tus papeles?", "interaccion": "Encuesta: Sí / Ni idea", "pasos": ["Toma una foto vertical con luz natural de: cajón desordenado.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Si mañana te pasa algo, ¿tu familia sabe dónde están tus papeles?»", "Agrega el sticker Encuesta. Opciones: Sí / Ni idea.", "Publícala a las 10:00 a. m."]}, {"proposito": "Problema común · contar la idea del día", "formato": "B-roll con texto", "contenido": "Haz la prueba hoy: ¿cuánto tardaría tu familia en encontrar tus escrituras sin llamarte?", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: las manos de Esmeralda acomodando papeles en su escritorio. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Haz la prueba hoy: ¿cuánto tardaría tu familia en encontrar tus escrituras sin llamarte?»", "Sin sticker.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 6 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): reloj de mesa y una caja de papeles. Cada slide con número grande del paso. Texto grande: «Una tarde de enero le ahorra meses a tu familia». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: «Paso 1: junta todo en una caja. Escrituras, títulos de carro, pólizas de seguro, estados de cuenta.»", "Slide 3: «Paso 2: haz una lista de lo que tienes, a nombre de quién está y quién aparece como beneficiario en tus seguros y cuentas de retiro.»", "Slide 4: «Paso 3: anota quién puede decidir por ti si un día no puedes hablar ni firmar.»", "Slide 5: «Si en el paso 3 te quedaste en blanco, no pasa nada. Ese es justo el papel que te falta.»", "Slide 6 (cierre): «Comenta PAPELES y te mando la lista para tu caja.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 5: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba PAPELES, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Gracias por escribir. Aquí tienes la lista de lo que tu familia va a necesitar si un día te pasa algo: [enlace a la lista]. Llénala con calma y, si te sale una duda, me escribes por aquí.». Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Martes"}, {"fecha": "2027-01-06", "cuenta": "LT", "semana": 6, "formato": "Reel", "objetivo": "Seguidores", "tema": "Día de Reyes: ¿a quién le toca la casa?", "tipo_gancho": "Visual", "gancho_texto": "¿A quién le toca tu casa si tú faltas?", "gancho_hablado": "En la rosca está clarito: al que le sale el niño, le tocan los tamales. Pero si mañana tú faltas, ¿a quién le toca tu casa?", "visual": "Esmeralda corta la rosca de Reyes, saca el muñequito y lo pone sobre una carpeta de papeles.", "desarrollo": ["Si no lo dejaste por escrito, no lo decides tú. Lo decide la ley de tu estado.", "Y muchas veces la casa termina repartida en pedazos: una parte para tu pareja y otra para cada hijo, aunque sean menores.", "Para venderla o refinanciarla van a necesitar la firma de todos. Y si un hijo es menor, el permiso de un juez.", "Así empiezan muchos pleitos entre hermanos. Por una casa que tú querías dejarles a todos juntos.", "Hoy, mientras comen rosca, platica con tu pareja dos cosas: a quién quieren que le quede la casa y quién la manejaría mientras los hijos crecen.", "Escríbanlo. Luego busquen que quede en un documento válido en su estado.", "Hoy, con la rosca en la mesa, es buen momento.", "Sígueme: la próxima semana te cuento cuánto le cuesta a una familia no dejar nada firmado."], "cta": "Sígueme: la próxima semana te cuento cuánto le cuesta a una familia no dejar nada firmado", "caption": "Feliz Día de Reyes. Al que le salga el niño, le tocan los tamales. Eso ya lo sabemos todos.\nLo de la casa casi nadie lo habla en la mesa. Hoy es buen día.\nSígueme: la próxima semana, lo que cuesta no dejar nada firmado.", "calculadora": 16, "notas": "Día de Reyes (6 de enero): la rosca entra natural. [VALIDAR] por estado cómo se reparte la casa cuando no hay documento (pareja e hijos) y qué se necesita para venderla si hay hijos menores. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Romper una duda: «Después lo hago» · contar la idea del día", "formato": "Selfie hablando", "contenido": "Confieso algo: yo también dejaba esto para después. Con el negocio siempre había algo más urgente.", "interaccion": "Ninguna", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Confieso algo: yo también dejaba esto para después. Con el negocio siempre había algo más urgente.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Solo si es cierto para Esmeralda. Si no, cambia el texto a: «Muchas me dicen: con el trabajo siempre hay algo más urgente.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Romper una duda: «Después lo hago» · dar la respuesta", "formato": "Foto con texto (rosca y carpeta)", "contenido": "El «después» casi siempre llega cuando ya no puedes firmar. ¿Qué tanto lo has dejado tú?", "interaccion": "Slider: ¿Qué tanto lo has dejado para después?", "pasos": ["Toma una foto vertical con luz natural de: rosca y carpeta.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «El «después» casi siempre llega cuando ya no puedes firmar. ¿Qué tanto lo has dejado tú?»", "Agrega el sticker deslizador con la pregunta «¿Qué tanto lo has dejado para después?».", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda corta la rosca de Reyes, saca el muñequito y lo pone sobre una carpeta de papeles. Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para arriba). Micrófono de solapa. Graba en 1080p a 30 cuadros. Cada frase es una toma: si se traba, repite solo esa frase. Alterna el encuadre: una toma en plano medio y la siguiente un poco más cerca (del pecho para arriba).", "Toma 1 (0 a 10 s): Esmeralda dice mirando a cámara: «En la rosca está clarito: al que le sale el niño, le tocan los tamales. Pero si mañana tú faltas, ¿a quién le toca tu casa?». Acción: Esmeralda corta la rosca de Reyes, saca el muñequito y lo pone sobre una carpeta de papeles. Grábala 3 veces y quédate con la más natural.", "Toma 2 (10 a 17 s): «Si no lo dejaste por escrito, no lo decides tú. Lo decide la ley de tu estado.»", "Toma 3 (17 a 26 s): «Y muchas veces la casa termina repartida en pedazos: una parte para tu pareja y otra para cada hijo, aunque sean menores.»", "Toma 4 (26 a 35 s): «Para venderla o refinanciarla van a necesitar la firma de todos. Y si un hijo es menor, el permiso de un juez.»", "Toma 5 (35 a 41 s): «Así empiezan muchos pleitos entre hermanos. Por una casa que tú querías dejarles a todos juntos.»", "Toma 6 (41 a 51 s): «Hoy, mientras comen rosca, platica con tu pareja dos cosas: a quién quieren que le quede la casa y quién la manejaría mientras los hijos crecen.»", "Toma 7 (51 a 56 s): «Escríbanlo. Luego busquen que quede en un documento válido en su estado.»", "Toma 8 (56 a 61 s): «Hoy, con la rosca en la mesa, es buen momento.»", "Toma 9 (61 a 67 s): «Sígueme: la próxima semana te cuento cuánto le cuesta a una familia no dejar nada firmado.»", "Texto en pantalla 1 (segundo 0 a 3): «¿A quién le toca tu casa si tú faltas?», máximo 2 líneas, arriba, sin tapar la cara, letras negras sobre una caja crema #f4f2ed, letra gruesa grande.", "Texto en pantalla 2 (últimos 3 s): «Sígueme: la próxima semana te cuento cuánto le cuesta a una familia no dejar nada firmado».", "Edición: corta silencios y respiraciones; sin intro ni logo al inicio. Subtítulos palabra por palabra en todo el video, letra blanca con borde negro, en la parte baja central. Zoom suave (al 110 %) en la frase «Hoy, con la rosca en la mesa, es buen momento.». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 67 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «¿A quién le toca tu casa si tú faltas?».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Miércoles"}, {"fecha": "2027-01-07", "cuenta": "LT", "semana": 6, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Cuentas digitales", "tipo_gancho": "Pregunta incómoda", "gancho_texto": "Tu correo y tu banco: ¿quién entra si no puedes?", "gancho_hablado": "48% no ha dejado instrucciones para sus cuentas digitales", "visual": "Celular bloqueado sobre una mesa con un candado dibujado. Cifra 48% en grande.", "desarrollo": ["48% no ha dejado ninguna instrucción para sus cuentas digitales (según una encuesta nacional de 2026).", "Tus fotos, tu correo, tus pagos automáticos.", "Si tú no puedes, ¿quién entra?"], "cta": "Guárdalo para hacer tu lista esta semana", "caption": "Hace 20 años todo estaba en un cajón. Hoy medio cajón está en tu teléfono.\nCasi la mitad de la gente no ha dejado instrucciones para sus cuentas digitales.\nGuárdalo para hacer tu lista esta semana.", "calculadora": null, "notas": "Prepara el reel del viernes 8. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Caja de preguntas / respuesta · juntar preguntas", "formato": "Caja de preguntas sobre selfie", "contenido": "Pregúntame lo que quieras sobre los papeles de tu familia. Respondo mañana en video.", "interaccion": "Caja de preguntas", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Pregúntame lo que quieras sobre los papeles de tu familia. Respondo mañana en video.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Agrega el sticker Preguntas con el texto «Pregúntame aquí». Al día siguiente responde 1 o 2 en video selfie, sin mostrar el nombre de quien preguntó.", "Publícala a las 10:00 a. m."]}, {"proposito": "Caja de preguntas / respuesta · responder una duda", "formato": "Selfie respondiendo", "contenido": "Me preguntaron: ¿le doy todas mis contraseñas a mi hija y ya? Mejor no las pongas en una hoja suelta. Haz la lista de tus cuentas y guarda las contraseñas aparte, en un lugar seguro.", "interaccion": "Ninguna", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Me preguntaron: ¿le doy todas mis contraseñas a mi hija y ya? Mejor no las pongas en una hoja suelta. Haz la lista de tus cuentas y guarda las contraseñas aparte, en un lugar seguro.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Sin sticker.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: imagen vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed o la foto indicada abajo. Títulos en negro con letra gruesa; textos pequeños en gris #686664; el número o la palabra más importante en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "Foto o fondo: Celular bloqueado sobre una mesa con un candado dibujado. Cifra 48% en grande.", "Texto principal (grande, ocupa la mitad de arriba): «Tu correo y tu banco: ¿quién entra si no puedes?»", "Debajo, a la mitad del tamaño y en este orden: «48% no ha dejado ninguna instrucción para sus cuentas digitales (según una encuesta nacional de 2026).» / «Tus fotos, tu correo, tus pagos automáticos.» / «Si tú no puedes, ¿quién entra?»", "Publicación: 1:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Jueves"}, {"fecha": "2027-01-08", "cuenta": "LT", "semana": 6, "formato": "Reel", "objetivo": "Venta", "tema": "Tu celular también es parte de tu herencia", "tipo_gancho": "Pregunta incómoda", "gancho_texto": "¿Quién sabe la contraseña de tu celular?", "gancho_hablado": "Si mañana te pasa algo, tu familia va a tener tu celular en la mano y no lo va a poder abrir.", "visual": "Esmeralda le da su celular bloqueado a alguien fuera de cuadro; en pantalla aparece «Código incorrecto».", "desarrollo": ["Ahí están tus fotos, tu banco, tus pagos automáticos y el correo donde llegan todos los recibos.", "Según una encuesta nacional de 2026, casi la mitad de la gente no ha dejado ninguna instrucción para sus cuentas digitales.", "Y esto también cuenta en vida: si pasas unas semanas en el hospital, los pagos automáticos siguen saliendo y nadie puede entrar a pararlos.", "Uno: haz una lista de tus cuentas importantes. No escribas las contraseñas en ese mismo papel.", "Dos: activa el contacto de legado en tu teléfono y en tus redes. Te toma cinco minutos.", "Tres: guarda esa lista con tus otros papeles importantes.", "Tu vida ya no está solo en un cajón. También está en tu teléfono.", "Comenta PAPELES y te mando la lista donde también viene esto."], "cta": "Comenta PAPELES y te mando la lista completa", "caption": "Tu familia puede tener tu teléfono en la mano y no poder entrar.\nTres pasos de cinco minutos en el video. Comenta PAPELES y te mando la lista completa para tu familia.", "calculadora": 15, "notas": "[VALIDAR] nombres actuales de las funciones de contacto de legado en iPhone, Android y Facebook. No recomendar escribir contraseñas en la misma hoja. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Regalo gratis a cambio de una palabra clave · abrir con una pregunta pa entana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Mensajes como este son la razón por la que hago esto cada semana.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Agrega el sticker deslizador con el emoji ❤️.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 8 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): foto de una casa con letrero de «For Sale» tachado. Slides tipo historia con una frase por slide. Texto grande: «Su papá dejó la casa pagada. No podían venderla». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: «Tres hermanos. La casa de su papá en [ciudad: caso real a confirmar]. Él siempre les dijo: la casa es para ustedes.»", "Slide 3: «Lo que se dice no es lo que se firma. Les pidieron papeles que nunca existieron.»", "Slide 4: «Pasaron [tiempo: caso real a confirmar] entre corte, abogados y gastos. Con la casa vacía.»", "Slide 5: «La hermana mayor dijo «a mis hijos no les va a pasar esto» y organizó sus propios papeles.»", "Slide 6: «Hoy su familia sabe qué tiene, a nombre de quién está y quién decide.»", "Slide 7: «Si en tu familia también se dijo «la casa es para ustedes», pregunta hoy: ¿eso está firmado en algún lado?»", "Slide 8 (cierre): «Que tu familia no tenga que ir a la corte para quedarse con lo que construiste. Comenta CITA.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Sábado"}, {"fecha": "2027-01-10", "cuenta": "LT", "semana": 6, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Frase de Esmeralda: lo que nunca se firmó", "tipo_gancho": "Frase célebre", "gancho_texto": "Si nunca lo firmaste, para el juez no existe", "gancho_hablado": "«La casa es para ustedes». Puedes decirlo en cada cena. Si nunca lo firmaste, para el juez no existe.", "visual": "Foto de Esmeralda en sus clases, frase con su firma.", "desarrollo": ["«La casa es para ustedes». Puedes decirlo en cada cena.", "Esmeralda Espinoza"], "cta": "Compártelo con quien lo ha dicho en tu familia", "caption": "«La casa es para ustedes». Lo escucho en casi todas las familias.\nY casi nunca está firmado.\nCompártelo con quien lo ha dicho en tu familia.", "calculadora": null, "notas": "Frase nueva para Esmeralda: que confirme que la quiere firmar con su nombre. [VALIDAR] que el mensaje legal sea correcto en su estado. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Invitación a agendar: caso", "formato": "B-roll con texto (caja de papeles)", "contenido": "Esta semana: una familia que creía tener todo en orden y tenía tres huecos. Lo vimos en 10 minutos.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: caja de papeles. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Esta semana: una familia que creía tener todo en orden y tenía tres huecos. Lo vimos en 10 minutos.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Invitación a agendar: llamada", "formato": "Selfie hablando", "contenido": "Si quieres saber qué le falta a la tuya, responde CITA y te escribo. [si se aprueba el descuento: 5% en enero]", "interaccion": "Palabra clave CITA por DM", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Si quieres saber qué le falta a la tuya, responde CITA y te escribo.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "[si se aprueba el descuento] Solo si el descuento ya está aprobado, agrega una línea pequeña abajo: «5% en enero». Si no está aprobado, no lo menciones.", "Escribe abajo, en grande y en verde #7b8e46: «Responde CITA». A quien responda, contéstale el mismo día por DM con este mensaje: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.»", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: imagen vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed o la foto indicada abajo. Títulos en negro e a la izquierda y «Después» en gris a la derecha. En los slides 2 a 6 va arriba la etiqueta HOY (verde) o DESPUÉS (gris).", "desarrollo": ["Hoy o después: alguien va a pagar. Mira la diferencia.", "Hoy: tú eliges quién decide, quién recibe y quién cuida a tus hijos.", "Después: si no hay papeles, en muchos casos lo decide la corte.", "Hoy: unas horas de tu tiempo y un costo que conoces antes de firmar.", "Después: meses de trámites, abogados y gastos que nadie tenía en el presupuesto.", "Hoy: tu familia sigue con su vida. Después: tu familia hace trámites mientras está de luto.", "Para esta semana: aparta una hora en tu calendario para hacer tu lista.", "¿Cuánto cuesta en tu caso? Comenta CITA y te explico qué incluye."], "cta": "Comenta CITA y te explico qué incluye en tu caso", "caption": "Hoy lo pagas tú, con calma. Después lo paga tu familia, con prisa.\nSi quieres saber cuánto sería en tu caso, comenta CITA.", "calculadora": null, "notas": "[VALIDAR] la frase «lo decide la corte» por estado. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Problema común · abrir con una pregunta para votar", "formato": "Encuesta sobre foto de casa", "contenido": "Si faltas sin dejar nada firmado, ¿quién decide sobre tu casa?", "interaccion": "Encuesta: Mi pareja / Mis hijos / Un juez", "pasos": ["Toma una foto vertical con luz natural de: casa.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Si faltas sin dejar nada firmado, ¿quién decide sobre tu casa?»", "Agrega el sticker Encuesta. Opciones: Mi pareja / Mis hijos / Un juez.", "Publícala a las 10:00 a. m."]}, {"proposito": "Problema común · contar la idea del día", "formato": "Texto sobre fondo de color", "contenido": "En muchos casos, el juez. Y tu familia espera mientras tanto.", "interaccion": "Ninguna", "pasos": ["Abre una historia nueva con fondo liso verde #7b8e46 (en el modo Crear, o con el pincel: mantén presionado sobre la pantalla)  cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Martes"}, {"fecha": "2027-01-13", "cuenta": "LT", "semana": 7, "formato": "Reel", "objetivo": "Venta", "tema": "Nos enseñaron que esto es un gasto", "tipo_gancho": "Enemigo común", "gancho_texto": "Nos enseñaron que esto es un gasto", "gancho_hablado": "En nuestra cultura nos enseñaron que los seguros y los papeles legales son un gasto. El gasto de verdad llega cuando algo pasa.", "visual": "Esmeralda abre una alcancía de cochinito y saca pocos billetes; los pone junto a una pila de facturas.", "desarrollo": ["Lo digo en mis clases: en nuestros países los seguros y los papeles no se valoraban, porque creíamos que no teníamos dinero.", "Y cuando pasa algo, sacamos el poquito ahorro que había para cubrir todo. O hacemos una colecta entre la familia.", "Te propongo hacer una cuenta, con lápiz y papel.", "Uno: suma cuánto tienes ahorrado. Ese es el dinero que tu familia usaría para pagar trámites si faltas.", "Dos: pregunta cuánto costaría dejar todo en orden hoy. Pregunta precios, no supongas.", "Tres: decide con esos dos números enfrente, no con miedo.", "A veces el número asusta menos de lo que pensabas. Y si asusta, por lo men nto cuesta. Pregunta qué incluye.", "visual": "Esmeralda cuenta con los dedos frente a la cámara; aparece cada pregunta en pantalla.", "desarrollo": ["Si solo comparas precios, puedes terminar pagando dos veces: una hoy, y otra cuando tu familia descubra que la casa no quedó incluida.", "Antes de pagar, haz tres preguntas.", "Pregunta uno: ¿qué documentos incluye? Un solo papel no hace lo mismo que varios pensados para tu familia.", "Pregunta dos: ¿quién me ayuda a pasar mi casa y mis cuentas a ese documento? Firmar no basta si tus cosas no quedan adentro.", "Pregunta tres: ¿qué pasa si me caso, me divorcio, tengo otro hijo o me cambio de estado?", "Con esas tres respuestas ya puedes comparar precios de verdad.", "Sígueme: la próxima semana te explico por qué un testamento solo no siempre evita la corte."], "cta": "Sígueme: la próxima semana te explico por qué un testamento solo no siempre evita la corte", "caption": "Tres preguntas que te ahorran pagar dos veces.\nSígueme: la próxima semana hablamos del testamento.", "calculadora": 15, "notas": "[VALIDAR] con abogado cómo se explica pasar los bienes al documento. No mencionar marcas de la competencia. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Regalo gratis a cambio de una palabra clave · abrir con una pregunta para votar", "formato": "B-roll con texto (libreta con 3 preguntas)", "contenido": "Antes de pagar por tus papeles, haz estas 3 preguntas. ¿Quieres saber qué pasa con tu casa si faltas?", "interaccion": "Encuesta: Sí, quiero saber / Ya lo sé", "pasos": ["Graba de 5 a 8 segundos en vertical de: libreta con 3 preguntas. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Antes de pagar por tus papeles, haz estas 3 preguntas. ¿Quieres saber qué pasa con tu casa si faltas?»", "Agrega el sticker Encuesta. Opciones: Sí, quiero saber / Ya lo sé.", "Publícala a las 10:00 a. m."]}, cho": "Frase célebre", "gancho_texto": "Lo que no pagas hoy, lo paga tu familia", "gancho_hablado": "Lo que no pagas tú hoy, lo paga tu familia después. Y sin que nadie le avise.", "visual": "Tipografía grande sobre foto de una mesa familiar vacía después de la cena.", "desarrollo": ["Y sin que nadie le avise.", "Esmeralda Espinoza"], "cta": "Compártelo con tu pareja", "caption": "Esta semana hablamos de lo que cuesta no tener papeles. Me quedo con esta frase.\nCompártela con tu pareja.", "calculadora": null, "notas": "Cierre de la semana. Frase de Esmeralda (la dice en el reel del lunes 11): que confirme la redacción. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Invitación a agendar: caso", "formato": "Foto con texto", "contenido": "Esta semana: la mamá que firmó todo pero su casa quedó afuera. Firmar es la mitad.", "interaccion": "Ninguna", "pasos": ["Toma una foto vertical con luz natural de: Esmeralda en su escritorio, mirando a la cámara.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Esta semana: la mamá que firmó todo pero su casa quedó afuera. Firmar es la mitad.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Invitación a agendar: llamada", "formato": "Selfie hablando", "contenido": "Si tus papeles tienen años, responde CITA y los revisamos juntos. [si se aprueba el descuento: 5% en enero]", "interaccion": "Palabra clave CITA por DM", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «Si tus papeles tienen años, responde CITA y los revisamos juntos.»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "[si se aprueba el descuento] Solo si el descuento ya está aprobado, agrega una línea pequeña abajo: «5% en enero». Si no está aprobado, no lo menciones.", "Escribe abajo, en grande y en verde #7b8e46: «Responde CITA». A quien responda, contéstale el mismo día por DM con este mensaje: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.»", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: imagen vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed o la foto indicada abajo. Títulos en negro con letra gruesa; textos pequeños en gris #686664; el número o la palabra más importante en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "Foto o fondo: Tipografía grande sobre foto de una mesa familiar vacía después de la cena.", "Texto principal (grande, ocupa la mitad de arriba): «Lo que no pagas hoy, lo paga tu familia»", "Debajo, a la mitad del tamaño y en este orden: «Y sin que nadie le avise.»", "Firma (pequeña, abajo a la derecha): «Esmeralda Espinoza»", "Publicación: 1:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Domingo"}, {"fecha": "2027-01-18", "cuenta": "LT", "semana": 8, "formato": "Reel", "objetivo": "Viral", "tema": "Ya tengo testamento", "tipo_gancho": "Contracorriente", "gancho_texto": "Tener testamento no siempre evita la corte", "gancho_hablado": "Mucha gente me dice: yo ya hice mi testamento, ya estoy tranquila. Y casi siempre se sorprenden con lo que les digo.", "visual": "Esmeralda sostiene un sobre que dice «Testamento» y lo pone sobre la puerta de un juzgado dibujada en una pizarra.", "desarrollo": ["Un testamento dice quién recibe qué. Pero en muchos estados, para que eso se cumpla, tu familia igual tiene que pasar por la corte. En inglés a ese proceso le dicen probate.", "Ese proceso puede tardar meses y cuesta dinero.", "Hay otro documento, el living trust o fideicomiso en vida: pones tus cosas a nombre de ese documento y dejas a alguien de confianza a cargo. En muchos casos tu familia recibe sin pasar por ese proceso.", "Si ya tienes testamento, revisa tres cosas: cuándo lo hiciste, si las personas que nombraste siguen siendo las correctas y si tu casa tendría que pasar por la corte en tu estado.", "Tener testamento ya es más de lo que ha hecho la mitad de la gente. Ahora falta saber qué hace ese papel en tu estado.", "Mándaselo a quien te dijo «yo ya tengo mi testamento»."], "cta": "Mándaselo a quien te dijo «yo ya tengo mi testamento»", "caption": "«Ya tengo mi testamento». Bien. ¿Sabes qué pasa con tu casa con ese papel en tu estado?\nMándaselo a quien te lo dijo esta semana.", "calculadora": 16, "notas": "[VALIDAR] por estado si un testamento pasa por la corte y los límites para patrimonios pequeños. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Cercanía / detrás de cámaras · contar la idea del día", "formato": "Video b-roll (llegando a la oficina)", "contenido": "Lunes de citas. Hoy tres familias me van a decir: yo ya tengo testamento.", "interaccion": "Ninguna", "pasos": ["Graba de 5 a 8 segundos en vertical de: llegando a la oficina. Sin posar; si es POV, solo se ven las manos.", "Escribe encima, en la parte de arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed: «Lunes de citas. Hoy tres familias me van a decir: yo ya tengo testamento.»", "Sin sticker.", "Publícala a las 10:00 a. m."]}, {"proposito": "Cercanía / detrás de cámaras · abrir con una pregunta para votar", "formato": "Encuesta sobre selfie", "contenido": "¿Tú tienes testamento?", "interaccion": "Encuesta: Sí / No / Creo que sí", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice, mirando a la cámara y con sus palabras: «¿Tú tienes testamento?»", "Activa el sticker de Subtítulos para que se lea sin sonido.", "Agrega el sticker Encuesta. Opciones: Sí / No / Creo que sí.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Prepara antes de grabar: Esmeralda sostiene un sobre que dice «Testamento» y lo pone sobre la puerta de un juzgado dibujada en una pizarra. Ten el guion impreso o en un teleprompter del celular.", "Lugar: oficina o sala con luz natural de frente (la ventana delante de Esmeralda, nunca detrás) y fondo ordenado. Ropa: blusa lisa en verde #7b8e46 o crema, sin estampados.", "Cámara: celular en vertical (9:16) sobre tripié, a la altura de los ojos, plano medio (de la cintura para arriba). Micrófono de solapa. Graba en 1080p a 30 cuadros. Cada frase es una toma: si se traba, repite solo esa frase. Alterna el encuadre: una toma en plano medio y la siguiente un poco más cerca (del pecho para arriba).", "Toma 1 (0 a 9 s): Esmeralda dice mirando a cámara: «Mucha gente me dice: yo ya hice mi testamento, ya estoy tranquila. Y casi siempre se sorprenden con lo que les digo.». Acción: Esmeralda sostiene un sobre que dice «Testamento» y lo pone sobre la puerta de un juzgado dibujada en una pizarra. Grábala 3 veces y quédate con la más natural.", "Toma 2 (9 a 22 s): «Un testamento dice quién recibe qué. Pero en muchos estados, para que eso se cumpla, tu familia igual tiene que pasar por la corte. En inglés a ese proceso le dicen probate.»", "Toma 3 (22 a 25 s): «Ese proceso puede tardar meses y cuesta dinero.»", "Toma 4 (25 a 40 s): «Hay otro documento, el living trust o fideicomiso en vida: pones tus cosas a nombre de ese documento y dejas a alguien de confianza a cargo. En muchos casos tu familia recibe sin pasar por ese proceso.»", "Toma 5 (40 a 53 s): «Si ya tienes testamento, revisa tres cosas: cuándo lo hiciste, si las personas que nombraste siguen siendo las correctas y si tu casa tendría que pasar por la corte en tu estado.»", "Toma 6 (53 a 63 s): «Tener testamento ya es más de lo que ha hecho la mitad de la gente. Ahora falta saber qué hace ese papel en tu estado.»", "Toma 7 (63 a 67 s): «Mándaselo a quien te dijo «yo ya tengo mi testamento».»", "Texto en pantalla 1 (segundo 0 a 3): «Tener testamento no siempre evita la corte», máximo 2 líneas, arriba, sin tapar la cara, letras negras sobre una caja crema #f4f2ed, letra gruesa grande.", "Texto en pantalla 2 (últimos 3 s): «Mándaselo a quien te dijo «yo ya tengo mi testamento»».", "Edición: corta silencios y respiraciones; sin intro ni logo al inicio. Subtítulos palabra por palabra en todo el video, letra blanca con borde negro, en la parte baja central. Zoom suave (al 110 %) en la frase «Tener testamento ya es más de lo que ha hecho la mitad de la gente. Ahora falta saber qué hace ese papel en tu estado.». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 67 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «Tener testamento no siempre evita la corte».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios (en menos de 2 horas): contesta cada uno con una frase corta y personal, distinta cada vez (por ejemplo: «Gracias por contarme, (nombre)»). Si alguien cuenta su caso o pregunta algo legal, contéstale «Escríbeme CITA por mensaje y lo vemos con calma» y avísale a Esmeralda; el equipo no responde temas legales.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Lunes"}, {"fecha": "2027-01-19", "cuenta": "LT", "semana": 8, "formato": "Carrusel", "objetivo": "Guardado", "tema": "Dos familias, la misma casa", "tipo_gancho": "Qué prefieres", "gancho_texto": "Dos familias, la misma casa. Una fue a la corte", "gancho_hablado": "Dos familias, la misma casa. Una fue a la corte.", "visual": "Dos casas iguales dibujadas, una con camino recto y otra con camino que pasa por un juzgado.", "desarrollo": ["Dos familias, la misma casa. Una fue a la corte.", "Familia A dejó un testamento. Familia B dejó su casa dentro de un living trust: un documento donde una persona que tú escoges administra tus cosas.", "Cuando el papá falta, la Familia A presenta el testamento ante la corte en muchos estados.", "En la Familia B, la persona que él eligió administra y entrega según lo escrito, en muchos casos sin pasar por la corte.", "La Familia A puede esperar meses para vender o rentar la casa. La Familia B puede decidir antes.", "Si tienes testamento, búscalo hoy y fíjate en qué año lo firmaste y si menciona la casa donde vives ahora.", "Las dos querían proteger a sus hijos. Lo que cambió fue el papel que firmaron.", "¿Cuál se parece a tu familia? Comenta CITA y lo revisamos."], "cta": "Comenta CITA y revisamos cuál se parece a tu familia", "caption": "Las dos familias querían lo mismo. Cambió el papel que firmaron.\nComenta CITA si quieres revisarlo con tu caso.", "calculadora": null, "notas": "[VALIDAR] la redacción legal con abogado por estado; no afirmar que siempre se evita la corte. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Problema común · abrir con una pregunta para votar", "formato": "Encuesta sobre foto", "contenido": "Si tienes testamento, ¿sabes si tu casa tendría que pasar por la corte?", "interaccion": "Encuesta: Sí / No / Ni sabía que podía pasar", "pasos": ["Toma una foto vertical con luz natural de: Esmeralda en su escritorio, mirando a la cámara.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «Si tienes testamento, ¿sabes si tu casa tendría que pasar por la corte?»", "Agrega el sticker Encuesta. Opciones: Sí / No / Ni sabía que podía pasar.", "Publícala a las 10:00 a. m."]}, {"proposito": "Problema común · contar la idea del día", "formato": "Texto sobre fondo de color", "contenido": "Si dijiste «creo que sí» en mi encuesta de ayer, ese es el problema: tu familia tampoco va a saber.", "interaccion": "Ninguna", "pasos": ["Abre una historia nueva con fondo liso verde #7b8e46 (en el modo Crear, o con el pincel: mantén presionado sobre la pantalla).", "Escribe en blanco, letra grande y centrada, máximo 3 líneas: «Si dijiste «creo que sí» en mi encuesta de ayer, ese es el problema: tu familia tampoco va a saber.».", "Sin sticker.", "Publícala a las 7:00 p. m."]}], "instrucciones": ["Formato: carrusel de 8 slides, vertical 4:5 (1080 x 1350 px). Fondo crema #f4f2ed. Títulos en negro con letra gruesa (Montserrat Bold u Open Sans Bold). Texto normal en gris #686664. En cada slide, una sola cosa en verde #7b8e46: el número o la palabra más importante. Máximo 25 palabras por slide y mucho espacio en blanco.", "Slide 1 (portada): Dos casas iguales dibujadas, una con camino recto y otra con camino que pasa por un juzgado. Texto grande: «Dos familias, la misma casa. Una fue a la corte». Es lo único que se lee en la portada; tiene que entenderse en 2 segundos.", "Slide 2: «Familia A dejó un testamento. Familia B dejó su casa dentro de un living trust: un documento donde una persona que tú escoges administra tus cosas.»", "Slide 3: «Cuando el papá falta, la Familia A presenta el testamento ante la corte en muchos estados.»", "Slide 4: «En la Familia B, la persona que él eligió administra y entrega según lo escrito, en muchos casos sin pasar por la corte.»", "Slide 5: «La Familia A puede esperar meses para vender o rentar la casa. La Familia B puede decidir antes.»", "Slide 6: «Si tienes testamento, búscalo hoy y fíjate en qué año lo firmaste y si menciona la casa donde vives ahora.»", "Slide 7: «Las dos querían proteger a sus hijos. Lo que cambió fue el papel que firmaron.»", "Slide 8 (cierre): «¿Cuál se parece a tu familia? Comenta CITA y lo revisamos.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Martes"}, {"fecha": "2027-01-20", "cuenta": "LT", "semana": 8, "formato": "Reel", "objetivo": "Venta", "tema": "Parejas que no están casadas", "tipo_gancho": "Situación", "gancho_texto": "Vives con tu pareja pero no están casados", "gancho_hablado": "Si vives con tu pareja y no están casados, escucha esto: si a uno le pasa algo, el otro se puede quedar afuera del hospital sin poder decidir.", "visual": "Sketch: una persona en la sala de espera de un hospital recibe un «lo siento, solo familiares».", "desarrollo": ["Según una encuesta nacional de 2026, 68% de las parejas en una relación seria que no están casadas no tiene ningún documento.", "Sin un documento, tu pareja no puede tomar decisiones médicas por ti. Y en la mayoría de los estados tampoco recibe nada si no hay testamento.", "Si la casa está solo a nombre de uno, el otro se puede quedar sin casa.", "Uno: decidan quién toma decisiones médicas por el otro y déjenlo firmado.", "Dos: revisen a nombre de quién está la casa o el contrato de renta.", "Tres: pongan a su pareja como beneficiaria donde quieran que lo sea.", "En el hospital no preguntan cuántos años llevan juntos. Piden un papel.", "Comenta CITA y vemos qué les falta a los dos."], "cta": "Comenta CITA y vemos qué les falta a los dos", "caption": "Años juntos, hijos, casa… y para el hospital no eres familia.\nSi vives en pareja sin casarte, comenta CITA y vemos qué les falta.", "calculadora": 16, "notas": "[VALIDAR] por estado las decisiones médicas y la herencia de parejas no casadas. Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Romper una duda: «Ya lo tengo resuelto» · abrir con una pregunta para votar", "formato": "Encuesta sobre foto de una carpeta con papeles", "contenido": "¿Cuándo revisaste tus papeles por última vez?", "interaccion": "Encuesta: Este año / Hace años / Nunca los hice", "pasos": ["Toma una foto vertical con luz natural de: una carpeta con papeles.", "Escribe arriba, máximo 3 líneas, letras negras sobre una caja crema #f4f2ed, sin tapar caras: «¿Cuándo revisaste tus papeles por última vez?»", "Agr  que no están casadas no tiene ningún documento.»", "Toma 3 (20 a 30 s): «Sin un documento, tu pareja no puede tomar decisiones médicas por ti. Y en la mayoría de los estados tampoco recibe nada si no hay testamento.»", "Toma 4 (30 a 36 s): «Si la casa está solo a nombre de uno, el otro se puede quedar sin casa.»", "Toma 5 (36 a 41 s): «Uno: decidan quién toma decisiones médicas por el otro y déjenlo firmado.»", "Toma 6 (41 a 47 s): «Dos: revisen a nombre de quién está la casa o el contrato de renta.»", "Toma 7 (47 a 52 s): «Tres: pongan a su pareja como beneficiaria donde quieran que lo sea.»", "Toma 8 (52 a 57 s): «En el hospital no preguntan cuántos años llevan juntos. Piden un papel.»", "Toma 9 (57 a 61 s): «Comenta CITA y vemos qué les falta a los dos.»", "Texto en pantalla 1 (segundo 0 a 3): «Vives con tu pareja pero no están casados», máximo 2 líneas, arriba, sin tapar la cara, letras negras sobre una caja crema #f4f2ed, letra gruesa grande.", "Texto en pantalla 2 (últimos 3 s): «Comenta CITA y vemos qué les falta a los dos». La palabra CITA en verde #7b8e46.", "Edición: corta silencios y respiraciones; sin intro ni logo al inicio. Subtítulos palabra por palabra en todo el video, letra blanca con borde negro, en la parte baja central. Zoom suave (al 110 %) en la frase «En el hospital no preguntan cuántos años llevan juntos. Piden un papel.». Música instrumental suave al 10 % de volumen, o sin música. Duración final cerca de 61 s (entre 45 y 70 s); si pasa de 70 s, quita una frase del medio, nunca el gancho ni el cierre. No aceleres la voz.", "Portada: el cuadro de la toma 1 donde Esmeralda mira a cámara, con el texto «Vives con tu pareja pero no están casados».", "Publicación: 6:00 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Comparte el reel en tus historias 30 minutos después.", "Comentarios y mensajes (el mismo día, en uesta nacional de 2026).»", "Slide 3: «Tu carro, tu cuenta de banco, tu ahorro para el retiro. Todo eso tiene que pasar a alguien.»", "Slide 4: «Tus hijos: ¿quién los cuida si tú no puedes?»", "Slide 5: «Tu salud: ¿quién habla por ti en el hospital?»", "Slide 6: «Que rentes no cambia nada de lo anterior.»", "Slide 7: «Esta semana escribe tres nombres: quién cuida a tus hijos, quién decide por ti en el hospital y quién recibe tus cuentas.»", "Slide 8 (cierre): «Comenta PAPELES y te mando la lista para empezar.». La palabra clave va en grande y en verde #7b8e46. Logo de Esmeralda pequeño abajo.", "En los slides 2 a 7: la primera frase va arriba en negro y grande; si hay una segunda frase, va debajo en gris y más pequeña.", "Revisión antes de publicar: ningún slide pasa de 25 palabras, las cifras van escritas igual que aquí y el logo solo aparece pequeño en el último slide.", "Publicación: 12:30 p. m., hora local de la audiencia. Si las estadísticas de Instagram muestran otra hora pico, publícalo 1 o 2 horas antes de esa hora. Pega el caption tal cual, con sus saltos de línea. Si quieres, agrega música suave de la biblioteca de Instagram.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba PAPELES, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Gracias por escribir. Aquí tienes la lista de lo que tu familia va a necesitar si un día te pasa algo: [enlace a la lista]. Llénala con calma y, si te sale una duda, me escribes por aquí.». Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Martes"}, {"fecha": "2027-01-27", "cuenta": "LT", "semana": 9, "formato": "Reel", "objetivo": "Venta", "tema": "Diagnóstico express: papá que renta", "tipo_gancho": "Resultados", "gancho_texto": "Renta, dos hijos y cero papeles", "gancho_hablado": "Este us historias 30 minutos después.", "Comentarios y mensajes (el mismo día, en menos de 2 horas): a quien comente o escriba CITA, contéstale en público «Te lo mando por mensaje» y envíale este DM: «¡Hola, (nombre)! Qué gusto que quieras revisar tu caso. Aquí puedes escoger el día y la hora que mejor te quede: [enlace de agenda]. Si prefieres que te llamemos, déjame tu número y el mejor horario. La orientación es educativa: vemos qué tienes y qué te falta.». Si en 24 horas no agenda, mándale un recordatorio amable y avísale a Esmeralda del nuevo prospecto ese mismo día. Si alguien pregunta algo legal de su caso, no lo contestes tú: pásaselo a Esmeralda.", "Antes de publicar: si las notas dicen [VALIDAR] o [caso real a confirmar], no se publica hasta que Esmeralda lo apruebe."], "dia": "Miércoles"}, {"fecha": "2027-01-28", "cuenta": "LT", "semana": 9, "formato": "Imagen", "objetivo": "Autoridad", "tema": "Frase: cualquiera que tenga a quién cuidar", "tipo_gancho": "Frase célebre", "gancho_texto": "Esto lo necesita cualquiera que tenga a quién cuidar", "gancho_hablado": "Esto lo necesita cualquiera que tenga a quién cuidar.", "visual": "Foto de manos de una mamá con las de un niño, frase encima con firma de Esmeralda.", "desarrollo": ["Esto lo necesita cualquiera que tenga a quién cuidar.", "Esmeralda Espinoza"], "cta": "Etiqueta a alguien que cuida a su familia", "caption": "No hace falta una mansión para tener algo que proteger.\nEtiqueta a alguien que cuida a su familia.", "calculadora": null, "notas": "Contenido educativo; Esmeralda no da asesoría legal.", "historias": [{"proposito": "Caja de preguntas / respuesta · juntar preguntas", "formato": "Caja de preguntas sobre selfie", "contenido": "Última semana de enero. ¿Qué duda te queda sobre tus papeles?", "interaccion": "Caja de preguntas", "pasos": ["Esmeralda graba con la cámara frontal del celular, en vertical y a la altura de los ojos, con una ventana delante (la luz le da en la cara). Máximo 15 segundos.", "Dice
